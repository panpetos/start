<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статья — psytalk.pro</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/layout.js"></script>
    <script src="/js/articles.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #FAFAFA; min-height: 100vh; display: flex; flex-direction: column; color: #1A1A1A; }
        main { flex: 1; }
        .art-hero { padding: 5rem 1rem 3rem; text-align: center; color: #fff; }
        .art-hero .emoji { font-size: 3rem; margin-bottom: 1rem; }
        .art-hero .tag { display: inline-block; background: rgba(255,255,255,0.25); border-radius: 2rem; padding: 0.2rem 0.85rem; font-size: 0.8rem; font-weight: 600; margin-bottom: 1rem; }
        .art-hero h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 800; max-width: 760px; margin: 0 auto 0.75rem; line-height: 1.2; letter-spacing: -0.02em; }
        .art-hero .meta { opacity: 0.9; font-size: 0.9rem; }
        .art-body { max-width: 720px; margin: -1.5rem auto 0; background: #fff; border-radius: 1.25rem; padding: 2.5rem; box-shadow: 0 4px 24px rgba(0,0,0,0.07); border: 1px solid #F0ECF8; position: relative; }
        .art-body p { color: #374151; line-height: 1.8; margin-bottom: 1.1rem; font-size: 1.0625rem; }
        .art-body h2 { font-size: 1.25rem; font-weight: 700; margin: 1.75rem 0 0.6rem; color: #1A1A1A; }
        .art-body a { color: #7C3AED; }
        .art-cta { max-width: 720px; margin: 1.5rem auto 4rem; background: linear-gradient(135deg,#F3E8FF,#EDE9FF); border-radius: 1.25rem; padding: 2rem; text-align: center; }
        .art-cta h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; }
        .art-cta p { color: #6B7280; margin-bottom: 1.25rem; }
        .btn-primary { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.85rem 2rem; background: linear-gradient(135deg,#7C3AED,#9F67FA); color: #fff; text-decoration: none; border-radius: 0.875rem; font-weight: 700; box-shadow: 0 4px 14px rgba(124,58,237,0.35); }
        .back { display: inline-flex; align-items: center; gap: 0.4rem; color: #7C3AED; text-decoration: none; font-weight: 600; font-size: 0.9rem; margin: 1.5rem auto 0; max-width: 720px; padding: 0 0.5rem; }
    </style>
</head>
<body>
    <script>psyWriteHeader();</script>
    <main>
        <div id="art"></div>
        <a href="/blog.html" class="back" style="display:flex;">← Все статьи</a>
    </main>
    <script>psyWriteFooter();</script>
    <script>
        function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
        const id = new URLSearchParams(location.search).get('id');
        const list = window.PSY_ARTICLES || [];
        const a = list.find(x => x.id === id) || null;
        const el = document.getElementById('art');
        if (!a) {
            el.innerHTML = '<div style="text-align:center;padding:5rem 1rem;"><h1 style="margin-bottom:1rem;">Статья не найдена</h1><a href="/blog.html" class="btn-primary">← В блог</a></div>';
        } else {
            document.title = a.title + ' — psytalk.pro';
            el.innerHTML =
                `<div class="art-hero" style="background:linear-gradient(135deg,#7C3AED 0%,#9F67FA 60%,#C4B5FD 100%);">
                    <div class="emoji">${a.emoji}</div>
                    <div class="tag">${esc(a.tag)}</div>
                    <h1>${esc(a.title)}</h1>
                    <div class="meta">${esc(a.read)} чтения</div>
                </div>
                <article class="art-body">${a.body.map(p => p.startsWith('<h2') ? p : '<p>'+p+'</p>').join('')}</article>
                <div class="art-cta">
                    <h3>Нужна поддержка?</h3>
                    <p>Подберите психолога, который понимает именно ваш запрос.</p>
                    <a href="/search.html" class="btn-primary">Найти психолога</a>
                </div>`;
        }
        try { if (window.lucide) lucide.createIcons(); } catch(e){}
    </script>
</body>
</html>
