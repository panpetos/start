; Настройки PHP для psytalk.pro (читаются PHP-FPM для этой папки и вложенных).
;
; ЗАЧЕМ ЭТОТ ФАЙЛ. Из приложения приходилось входить заново чуть ли не каждый раз.
; Причина в стандартных настройках PHP: кука сессии жила «до закрытия браузера», а
; сама сессия на сервере считалась протухшей через 24 минуты без обращений. Для сайта,
; который держат установленным на телефоне, это означает «войди ещё раз» после каждой
; паузы или перезапуска приложения.
;
; Настройки авторизации живут в api/auth.php, а он серверный и в репозитории его нет —
; поэтому меняем не код, а параметры самого PHP. Это штатный способ: файл .user.ini
; действует на всю папку сайта, PHP перечитывает его раз в 5 минут.

; Вход помнится 60 дней — и куку браузер хранит столько же, и сессия на сервере
; столько же считается живой.
session.gc_maxlifetime = 5184000
session.cookie_lifetime = 5184000

; Кука доступна только серверу (JavaScript её не видит) и только по https.
session.cookie_httponly = On
session.cookie_secure = On
; Lax — кука доходит при обычных переходах по ссылкам, но не уезжает на чужие сайты.
session.cookie_samesite = "Lax"
; Сервер не принимает произвольный идентификатор сессии, выдуманный снаружи.
session.use_strict_mode = On
session.use_only_cookies = On

; Загрузки: голосовые, кружки и файлы бывают крупными.
upload_max_filesize = 64M
post_max_size = 64M
