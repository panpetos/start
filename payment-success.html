<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата прошла успешно - psytalk.pro</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .success-icon svg {
            color: white;
        }

        h1 {
            color: #333;
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .info-box {
            background: #e8f5e9;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: left;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
        }

        .info-label {
            color: #666;
        }

        .info-value {
            font-weight: 600;
            color: #333;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .secondary-link {
            display: block;
            margin-top: 1rem;
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="success-icon">
            <i data-lucide="check" style="width: 50px; height: 50px;"></i>
        </div>

        <h1>Оплата прошла успешно!</h1>
        <p>Ваша запись на консультацию подтверждена. Психолог получит уведомление о вашей записи.</p>

        <div class="info-box" id="appointmentInfo" style="display:none">
            <div class="info-row">
                <span class="info-label">Номер записи:</span>
                <span class="info-value" id="appointmentId">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">Статус:</span>
                <span class="info-value" style="color: #28a745;">Подтверждено</span>
            </div>
        </div>

        <p style="font-size: 0.9rem;">
            📧 Подробности отправлены на вашу электронную почту
        </p>

        <a href="/client-dashboard.html" class="btn">
            Перейти в личный кабинет
        </a>

        <a href="/" class="secondary-link">На главную</a>
    </div>

    <script>
        // Получить ID записи из URL
        const urlParams = new URLSearchParams(window.location.search);
        const appointmentId = urlParams.get('appointment_id');

        if (appointmentId) {
            document.getElementById('appointmentId').textContent = appointmentId.substring(0, 8).toUpperCase();
            document.getElementById('appointmentInfo').style.display = '';
        }

        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    </script>
</body>

</html>
