<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Консультация — psytalk.pro</title>
  <style>
    body { font-family: 'Inter', -apple-system, sans-serif; background: #F4F0FF; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
    .box { text-align: center; color: #6B7280; }
    .spin { width: 40px; height: 40px; border: 3px solid #EDE9FF; border-top-color: #7C3AED; border-radius: 50%; animation: r 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <p>Открываем чат и видеосвязь...</p>
  </div>
  <script>
    // Реальные видеозвонки и чат живут на /chat.html. Перенаправляем туда.
    var p = new URLSearchParams(location.search);
    var user = p.get('user');
    location.replace(user ? ('/chat.html?user=' + encodeURIComponent(user)) : '/chat.html');
  </script>
</body>
</html>
