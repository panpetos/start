<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Психолог — psytalk.pro</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/layout.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/post-format.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--pp-bg); min-height: 100vh; display: flex; flex-direction: column; color: var(--pp-text); padding-top: 84px; transition: background 0.2s, color 0.2s; }
        :root { --pp-bg:#FAFAFA; --pp-text:#1A1A1A; --pp-text-sec:#6B7280; --pp-text-desc:#374151; --pp-card:#fff; --pp-card-border:#F0ECF8; --pp-review-bg:#FAFAFA; --pp-review-border:#F0F0F0; --pp-border:#F0F0F0; --pp-input-border:#E5E7EB; --pp-star-empty:#E5E7EB; --pp-fmt-bg:#F3E8FF; --pp-verified-bg:#F0FDF4; --pp-verified-border:#BBF7D0; }
        body.dark { --pp-bg:#191919; --pp-text:#E6E6E6; --pp-text-sec:#A0A0A0; --pp-text-desc:#C0C0C0; --pp-card:#252525; --pp-card-border:#333; --pp-review-bg:#2A2A2A; --pp-review-border:#333; --pp-border:#333; --pp-input-border:#444; --pp-star-empty:#444; --pp-fmt-bg:#2D1F4E; --pp-verified-bg:#1A2E1A; --pp-verified-border:#205C20; }
        main { flex: 1; }
        .wrap { max-width: 820px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
        .back { color: #7C3AED; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
        .card { background: var(--pp-card); border-radius: 1.25rem; border: 1px solid var(--pp-card-border); box-shadow: 0 2px 12px rgba(0,0,0,0.05); padding: 1.75rem; margin-top: 1rem; }
        .top { display: flex; gap: 1.5rem; align-items: flex-start; flex-wrap: wrap; }
        .ava { width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 2.25rem; font-weight: 700; flex-shrink: 0; overflow: hidden; }
        .ava img { width: 100%; height: 100%; object-fit: cover; }
        .name { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; }
        .spec { color: #7C3AED; font-weight: 600; margin-top: 0.25rem; }
        .meta { display: flex; gap: 1.25rem; flex-wrap: wrap; color: var(--pp-text-sec); font-size: 0.9rem; margin-top: 0.6rem; }
        .verified { display: inline-flex; align-items: center; gap: 0.25rem; background: var(--pp-verified-bg); color: #16A34A; border: 1px solid var(--pp-verified-border); border-radius: 2rem; padding: 0.15rem 0.6rem; font-size: 0.75rem; font-weight: 700; }
        body.dark .verified { color: #4ADE80; }
        .fmts { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; }
        .fmt { background: var(--pp-fmt-bg); color: #7C3AED; border-radius: 2rem; padding: 0.2rem 0.75rem; font-size: 0.8rem; font-weight: 600; }
        body.dark .fmt { color: #B794F4; }
        h2 { font-size: 1.2rem; margin: 1.75rem 0 0.75rem; }
        p.desc { color: var(--pp-text-desc); line-height: 1.7; }
        .price-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--pp-border); }
        .price { font-size: 1.5rem; font-weight: 800; color: var(--pp-text); }
        .btn-book { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.9rem 2.25rem; background: linear-gradient(135deg,#7C3AED,#9F67FA); color: #fff; text-decoration: none; border-radius: 0.875rem; font-weight: 700; box-shadow: 0 4px 14px rgba(124,58,237,0.35); }
        .review { background: var(--pp-review-bg); border: 1px solid var(--pp-review-border); border-radius: 1rem; padding: 1rem 1.25rem; margin-bottom: 0.75rem; }
        .review .r-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem; }
        .review .r-name { font-weight: 600; }
        .stars { color: #F59E0B; }
        .stars .empty { color: var(--pp-star-empty); }
        .rev-form textarea { width: 100%; border: 1.5px solid var(--pp-input-border); border-radius: 0.75rem; padding: 0.75rem; font-family: inherit; font-size: 0.9rem; resize: vertical; min-height: 80px; outline: none; background: var(--pp-card); color: var(--pp-text); }
        .star-pick span { font-size: 1.6rem; cursor: pointer; color: var(--pp-star-empty); }
        .star-pick span.on { color: #F59E0B; }
        .btn-sec { padding: 0.7rem 1.5rem; border: none; border-radius: 0.75rem; background: linear-gradient(135deg,#7C3AED,#9F67FA); color: #fff; font-weight: 700; cursor: pointer; font-family: inherit; }
    </style>
</head>
<body>
    <script>(function(){var t=localStorage.getItem('psy-theme')||'light';if(t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme:dark)').matches))document.body.classList.add('dark');})()</script>
    <script>psyWriteHeader();</script>
    <main>
        <div class="wrap">
            <a href="/search.html" class="back">← В каталог</a>
            <div id="profile"><div class="card">Загрузка...</div></div>
        </div>
    </main>
    <script>psyWriteFooter();</script>
    <script>
        const AV = ['#7C3AED','#2563EB','#059669','#D97706','#DB2777','#0891B2','#9F67FA'];
        function colorFor(x){ let h=0,s=String(x); for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0; return AV[h%AV.length]; }
        function esc(s){ const d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
        function stars(n){ n=Math.round(n||0); let o=''; for(let i=1;i<=5;i++) o+= i<=n?'★':'<span class="empty">★</span>'; return '<span class="stars">'+o+'</span>'; }
        const FMT={video:'📹 Видео',chat:'💬 Чат',phone:'📞 Звонок',audio:'📞 Аудио'};

        const id = new URLSearchParams(location.search).get('id');
        let psych = null, currentUser = null, pickRating = 5;

        async function load() {
            if (!id) { document.getElementById('profile').innerHTML = '<div class="card">Специалист не указан. <a href="/search.html">В каталог</a></div>'; return; }
            try { if (window.Auth) currentUser = await window.Auth.getCurrentUser(); } catch(e){}
            let data = null;
            try { const r = await fetch('/api/psychologists.php?action=get&id=' + encodeURIComponent(id), { credentials:'include' }); data = await r.json(); } catch(e){}
            if (!data || data.error || !data.id) { document.getElementById('profile').innerHTML = '<div class="card">😕 Специалист не найден. <a href="/search.html">В каталог</a></div>'; return; }
            psych = data;
            renderProfile();
            loadReviews();
        }

        function renderProfile() {
            const p = psych;
            const name = ((p.first_name||'')+' '+(p.last_name||'')).trim() || 'Психолог';
            const specs = (p.specialization||'').trim();
            const fmts = (Array.isArray(p.formats)&&p.formats.length?p.formats:['video']).map(f=>`<span class="fmt">${FMT[f]||f}</span>`).join('');
            const price = parseFloat(p.price)||0;
            const init = name.charAt(0).toUpperCase();
            document.getElementById('profile').innerHTML = `
                <div class="card">
                    <div class="top">
                        <div class="ava" style="background:${colorFor(p.id)};">${p.avatar?`<img src="${esc(p.avatar)}">`:init}</div>
                        <div style="flex:1;min-width:200px;">
                            <div class="name">${esc(name)} ${String(p.is_approved)==='1'?'<span class="verified">✓ Проверен</span>':''}</div>
                            <div class="spec">${esc(specs||'Психолог')}</div>
                            <div class="meta">
                                <span id="ratingLine">${stars(parseFloat(p.rating)||0)} <b>${(parseFloat(p.rating)||0).toFixed(1)}</b></span>
                                <span>${parseInt(p.experience,10)||0} лет опыта</span>
                            </div>
                            <div class="fmts">${fmts}</div>
                        </div>
                    </div>
                    ${p.description?`<h2>О специалисте</h2><p class="desc">${esc(p.description)}</p>`:''}
                    ${p.education?`<h2>Образование</h2><p class="desc">${esc(p.education)}</p>`:''}
                    ${p.not_working_with?`<h2>Не работает с запросами</h2><p class="desc">${esc(p.not_working_with)}</p>`:''}
                    <div class="price-row">
                        <div>${price>0?`<div class="price">${price.toLocaleString('ru-RU')} ₽</div><div style="color:#9CA3AF;font-size:0.85rem;">за разовую сессию</div>`:'<div class="price" style="font-size:1.1rem;color:#9CA3AF;">Цена уточняется</div>'}</div>
                        <a href="/book.html?id=${encodeURIComponent(p.id)}" class="btn-book">Записаться на разовую →</a>
                    </div>
                    ${price>0 ? renderPackages(price) : ''}
                </div>
                <div class="card" id="credsCard" style="display:none;"></div>
                <div class="card" id="channelCard" style="display:none;"></div>
                <div class="card" id="reviewsCard"><div style="color:#9CA3AF;">Загрузка отзывов...</div></div>`;
            loadCredentials();
            loadChannel();
            try { if (window.lucide) lucide.createIcons(); } catch(e){}
        }

        // ── Канал психолога (задача #29, MVP) ──
        let channelSubscribed = false;
        async function loadChannel() {
            const card = document.getElementById('channelCard');
            if (!card) return;
            let posts = [], info = { subscribers_count: 0, is_subscribed: false };
            try { const r = await fetch('/api/channels.php?action=posts&psychologist_id=' + encodeURIComponent(id)); const d = await r.json(); posts = (d && d.data) || []; } catch(e){}
            try { const r = await fetch('/api/channels.php?action=info&psychologist_id=' + encodeURIComponent(id), { credentials:'include' }); info = await r.json(); } catch(e){}
            channelSubscribed = !!info.is_subscribed;
            // Раньше карточка (вместе с кнопкой «Подписаться») полностью пряталась, если психолог ещё не
            // опубликовал ни одного поста — это был единственный способ подписаться на сайте, и он был
            // недоступен именно тогда, когда клиент впервые заходит на новый профиль. Теперь карточка канала
            // видна всегда, чтобы можно было подписаться заранее и увидеть посты, когда они появятся.
            card.style.display = 'block';
            if (!posts.length) {
                card.innerHTML = `
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.6rem;">
                        <h2 style="margin:0;">📢 Канал ${info.subscribers_count ? `<span style="color:var(--pp-text-sec);font-weight:500;font-size:0.85rem;">· ${info.subscribers_count} подписчиков</span>` : ''}</h2>
                        <button class="btn-sec" style="padding:0.5rem 1.1rem;font-size:0.85rem;${channelSubscribed ? 'background:var(--pp-review-bg);color:var(--pp-text);border:1.5px solid var(--pp-border);' : ''}" onclick="toggleChannelSubscribe()">${channelSubscribed ? '✓ Вы подписаны' : 'Подписаться'}</button>
                    </div>
                    <div style="margin-top:0.5rem;color:var(--pp-text-sec);font-size:0.88rem;">Специалист пока не публиковал посты. Подпишитесь, чтобы не пропустить, когда появятся.</div>`;
                return;
            }
            const postsHtml = posts.map(p => {
                const img = p.image_url ? `<img src="${esc(p.image_url)}" style="max-width:100%;border-radius:0.6rem;margin-top:0.5rem;">` : '';
                const text = p.text ? `<div style="color:var(--pp-text-desc);line-height:1.6;">${formatPostText(p.text)}</div>` : '';
                const date = new Date(p.created_at).toLocaleDateString('ru', { day:'numeric', month:'short' });
                return `<div id="post-${p.id}" style="border-bottom:1px solid var(--pp-border);padding:0.9rem 0;">
                    ${text}${img}
                    <div style="display:flex;align-items:center;gap:0.9rem;margin-top:0.5rem;">
                        <div style="color:var(--pp-text-sec);font-size:0.78rem;">${date}</div>
                        <button onclick="togglePostLike(${p.id}, this)" style="background:none;border:none;cursor:pointer;font-size:0.82rem;color:${p.liked_by_me?'#DC2626':'var(--pp-text-sec)'};font-weight:${p.liked_by_me?'700':'400'};display:inline-flex;align-items:center;gap:0.25rem;">${p.liked_by_me?'❤️':'🤍'} <span>${p.likes_count||0}</span></button>
                        <span style="color:var(--pp-text-sec);font-size:0.82rem;">👁 ${p.views_count||0}</span>
                        <button onclick="sharePost(${p.id})" style="background:none;border:none;cursor:pointer;font-size:0.82rem;color:var(--pp-text-sec);">↗ Поделиться</button>
                    </div>
                </div>`;
            }).join('');
            card.innerHTML = `
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.6rem;">
                    <h2 style="margin:0;">📢 Канал ${info.subscribers_count ? `<span style="color:var(--pp-text-sec);font-weight:500;font-size:0.85rem;">· ${info.subscribers_count} подписчиков</span>` : ''}</h2>
                    <button class="btn-sec" style="padding:0.5rem 1.1rem;font-size:0.85rem;${channelSubscribed ? 'background:var(--pp-review-bg);color:var(--pp-text);border:1.5px solid var(--pp-border);' : ''}" onclick="toggleChannelSubscribe()">${channelSubscribed ? '✓ Вы подписаны' : 'Подписаться'}</button>
                </div>
                <div style="margin-top:0.5rem;">${postsHtml}</div>`;
            posts.forEach(p => {
                fetch('/api/channels.php?action=view', {
                    method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
                    body: JSON.stringify({ post_id: p.id })
                }).catch(()=>{});
            });
        }
        async function toggleChannelSubscribe() {
            if (!currentUser) { window.location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname + location.search); return; }
            try {
                await fetch('/api/channels.php?action=' + (channelSubscribed ? 'unsubscribe' : 'subscribe'), {
                    method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
                    body: JSON.stringify({ psychologist_id: id })
                });
                await loadChannel();
            } catch(e) { alert('Ошибка соединения'); }
        }
        window.toggleChannelSubscribe = toggleChannelSubscribe;

        async function togglePostLike(postId, btn) {
            if (!currentUser) { window.location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname + location.search); return; }
            try {
                const r = await fetch('/api/channels.php?action=like', {
                    method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
                    body: JSON.stringify({ post_id: postId })
                });
                const d = await r.json();
                if (!d.ok) return;
                btn.style.color = d.liked ? '#DC2626' : 'var(--pp-text-sec)';
                btn.style.fontWeight = d.liked ? '700' : '400';
                btn.innerHTML = (d.liked ? '❤️' : '🤍') + ' <span>' + d.likes_count + '</span>';
            } catch(e) {}
        }
        window.togglePostLike = togglePostLike;

        function sharePost(postId) {
            const url = location.origin + '/psychologist-profile.html?id=' + encodeURIComponent(id) + '#post-' + postId;
            if (navigator.share) { navigator.share({ title:'psytalk.pro', url }).catch(()=>{}); }
            else if (navigator.clipboard) { navigator.clipboard.writeText(url).then(()=>alert('Ссылка скопирована: ' + url)).catch(()=>prompt('Скопируйте ссылку:', url)); }
            else prompt('Скопируйте ссылку:', url);
        }
        window.sharePost = sharePost;

        async function loadCredentials() {
            const card = document.getElementById('credsCard');
            if (!card) return;
            let rows = [];
            try { const r = await fetch('/api/credentials.php?action=list&psychologist_id=' + encodeURIComponent(id)); const d = await r.json(); rows = (d && d.data) || []; } catch(e){}
            if (!rows.length) { card.style.display = 'none'; return; }
            card.style.display = 'block';
            const items = rows.map(c => {
                const url = c.url || '';
                const isImg = /\.(png|jpe?g|webp|gif)$/i.test(url);
                if (isImg) {
                    return `<a href="${esc(url)}" target="_blank" rel="noopener" style="display:block;border:1px solid var(--pp-card-border);border-radius:0.6rem;overflow:hidden;">
                        <img src="${esc(url)}" alt="${esc(c.name||'Документ')}" style="width:100%;height:130px;object-fit:cover;display:block;"></a>`;
                }
                return `<a href="${esc(url)}" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:0.5rem;border:1px solid var(--pp-card-border);border-radius:0.6rem;padding:0.75rem;color:#7C3AED;text-decoration:none;font-size:0.85rem;font-weight:600;">📄 ${esc(c.name||'Документ')}</a>`;
            }).join('');
            card.innerHTML = `<h2 style="margin-top:0;">Дипломы и сертификаты</h2>
                <p style="color:var(--pp-text-sec);font-size:0.875rem;margin-bottom:0.9rem;">Подтверждающие документы специалиста.</p>
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:0.75rem;">${items}</div>`;
        }

        // ── Абонементы (пакеты сессий) к этому психологу ──
        function renderPackages(base) {
            const packs = [
                { sessions:5,  disc:10, badge:'Выгодно', validity:'3 месяца' },
                { sessions:10, disc:20, badge:'Максимум пользы', validity:'6 месяцев' }
            ];
            const cards = packs.map(p => {
                const per = Math.round(base * (100 - p.disc) / 100);
                const total = per * p.sessions;
                const old = base * p.sessions;
                return `<div style="flex:1;min-width:200px;border:1.5px solid var(--pp-card-border);border-radius:1rem;padding:1.1rem 1.2rem;background:var(--pp-card);">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.4rem;">
                        <b style="font-size:1.05rem;">${p.sessions} сессий</b>
                        <span style="background:var(--pp-verified-bg);color:#16A34A;border:1px solid var(--pp-verified-border);border-radius:2rem;padding:0.1rem 0.6rem;font-size:0.72rem;font-weight:700;">−${p.disc}%</span>
                    </div>
                    <div style="font-size:1.4rem;font-weight:800;color:#7C3AED;">${total.toLocaleString('ru-RU')} ₽</div>
                    <div style="color:var(--pp-text-sec);font-size:0.82rem;margin-bottom:0.1rem;"><s>${old.toLocaleString('ru-RU')} ₽</s> · ${per.toLocaleString('ru-RU')} ₽ за сессию</div>
                    <div style="color:var(--pp-text-sec);font-size:0.78rem;margin-bottom:0.7rem;">Действует ${p.validity} · экономия ${(old-total).toLocaleString('ru-RU')} ₽</div>
                    <button onclick="buyPackage(${p.sessions})" class="btn-sec" style="width:100%;padding:0.6rem;">Оформить абонемент</button>
                </div>`;
            }).join('');
            return `<h2 style="margin-bottom:0.5rem;">Абонементы — выгоднее</h2>
                <p style="color:var(--pp-text-sec);font-size:0.9rem;margin-bottom:0.9rem;">Купите пакет сессий с этим специалистом со скидкой. Баланс отображается в личном кабинете, каждая запись списывает одну сессию.</p>
                <div style="display:flex;gap:1rem;flex-wrap:wrap;">${cards}</div>`;
        }

        async function buyPackage(sessions) {
            if (!currentUser) { window.location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname + location.search); return; }
            const base = parseFloat(psych.price) || 0;
            const disc = sessions >= 10 ? 20 : (sessions >= 5 ? 10 : 0);
            const per = Math.round(base * (100 - disc) / 100);
            const total = per * sessions;
            if (!confirm('Оформить абонемент на ' + sessions + ' сессий за ' + total.toLocaleString('ru-RU') + ' ₽ (' + per.toLocaleString('ru-RU') + ' ₽ за сессию, скидка ' + disc + '%)?\n\nБаланс появится в личном кабинете, оттуда можно записываться без повторной оплаты.')) return;
            try {
                const r = await fetch('/api/packages.php?action=create', {
                    method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
                    body: JSON.stringify({ psychologist_id: psych.id, sessions })
                });
                const d = await r.json();
                if (!d.ok) { alert(d.error || 'Не удалось оформить абонемент'); return; }
                alert('Абонемент оформлен! Откройте личный кабинет, чтобы записаться по нему.');
                window.location.href = '/client-dashboard.html';
            } catch (e) { alert('Ошибка соединения'); }
        }
        window.buyPackage = buyPackage;

        async function loadReviews() {
            let res = { data:[], avg:0, count:0 };
            try { const r = await fetch('/api/reviews.php?action=list&psychologist_id=' + encodeURIComponent(id)); res = await r.json(); } catch(e){}
            const rows = res.data || [];
            if (res.count > 0) {
                const rl = document.getElementById('ratingLine');
                if (rl) rl.innerHTML = stars(res.avg) + ' <b>' + res.avg + '</b> <span style="color:#9CA3AF;">· ' + res.count + ' отз.</span>';
            }
            const isClient = currentUser && currentUser.role === 'client';
            const formHtml = currentUser ? `
                <h2>Оставить отзыв</h2>
                <div class="rev-form">
                    <div class="star-pick" id="starPick">${[1,2,3,4,5].map(i=>`<span data-v="${i}" onclick="setStar(${i})" class="${i<=pickRating?'on':''}">★</span>`).join('')}</div>
                    <textarea id="revText" placeholder="Поделитесь впечатлением о работе со специалистом..."></textarea>
                    <button class="btn-sec" style="margin-top:0.6rem;" onclick="submitReview()">Отправить отзыв</button>
                </div>` : `<p style="color:#6B7280;margin-top:0.5rem;"><a href="/login.html" style="color:#7C3AED;font-weight:600;">Войдите</a>, чтобы оставить отзыв.</p>`;
            document.getElementById('reviewsCard').innerHTML = `
                <h2 style="margin-top:0;">Отзывы ${res.count?`(${res.count})`:''}</h2>
                ${rows.length ? rows.map(rv=>`
                    <div class="review">
                        <div class="r-top"><span class="r-name">${esc(rv.author_name||'Клиент')}</span>${stars(rv.rating)}</div>
                        ${rv.text?`<div style="color:var(--pp-text-desc);line-height:1.6;font-size:0.9375rem;">${esc(rv.text)}</div>`:''}
                    </div>`).join('') : '<p style="color:#9CA3AF;">Пока нет отзывов — станьте первым.</p>'}
                ${formHtml}`;
        }
        function setStar(v){ pickRating=v; document.querySelectorAll('#starPick span').forEach(s=>s.classList.toggle('on', +s.dataset.v<=v)); }
        async function submitReview() {
            const text = (document.getElementById('revText')||{}).value || '';
            try {
                const r = await fetch('/api/reviews.php?action=add', {
                    method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
                    body: JSON.stringify({ psychologist_id: id, rating: pickRating, text: text.trim() })
                });
                const d = await r.json();
                if (d.ok) { alert('Спасибо за отзыв!'); loadReviews(); }
                else alert(d.error || 'Не удалось отправить');
            } catch(e){ alert('Ошибка соединения'); }
        }
        load();
    </script>
</body>
</html>
