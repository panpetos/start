<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Психолог — psytalk.pro</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/layout.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #FAFAFA; min-height: 100vh; display: flex; flex-direction: column; color: #1A1A1A; padding-top: 84px; }
        main { flex: 1; }
        .wrap { max-width: 820px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
        .back { color: #7C3AED; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
        .card { background: #fff; border-radius: 1.25rem; border: 1px solid #F0ECF8; box-shadow: 0 2px 12px rgba(0,0,0,0.05); padding: 1.75rem; margin-top: 1rem; }
        .top { display: flex; gap: 1.5rem; align-items: flex-start; flex-wrap: wrap; }
        .ava { width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 2.25rem; font-weight: 700; flex-shrink: 0; overflow: hidden; }
        .ava img { width: 100%; height: 100%; object-fit: cover; }
        .name { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; }
        .spec { color: #7C3AED; font-weight: 600; margin-top: 0.25rem; }
        .meta { display: flex; gap: 1.25rem; flex-wrap: wrap; color: #6B7280; font-size: 0.9rem; margin-top: 0.6rem; }
        .verified { display: inline-flex; align-items: center; gap: 0.25rem; background: #F0FDF4; color: #16A34A; border: 1px solid #BBF7D0; border-radius: 2rem; padding: 0.15rem 0.6rem; font-size: 0.75rem; font-weight: 700; }
        .fmts { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; }
        .fmt { background: #F3E8FF; color: #7C3AED; border-radius: 2rem; padding: 0.2rem 0.75rem; font-size: 0.8rem; font-weight: 600; }
        h2 { font-size: 1.2rem; margin: 1.75rem 0 0.75rem; }
        p.desc { color: #374151; line-height: 1.7; }
        .price-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #F0F0F0; }
        .price { font-size: 1.5rem; font-weight: 800; color: #1A1A1A; }
        .btn-book { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.9rem 2.25rem; background: linear-gradient(135deg,#7C3AED,#9F67FA); color: #fff; text-decoration: none; border-radius: 0.875rem; font-weight: 700; box-shadow: 0 4px 14px rgba(124,58,237,0.35); }
        .review { background: #FAFAFA; border: 1px solid #F0F0F0; border-radius: 1rem; padding: 1rem 1.25rem; margin-bottom: 0.75rem; }
        .review .r-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem; }
        .review .r-name { font-weight: 600; }
        .stars { color: #F59E0B; }
        .stars .empty { color: #E5E7EB; }
        .rev-form textarea { width: 100%; border: 1.5px solid #E5E7EB; border-radius: 0.75rem; padding: 0.75rem; font-family: inherit; font-size: 0.9rem; resize: vertical; min-height: 80px; outline: none; }
        .star-pick span { font-size: 1.6rem; cursor: pointer; color: #E5E7EB; }
        .star-pick span.on { color: #F59E0B; }
        .btn-sec { padding: 0.7rem 1.5rem; border: none; border-radius: 0.75rem; background: linear-gradient(135deg,#7C3AED,#9F67FA); color: #fff; font-weight: 700; cursor: pointer; font-family: inherit; }
    </style>
</head>
<body>
    <script>psyWriteHeader();</script>
    <main>
        <div class="wrap">
            <a href="/search.html" class="back">← В каталог</a>
            <div id="profile"><div class="card">Загрузка...</div></div>
        </div>
    </main>
    <script>psyWriteFooter();</script>
    <script>
        const AV = ['#7C3AED','#2563EB','#059669','#D97706','#DB2777','#0891B2','#9F67FA'];
        function colorFor(x){ let h=0,s=String(x); for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0; return AV[h%AV.length]; }
        function esc(s){ const d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
        function stars(n){ n=Math.round(n||0); let o=''; for(let i=1;i<=5;i++) o+= i<=n?'★':'<span class="empty">★</span>'; return '<span class="stars">'+o+'</span>'; }
        const FMT={video:'📹 Видео',chat:'💬 Чат',phone:'📞 Звонок',audio:'📞 Аудио'};

        const id = new URLSearchParams(location.search).get('id');
        let psych = null, currentUser = null, pickRating = 5;

        async function load() {
            if (!id) { document.getElementById('profile').innerHTML = '<div class="card">Специалист не указан. <a href="/search.html">В каталог</a></div>'; return; }
            try { if (window.Auth) currentUser = await window.Auth.getCurrentUser(); } catch(e){}
            let data = null;
            try { const r = await fetch('/api/psychologists.php?action=get&id=' + encodeURIComponent(id), { credentials:'include' }); data = await r.json(); } catch(e){}
            if (!data || data.error || !data.id) { document.getElementById('profile').innerHTML = '<div class="card">😕 Специалист не найден. <a href="/search.html">В каталог</a></div>'; return; }
            psych = data;
            renderProfile();
            loadReviews();
        }

        function renderProfile() {
            const p = psych;
            const name = ((p.first_name||'')+' '+(p.last_name||'')).trim() || 'Психолог';
            const specs = (p.specialization||'').trim();
            const fmts = (Array.isArray(p.formats)&&p.formats.length?p.formats:['video']).map(f=>`<span class="fmt">${FMT[f]||f}</span>`).join('');
            const price = parseFloat(p.price)||0;
            const init = name.charAt(0).toUpperCase();
            document.getElementById('profile').innerHTML = `
                <div class="card">
                    <div class="top">
                        <div class="ava" style="background:${colorFor(p.id)};">${p.avatar?`<img src="${esc(p.avatar)}">`:init}</div>
                        <div style="flex:1;min-width:200px;">
                            <div class="name">${esc(name)} ${String(p.is_approved)==='1'?'<span class="verified">✓ Проверен</span>':''}</div>
                            <div class="spec">${esc(specs||'Психолог')}</div>
                            <div class="meta">
                                <span id="ratingLine">${stars(parseFloat(p.rating)||0)} <b>${(parseFloat(p.rating)||0).toFixed(1)}</b></span>
                                <span>${parseInt(p.experience,10)||0} лет опыта</span>
                            </div>
                            <div class="fmts">${fmts}</div>
                        </div>
                    </div>
                    ${p.description?`<h2>О специалисте</h2><p class="desc">${esc(p.description)}</p>`:''}
                    ${p.education?`<h2>Образование</h2><p class="desc">${esc(p.education)}</p>`:''}
                    ${p.not_working_with?`<h2>Не работает с запросами</h2><p class="desc">${esc(p.not_working_with)}</p>`:''}
                    <div class="price-row">
                        <div>${price>0?`<div class="price">${price.toLocaleString('ru-RU')} ₽</div><div style="color:#9CA3AF;font-size:0.85rem;">за сессию</div>`:'<div class="price" style="font-size:1.1rem;color:#9CA3AF;">Цена уточняется</div>'}</div>
                        <a href="/book.html?id=${encodeURIComponent(p.id)}" class="btn-book">Записаться →</a>
                    </div>
                </div>
                <div class="card" id="reviewsCard"><div style="color:#9CA3AF;">Загрузка отзывов...</div></div>`;
            try { if (window.lucide) lucide.createIcons(); } catch(e){}
        }

        async function loadReviews() {
            let res = { data:[], avg:0, count:0 };
            try { const r = await fetch('/api/reviews.php?action=list&psychologist_id=' + encodeURIComponent(id)); res = await r.json(); } catch(e){}
            const rows = res.data || [];
            if (res.count > 0) {
                const rl = document.getElementById('ratingLine');
                if (rl) rl.innerHTML = stars(res.avg) + ' <b>' + res.avg + '</b> <span style="color:#9CA3AF;">· ' + res.count + ' отз.</span>';
            }
            const isClient = currentUser && currentUser.role === 'client';
            const formHtml = currentUser ? `
                <h2>Оставить отзыв</h2>
                <div class="rev-form">
                    <div class="star-pick" id="starPick">${[1,2,3,4,5].map(i=>`<span data-v="${i}" onclick="setStar(${i})" class="${i<=pickRating?'on':''}">★</span>`).join('')}</div>
                    <textarea id="revText" placeholder="Поделитесь впечатлением о работе со специалистом..."></textarea>
                    <button class="btn-sec" style="margin-top:0.6rem;" onclick="submitReview()">Отправить отзыв</button>
                </div>` : `<p style="color:#6B7280;margin-top:0.5rem;"><a href="/login.html" style="color:#7C3AED;font-weight:600;">Войдите</a>, чтобы оставить отзыв.</p>`;
            document.getElementById('reviewsCard').innerHTML = `
                <h2 style="margin-top:0;">Отзывы ${res.count?`(${res.count})`:''}</h2>
                ${rows.length ? rows.map(rv=>`
                    <div class="review">
                        <div class="r-top"><span class="r-name">${esc(rv.author_name||'Клиент')}</span>${stars(rv.rating)}</div>
                        ${rv.text?`<div style="color:#374151;line-height:1.6;font-size:0.9375rem;">${esc(rv.text)}</div>`:''}
                    </div>`).join('') : '<p style="color:#9CA3AF;">Пока нет отзывов — станьте первым.</p>'}
                ${formHtml}`;
        }
        function setStar(v){ pickRating=v; document.querySelectorAll('#starPick span').forEach(s=>s.classList.toggle('on', +s.dataset.v<=v)); }
        async function submitReview() {
            const text = (document.getElementById('revText')||{}).value || '';
            try {
                const r = await fetch('/api/reviews.php?action=add', {
                    method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
                    body: JSON.stringify({ psychologist_id: id, rating: pickRating, text: text.trim() })
                });
                const d = await r.json();
                if (d.ok) { alert('Спасибо за отзыв!'); loadReviews(); }
                else alert(d.error || 'Не удалось отправить');
            } catch(e){ alert('Ошибка соединения'); }
        }
        load();
    </script>
</body>
</html>
