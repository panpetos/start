<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <title>Приглашение — psytalk.pro</title>
    <meta name="description" content="Вас пригласили в psytalk.pro — онлайн-психологи, которые понимают удалённую работу. Первая консультация по специальной цене.">
    <link rel="stylesheet" href="/css/styles.css?v=20260823d">
    <script src="/js/netguard.js?v=20260821c"></script>
    <script src="/js/layout.js?v=20260823d"></script>
    <script src="/js/api.js?v=20260821"></script>
    <script src="/js/auth.js?v=20260821"></script>
    <script src="/js/referral.js?v=1"></script>
    <style>
        body { font-family: 'Inter', -apple-system, sans-serif; background: #FAFAFA; color: #1A1A1A;
               min-height: 100vh; display: flex; flex-direction: column; }
        body.dark { background: #191919; color: #E6E6E6; }
        main { flex: 1; }
        .inv-wrap { max-width: 620px; margin: 0 auto; padding: clamp(1.5rem, 5vw, 3rem) 1.25rem 4rem; }

        .inv-card {
            background: #fff; border: 1px solid #EFF7F3; border-radius: 1.25rem;
            padding: clamp(1.25rem, 4vw, 2rem); box-shadow: 0 4px 24px rgba(4,120,87,0.08);
        }
        body.dark .inv-card { background: #252525; border-color: #333; }

        .inv-from {
            display: flex; align-items: center; gap: 0.85rem; margin-bottom: 1.25rem;
            padding-bottom: 1.25rem; border-bottom: 1px solid #F0F0F0;
        }
        body.dark .inv-from { border-color: #333; }
        .inv-ava {
            width: 52px; height: 52px; flex-shrink: 0; border-radius: 50%;
            background: linear-gradient(135deg, #047857, #059669); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 1.35rem;
        }
        .inv-from-txt b { display: block; font-size: 1.02rem; }
        .inv-from-txt i { font-style: normal; color: #6B7280; font-size: 0.88rem; }

        .inv-h1 { font-size: clamp(1.5rem, 5vw, 2.1rem); line-height: 1.15; letter-spacing: -0.03em; margin-bottom: 0.6rem; }
        .inv-lead { color: #6B7280; font-size: clamp(0.95rem, 2.6vw, 1.05rem); line-height: 1.65; margin-bottom: 1.25rem; }
        body.dark .inv-lead, body.dark .inv-from-txt i { color: #A0A0A0; }

        .inv-perks { display: flex; flex-direction: column; gap: 0.7rem; margin-bottom: 1.5rem; }
        .inv-perk { display: flex; gap: 0.7rem; align-items: flex-start; font-size: 0.95rem; line-height: 1.5; }
        .inv-perk span:first-child { font-size: 1.15rem; line-height: 1.3; flex-shrink: 0; }
        .inv-perk b { display: block; }
        .inv-perk i { font-style: normal; color: #6B7280; font-size: 0.88rem; }
        body.dark .inv-perk i { color: #A0A0A0; }

        .inv-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            width: 100%; min-height: 52px; padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #047857, #059669); color: #fff;
            border: none; border-radius: 0.875rem; text-decoration: none;
            font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 16px rgba(4,120,87,0.3); transition: transform .18s, box-shadow .18s;
        }
        .inv-btn:hover { color: #fff; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(4,120,87,0.4); }
        .inv-btn-ghost {
            background: #fff; color: #047857; border: 2px solid #047857; box-shadow: none;
        }
        .inv-btn-ghost:hover { background: #ECFDF5; color: #047857; }
        body.dark .inv-btn-ghost { background: transparent; color: #6EE7B7; border-color: #34D399; }
        .inv-note { color: #9CA3AF; font-size: 0.82rem; text-align: center; margin-top: 0.75rem; line-height: 1.5; }

        /* ── Своя ссылка ─────────────────────────────────────────────────────── */
        .inv-link-row {
            display: flex; gap: 0.5rem; align-items: stretch; margin: 1rem 0 0.5rem; flex-wrap: wrap;
        }
        .inv-link {
            flex: 1 1 220px; min-width: 0; font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 0.95rem; padding: 0.7rem 0.85rem; border: 1.5px solid #A7F3D0;
            border-radius: 0.7rem; background: #ECFDF5; color: #065F46;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        body.dark .inv-link { background: #10402F; border-color: #17553E; color: #A7F3D0; }
        .inv-mini {
            border: none; border-radius: 0.7rem; padding: 0.7rem 1rem; cursor: pointer;
            font-family: inherit; font-size: 0.9rem; font-weight: 700;
            background: #047857; color: #fff; white-space: nowrap;
        }
        .inv-mini.sec { background: #F3F4F6; color: #4B5563; }
        body.dark .inv-mini.sec { background: #2A2A2A; color: #C9C9C9; }

        .inv-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.6rem; margin: 1.25rem 0; }
        .inv-stat { background: #FAFAFC; border: 1px solid #EFF7F3; border-radius: 0.9rem; padding: 0.9rem; text-align: center; }
        body.dark .inv-stat { background: #232323; border-color: #333; }
        .inv-stat b { display: block; font-size: 1.6rem; font-weight: 800; color: #047857; line-height: 1.1; }
        body.dark .inv-stat b { color: #6EE7B7; }
        .inv-stat i { font-style: normal; color: #6B7280; font-size: 0.8rem; }
        body.dark .inv-stat i { color: #A0A0A0; }

        .inv-list { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.5rem; }
        .inv-item {
            display: flex; justify-content: space-between; gap: 0.75rem; align-items: center;
            padding: 0.55rem 0.75rem; border-radius: 0.6rem; background: #FAFAFC; font-size: 0.9rem;
        }
        body.dark .inv-item { background: #232323; }
        .inv-item i { font-style: normal; color: #9CA3AF; font-size: 0.8rem; white-space: nowrap; }

        .inv-sec-title {
            font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.04em; color: #9CA3AF; margin: 1.5rem 0 0.5rem;
        }
        .inv-skel { color: #9CA3AF; font-size: 0.92rem; padding: 1rem 0; text-align: center; }
    </style>
</head>
<body>
    <script>psyWriteHeader();</script>

    <main>
        <div class="inv-wrap">
            <div id="invBody" class="inv-card">
                <div class="inv-skel">Загружаем приглашение…</div>
            </div>
        </div>
    </main>

    <script>psyWriteFooter();</script>

    <script>
        // ══════════════════════════════════════════════════════════════════════
        //  СТРАНИЦА ПРИГЛАШЕНИЯ — ДВА СОСТОЯНИЯ В ОДНОЙ
        //
        //  Гостю с чужим кодом показываем посадочную: кто позвал, что это за
        //  сервис, чем поможет, и одну большую кнопку. Своему — его собственную
        //  ссылку со счётчиками и списком приглашённых.
        //
        //  Одна страница вместо двух намеренно: ссылку часто пересылают дальше по
        //  цепочке, и человек, который уже зарегистрирован, попадает сюда же —
        //  пусть видит не «зарегистрируйтесь», а свою ссылку.
        // ══════════════════════════════════════════════════════════════════════
        const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
            c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        function codeFromUrl() {
            try { return (window.psyReferral && psyReferral.fromUrl()) || ''; } catch (e) { return ''; }
        }

        function guestHtml(inviterName, priceLine) {
            const initial = (inviterName || '?').trim().charAt(0).toUpperCase();
            const from = inviterName ? `
                <div class="inv-from">
                    <div class="inv-ava">${esc(initial)}</div>
                    <div class="inv-from-txt">
                        <b>${esc(inviterName)}</b>
                        <i>приглашает вас в psytalk.pro</i>
                    </div>
                </div>` : '';
            return `
                ${from}
                <h1 class="inv-h1">Психолог, который понимает удалённую работу</h1>
                <p class="inv-lead">Выгорание, синдром самозванца, стресс дедлайнов, баланс работы и жизни.
                   Онлайн, с любого устройства, без установки программ.</p>
                <div class="inv-perks">
                    <div class="inv-perk"><span>🎯</span><div><b>Подбор за минуту</b>
                        <i>четыре вопроса — и вы видите подходящих специалистов, а не весь список</i></div></div>
                    <div class="inv-perk"><span>💬</span><div><b>Чат с психологом между сессиями</b>
                        <i>голосовые, файлы, поиск по переписке — и ИИ-ассистент, который отвечает круглосуточно</i></div></div>
                    <div class="inv-perk"><span>🔒</span><div><b>Конфиденциально</b>
                        <i>защищённое соединение, данные карты на сайте не хранятся</i></div></div>
                    <div class="inv-perk"><span>🔄</span><div><b>Не подошёл психолог — заменим бесплатно</b>
                        <i>подберём другого, доплачивать не нужно</i></div></div>
                </div>
                <a class="inv-btn" href="/login.html?tab=register" id="invGo">Создать аккаунт</a>
                <div class="inv-note">${esc(priceLine || 'Первая консультация по специальной цене')}<br>
                    Уже есть аккаунт? <a href="/login.html" style="color:#047857;font-weight:600;">Войти</a></div>`;
        }

        function mineHtml(d) {
            const by = d.invited_by
                ? `<div class="inv-note" style="text-align:left;margin-top:0.9rem;">Вас пригласил(а): <b>${esc(d.invited_by)}</b></div>`
                : '';
            return `
                <h1 class="inv-h1">Пригласить в psytalk.pro</h1>
                <p class="inv-lead">Ваша личная ссылка. Тот, кто перейдёт по ней и создаст аккаунт,
                   отметится как приглашённый вами.</p>
                <div class="inv-link-row">
                    <div class="inv-link" id="invLink" title="${esc(d.link)}">${esc(d.link)}</div>
                    <button class="inv-mini" onclick="copyLink()">Скопировать</button>
                    <button class="inv-mini sec" onclick="shareLink()" id="invShareBtn">Поделиться</button>
                </div>
                <div class="inv-stats">
                    <div class="inv-stat"><b>${d.clicks || 0}</b><i>переходов по ссылке</i></div>
                    <div class="inv-stat"><b>${d.joined || 0}</b><i>создали аккаунт</i></div>
                </div>
                ${by}
                <div class="inv-sec-title">Кого вы пригласили</div>
                <div class="inv-list" id="invList"><div class="inv-skel">Загружаем…</div></div>`;
        }

        let myLink = '';

        async function copyLink() {
            try {
                if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(myLink);
                else {
                    // Запасной путь для старых браузеров и http: без него кнопка молчала
                    const ta = document.createElement('textarea');
                    ta.value = myLink; ta.style.position = 'fixed'; ta.style.opacity = '0';
                    document.body.appendChild(ta); ta.select();
                    document.execCommand('copy'); ta.remove();
                }
                alert('Ссылка скопирована');
            } catch (e) { alert('Не удалось скопировать. Ссылка: ' + myLink); }
        }
        async function shareLink() {
            const data = {
                title: 'psytalk.pro',
                text: 'Психологи, которые понимают удалённую работу. Присоединяйся:',
                url: myLink
            };
            // navigator.share есть не везде — там просто копируем
            if (navigator.share) { try { await navigator.share(data); return; } catch (e) { return; } }
            copyLink();
        }
        window.copyLink = copyLink;
        window.shareLink = shareLink;

        /** Цена первой сессии — та же строка, что на главной. */
        async function priceLine() {
            try {
                const s = await (await fetch('/api/settings.php?action=public')).json();
                const rub = n => { const v = parseInt(n, 10); return isNaN(v) ? null : v.toLocaleString('ru-RU') + ' ₽'; };
                const enabled = String(s.promo_self_enabled || '0') === '1';
                const raw = (s.promo_self_deadline || '').trim();
                const iso = raw && raw.length <= 16 ? raw + ':00+03:00' : raw;
                const dl = raw ? new Date(iso) : null;
                const valid = dl && !isNaN(dl.getTime()) && dl > new Date();
                if (enabled && valid && s.promo_self_price) return 'Первая сессия всего ' + rub(s.promo_self_price);
                const base = rub(s.price_self);
                return base ? ('Первая сессия — ' + base) : '';
            } catch (e) { return ''; }
        }

        async function loadInvitees() {
            const box = document.getElementById('invList');
            if (!box) return;
            try {
                const d = await (await fetch('/api/referrals.php?action=list', { credentials: 'include' })).json();
                const rows = (d && d.data) || [];
                box.innerHTML = rows.length
                    ? rows.map(r => `<div class="inv-item"><span>${esc(r.name)}</span>
                        <i>${esc(new Date(String(r.joined_at).replace(' ', 'T')).toLocaleDateString('ru-RU'))}</i></div>`).join('')
                    : '<div class="inv-skel">Пока никого — поделитесь ссылкой</div>';
            } catch (e) { box.innerHTML = '<div class="inv-skel">Не удалось загрузить список</div>'; }
        }

        (async function start() {
            const box = document.getElementById('invBody');
            const code = codeFromUrl();
            let me = null;
            try { me = window.Auth && Auth.getCurrentUser ? await Auth.getCurrentUser() : null; } catch (e) {}

            if (me) {
                // Вошёл — сперва засчитываем приглашение, если оно есть, потом показываем своё
                try { if (window.psyReferral) await psyReferral.claim(); } catch (e) {}
                try {
                    const d = await (await fetch('/api/referrals.php?action=me', { credentials: 'include' })).json();
                    if (!d || !d.ok) throw new Error('нет данных');
                    myLink = d.link || '';
                    box.innerHTML = mineHtml(d);
                    if (!navigator.share) {
                        const b = document.getElementById('invShareBtn');
                        if (b) b.style.display = 'none';
                    }
                    loadInvitees();
                } catch (e) {
                    box.innerHTML = '<div class="inv-skel">Не удалось получить вашу ссылку. Обновите страницу.</div>';
                }
                return;
            }

            // Гость: показываем, кто пригласил (если код узнаваем)
            let name = '';
            if (code) {
                try {
                    const w = await (await fetch('/api/referrals.php?action=who&code=' + encodeURIComponent(code))).json();
                    if (w && w.found) name = w.name || '';
                } catch (e) {}
            }
            box.innerHTML = guestHtml(name, await priceLine());
        })();
    </script>
</body>
</html>
