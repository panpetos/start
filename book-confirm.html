<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение записи - psytalk.pro</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: #333;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #666;
        }

        .psychologist-info {
            display: flex;
            gap: 1rem;
            align-items: center;
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
        }

        .psychologist-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            flex-shrink: 0;
            overflow: hidden;
        }

        .psychologist-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .psychologist-name {
            font-weight: 600;
            color: #333;
        }

        .psychologist-spec {
            color: #666;
            font-size: 0.9rem;
        }

        .details {
            margin-bottom: 1.5rem;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid #eee;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #666;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .detail-value {
            font-weight: 600;
            color: #333;
        }

        .total-row {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .total-label {
            font-size: 1.1rem;
        }

        .total-value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .format-select {
            margin-bottom: 1.5rem;
        }

        .format-select label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .format-options {
            display: flex;
            gap: 0.5rem;
        }

        .format-option {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .format-option:hover {
            border-color: #667eea;
        }

        .format-option.selected {
            border-color: #667eea;
            background: #e7f1ff;
        }

        .format-option input {
            display: none;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-mock {
            width: 100%;
            padding: 0.75rem;
            background: #fff3cd;
            color: #856404;
            border: 2px dashed #ffc107;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .btn-mock:hover {
            background: #ffeeba;
        }

        .btn-mock:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .mock-badge {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 0.5rem;
        }

        .secure-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #28a745;
            font-size: 0.9rem;
            margin-top: 1rem;
        }

        .back-link {
            display: block;
            text-align: center;
            color: #667eea;
            text-decoration: none;
            margin-top: 1rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="card" id="bookingCard">
        <div class="loading">Загрузка...</div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        let psychologistData = null;
        let bookingData = {
            datetime: null,
            format: 'video'
        };
        let mockMode = false;

        const FORMAT_NAMES = {
            'video': '📹 Видео',
            'audio': '📞 Аудио',
            'chat': '💬 Чат'
        };

        const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
            'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const psychologistId = urlParams.get('psychologist_id');
            const datetime = urlParams.get('datetime');
            mockMode = urlParams.get('mock') === '1';

            if (!psychologistId || !datetime) {
                showError('Недостаточно данных для бронирования');
                return;
            }

            bookingData.datetime = datetime;

            let user = null;
            if (window.Auth && window.Auth.getCurrentUser) {
                user = await window.Auth.getCurrentUser();
            }

            if (!user) {
                window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.href);
                return;
            }

            // If not in URL mock mode, check server settings
            if (!mockMode) {
                try {
                    const s = await fetch('/api/settings.php?action=public').then(r => r.json());
                    if (String(s.mock_payment_enabled) === '1') mockMode = true;
                } catch (_) {}
            }

            try {
                const response = await fetch(`/api/psychologists.php?action=get&id=${psychologistId}`);
                const data = await response.json();

                if (data.error) {
                    showError(data.error);
                    return;
                }

                psychologistData = data;
                renderBookingForm();

                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            } catch (error) {
                console.error('Load error:', error);
                showError('Ошибка загрузки данных');
            }
        }

        function formatDateTime(dateTimeStr) {
            const date = new Date(dateTimeStr);
            const day = date.getDate();
            const month = MONTHS[date.getMonth()];
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            return `${day} ${month}, ${hours}:${minutes}`;
        }

        function renderBookingForm() {
            const p = psychologistData;
            const formats = p.formats || ['video'];

            const mockButton = mockMode ? `
                <button class="btn-mock" id="mockPayBtn" onclick="proceedMockPayment()">
                    🧪 Тестовая оплата (без платёжной системы)
                </button>
                <div class="mock-badge">⚠️ Режим разработки — деньги не списываются</div>
            ` : '';

            document.getElementById('bookingCard').innerHTML = `
                <div class="header">
                    <h1>Подтверждение записи</h1>
                    <p>Проверьте данные и перейдите к оплате</p>
                </div>

                <div class="psychologist-info">
                    <div class="psychologist-avatar">
                        ${p.avatar ? `<img src="${p.avatar}" alt="${p.first_name}">` : p.first_name?.charAt(0) || '?'}
                    </div>
                    <div>
                        <div class="psychologist-name">${p.first_name || ''} ${p.last_name || ''}</div>
                        <div class="psychologist-spec">${p.specialization || 'Психолог'}</div>
                    </div>
                </div>

                <div class="details">
                    <div class="detail-row">
                        <span class="detail-label">
                            <i data-lucide="calendar" style="width: 18px; height: 18px;"></i>
                            Дата и время
                        </span>
                        <span class="detail-value">${formatDateTime(bookingData.datetime)}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">
                            <i data-lucide="clock" style="width: 18px; height: 18px;"></i>
                            Длительность
                        </span>
                        <span class="detail-value">50 минут</span>
                    </div>
                </div>

                <div class="format-select">
                    <label>Формат консультации</label>
                    <div class="format-options">
                        ${formats.map((f, i) => `
                            <label class="format-option ${i === 0 ? 'selected' : ''}" onclick="selectFormat('${f}', this)">
                                <input type="radio" name="format" value="${f}" ${i === 0 ? 'checked' : ''}>
                                ${FORMAT_NAMES[f] || f}
                            </label>
                        `).join('')}
                    </div>
                </div>

                <div class="total-row">
                    <span class="total-label">К оплате</span>
                    <span class="total-value">${new Intl.NumberFormat('ru-RU').format(p.price || 0)} ₽</span>
                </div>

                <div id="errorMsg"></div>

                <button class="btn" id="payBtn" onclick="proceedToPayment()">
                    <i data-lucide="credit-card" style="width: 20px; height: 20px;"></i>
                    Перейти к оплате
                </button>

                ${mockButton}

                <div class="secure-badge">
                    <i data-lucide="shield-check" style="width: 18px; height: 18px;"></i>
                    Безопасная оплата через Robokassa
                </div>

                <a href="/psychologist-profile.html?id=${p.id}" class="back-link">
                    ← Вернуться к профилю
                </a>
            `;

            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        function selectFormat(format, element) {
            document.querySelectorAll('.format-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            bookingData.format = format;
        }

        async function proceedToPayment() {
            const btn = document.getElementById('payBtn');
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader" style="width: 20px; height: 20px;"></i> Создание платежа...';

            try {
                const response = await fetch('/api/payment.php?action=init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        psychologistId: psychologistData.id,
                        dateTime: bookingData.datetime,
                        format: bookingData.format,
                        price: psychologistData.price
                    })
                });

                const data = await response.json();

                if (data.error) {
                    document.getElementById('errorMsg').innerHTML =
                        `<div class="error">${data.error}</div>`;
                    btn.disabled = false;
                    btn.innerHTML = '<i data-lucide="credit-card" style="width: 20px; height: 20px;"></i> Перейти к оплате';
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                    return;
                }

                if (data.paymentUrl) {
                    window.location.href = data.paymentUrl;
                } else {
                    throw new Error('No payment URL');
                }
            } catch (error) {
                console.error('Payment error:', error);
                document.getElementById('errorMsg').innerHTML =
                    '<div class="error">Ошибка создания платежа. Попробуйте позже.</div>';
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="credit-card" style="width: 20px; height: 20px;"></i> Перейти к оплате';
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
        }

        async function proceedMockPayment() {
            const btn = document.getElementById('mockPayBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Создание тестовой записи...';

            try {
                const response = await fetch('/api/payment_mock.php?action=init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        psychologistId: psychologistData.id,
                        dateTime: bookingData.datetime,
                        format: bookingData.format,
                        price: psychologistData.price
                    })
                });

                const data = await response.json();

                if (data.error) {
                    document.getElementById('errorMsg').innerHTML =
                        `<div class="error">${data.error}</div>`;
                    btn.disabled = false;
                    btn.textContent = '🧪 Тестовая оплата (без платёжной системы)';
                    return;
                }

                if (data.ok && data.appointment_id) {
                    window.location.href = `/payment-success.html?appointment_id=${data.appointment_id}&mock=1`;
                } else {
                    throw new Error('Неожиданный ответ сервера');
                }
            } catch (error) {
                console.error('Mock payment error:', error);
                document.getElementById('errorMsg').innerHTML =
                    '<div class="error">Ошибка тестовой оплаты. Проверьте консоль.</div>';
                btn.disabled = false;
                btn.textContent = '🧪 Тестовая оплата (без платёжной системы)';
            }
        }

        function showError(message) {
            document.getElementById('bookingCard').innerHTML = `
                <div class="error">${message}</div>
                <a href="/" class="back-link">← На главную</a>
            `;
        }

        init();
    </script>
</body>

</html>
