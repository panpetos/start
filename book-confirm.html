<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение записи - psytalk.pro</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/layout.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background: #FAFAFA;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .booking-wrap {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 2.5rem 1rem 3rem;
        }
        .booking-card {
            background: white;
            border-radius: 1.5rem;
            padding: 2.5rem;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 8px 40px rgba(0,0,0,0.08);
            border: 1px solid #F0F0F0;
        }
        .booking-heading { text-align: center; margin-bottom: 2rem; }
        .booking-heading h1 { color: #1A1A1A; font-size: 1.75rem; margin-bottom: 0.375rem; }
        .booking-heading p { color: #6B7280; font-size: 0.9375rem; margin: 0; }
        .psychologist-info {
            display: flex; gap: 1rem; align-items: center;
            background: #F8F6FF; padding: 1rem; border-radius: 1rem;
            margin-bottom: 1.5rem; border: 1px solid #EDE9FF;
        }
        .psychologist-avatar {
            width: 56px; height: 56px; border-radius: 50%;
            background: linear-gradient(135deg, #7C3AED 0%, #9F67FA 100%);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 1.375rem; font-weight: 700;
            flex-shrink: 0; overflow: hidden;
        }
        .psychologist-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .psychologist-name { font-weight: 700; color: #1A1A1A; margin-bottom: 0.125rem; }
        .psychologist-spec { color: #7C3AED; font-size: 0.875rem; font-weight: 500; }
        .details { margin-bottom: 1.5rem; }
        .detail-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.75rem 0; border-bottom: 1px solid #F5F5F5;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: #6B7280; display: flex; align-items: center; gap: 0.5rem; font-size: 0.9375rem; }
        .detail-value { font-weight: 600; color: #1A1A1A; }
        .total-row {
            background: linear-gradient(135deg, #7C3AED 0%, #9F67FA 100%);
            color: white; padding: 1.125rem 1.25rem; border-radius: 1rem;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;
        }
        .total-label { font-size: 1rem; font-weight: 500; opacity: 0.9; }
        .total-value { font-size: 1.875rem; font-weight: 800; letter-spacing: -0.03em; }
        .format-select { margin-bottom: 1.5rem; }
        .format-select label { display: block; color: #1A1A1A; font-weight: 600; margin-bottom: 0.75rem; }
        .format-options { display: flex; gap: 0.5rem; }
        .format-option {
            flex: 1; padding: 0.75rem; border: 1.5px solid #E2E8F0;
            border-radius: 0.75rem; text-align: center; cursor: pointer;
            transition: all 0.2s; font-size: 0.9rem; color: #374151; font-weight: 500;
        }
        .format-option:hover { border-color: #7C3AED; color: #7C3AED; }
        .format-option.selected { border-color: #7C3AED; background: #F3E8FF; color: #7C3AED; font-weight: 600; }
        .format-option input { display: none; }
        .btn-pay {
            width: 100%; padding: 1rem; font-size: 1.0625rem; font-weight: 700;
            background: linear-gradient(135deg, #7C3AED 0%, #9F67FA 100%);
            color: white; border: none; border-radius: 0.875rem;
            cursor: pointer; transition: all 0.2s; font-family: inherit;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            box-shadow: 0 4px 14px rgba(124,58,237,0.35);
        }
        .btn-pay:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,58,237,0.45); }
        .btn-pay:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-mock {
            width: 100%; padding: 0.75rem; background: #FFF8E7;
            color: #92400E; border: 1.5px dashed #F59E0B; border-radius: 0.875rem;
            font-size: 0.9375rem; font-weight: 600; cursor: pointer; font-family: inherit;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 0.75rem;
        }
        .btn-mock:hover { background: #FEF3C7; }
        .btn-mock:disabled { opacity: 0.5; cursor: not-allowed; }
        .mock-badge {
            background: #FFF8E7; color: #92400E; border: 1px solid #F59E0B;
            border-radius: 0.625rem; padding: 0.5rem 0.75rem; font-size: 0.8rem; text-align: center; margin-top: 0.5rem;
        }
        .secure-badge {
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            color: #16A34A; font-size: 0.875rem; margin-top: 1rem; font-weight: 500;
        }
        .back-link { display: block; text-align: center; color: #7C3AED; text-decoration: none; margin-top: 1rem; font-size: 0.9rem; }
        .loading { text-align: center; padding: 3rem; color: #6B7280; }
        .error { background: #FFF1F2; color: #BE123C; padding: 1rem; border-radius: 0.75rem; margin-bottom: 1rem; font-size: 0.9rem; border: 1px solid #FECDD3; }
    </style>
</head>

<body>
    <script>psyWriteHeader();</script>
    <div class="booking-wrap">
    <div class="booking-card" id="bookingCard">
        <div class="loading">Загрузка...</div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        let psychologistData = null;
        let bookingData = {
            datetime: null,
            format: 'video'
        };
        let mockMode = false;
        let fromCache = false;

        const FORMAT_NAMES = {
            'video': '📹 Видео',
            'audio': '📞 Аудио',
            'chat': '💬 Чат',
            'phone': '📞 Звонок'
        };

        const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
            'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

        function normalizeCachedPsych(p) {
            const parts = (p.name || '').split(' ');
            return {
                id: p.id,
                first_name: parts[0] || '',
                last_name: parts.slice(1).join(' ') || '',
                specialization: (p.specialties || []).join(', ') || 'Психолог',
                price: p.price || 0,
                avatar: p.avatar || null,
                formats: p.formats || ['video'],
                color: p.color || '#7C3AED'
            };
        }

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const psychologistId = urlParams.get('psychologist_id');
            const datetime = urlParams.get('datetime');
            mockMode = urlParams.get('mock') === '1';

            if (!psychologistId || !datetime) {
                showError('Недостаточно данных для бронирования');
                return;
            }

            bookingData.datetime = datetime;

            // Try cached psychologist from booking page (no login required)
            let cached = null;
            try {
                const raw = sessionStorage.getItem('bookingPsychologist');
                if (raw) {
                    const obj = JSON.parse(raw);
                    if (String(obj.id) === String(psychologistId)) cached = obj;
                }
            } catch (_) {}

            if (cached) {
                mockMode = true;
                fromCache = true;
                psychologistData = normalizeCachedPsych(cached);
                renderBookingForm();
                // Hide real payment button — API requires auth which we don't have
                const payBtn = document.getElementById('payBtn');
                if (payBtn) payBtn.style.display = 'none';
                if (typeof lucide !== 'undefined') { try { lucide.createIcons(); } catch(e) {} }
                return;
            }

            let user = null;
            if (window.Auth && window.Auth.getCurrentUser) {
                user = await window.Auth.getCurrentUser();
            }

            if (!user) {
                window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.href);
                return;
            }

            // If not in URL mock mode, check server settings
            if (!mockMode) {
                try {
                    const s = await fetch('/api/settings.php?action=public').then(r => r.json());
                    if (String(s.mock_payment_enabled) === '1') mockMode = true;
                } catch (_) {}
            }

            try {
                const response = await fetch(`/api/psychologists.php?action=get&id=${psychologistId}`);
                const data = await response.json();

                if (data.error) {
                    showError(data.error);
                    return;
                }

                psychologistData = data;
                renderBookingForm();

                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            } catch (error) {
                console.error('Load error:', error);
                showError('Ошибка загрузки данных');
            }
        }

        function formatDateTime(dateTimeStr) {
            const date = new Date(dateTimeStr);
            const day = date.getDate();
            const month = MONTHS[date.getMonth()];
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            return `${day} ${month}, ${hours}:${minutes}`;
        }

        function renderBookingForm() {
            const p = psychologistData;
            const formats = p.formats || ['video'];

            const mockButton = mockMode ? `
                <button class="btn-mock" id="mockPayBtn" onclick="proceedMockPayment()">
                    🧪 Тестовая оплата (без платёжной системы)
                </button>
                <div class="mock-badge">⚠️ Режим разработки — деньги не списываются</div>
            ` : '';

            document.getElementById('bookingCard').innerHTML = `
                <div class="booking-heading">
                    <h1>Подтверждение записи</h1>
                    <p>Проверьте данные и перейдите к оплате</p>
                    <div style="display:inline-flex;align-items:center;gap:0.375rem;background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE;border-radius:2rem;padding:0.3rem 0.875rem;font-size:0.8rem;font-weight:600;margin-top:0.625rem;">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
                        Вы записываетесь как клиент
                    </div>
                </div>

                <div class="psychologist-info">
                    <div class="psychologist-avatar">
                        ${p.avatar ? `<img src="${p.avatar}" alt="${p.first_name}">` : p.first_name?.charAt(0) || '?'}
                    </div>
                    <div>
                        <div class="psychologist-name">${p.first_name || ''} ${p.last_name || ''}</div>
                        <div class="psychologist-spec">${p.specialization || 'Психолог'}</div>
                    </div>
                </div>

                <div class="details">
                    <div class="detail-row">
                        <span class="detail-label">
                            <i data-lucide="calendar" style="width: 18px; height: 18px;"></i>
                            Дата и время
                        </span>
                        <span class="detail-value">${formatDateTime(bookingData.datetime)}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">
                            <i data-lucide="clock" style="width: 18px; height: 18px;"></i>
                            Длительность
                        </span>
                        <span class="detail-value">50 минут</span>
                    </div>
                </div>

                <div class="format-select">
                    <label>Формат консультации</label>
                    <div class="format-options">
                        ${formats.map((f, i) => `
                            <label class="format-option ${i === 0 ? 'selected' : ''}" onclick="selectFormat('${f}', this)">
                                <input type="radio" name="format" value="${f}" ${i === 0 ? 'checked' : ''}>
                                ${FORMAT_NAMES[f] || f}
                            </label>
                        `).join('')}
                    </div>
                </div>

                <div class="total-row">
                    <span class="total-label">К оплате</span>
                    <span class="total-value">${new Intl.NumberFormat('ru-RU').format(p.price || 0)} ₽</span>
                </div>

                <div id="errorMsg"></div>

                <button class="btn-pay" id="payBtn" onclick="proceedToPayment()">
                    <i data-lucide="credit-card" style="width: 20px; height: 20px;"></i>
                    Перейти к оплате
                </button>

                ${mockButton}

                <div class="secure-badge">
                    <i data-lucide="shield-check" style="width: 18px; height: 18px;"></i>
                    Безопасная оплата через Robokassa
                </div>

                <a href="/book.html?id=${p.id}" class="back-link">
                    ← Назад к выбору времени
                </a>
            `;

            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        function selectFormat(format, element) {
            document.querySelectorAll('.format-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            bookingData.format = format;
        }

        async function proceedToPayment() {
            const btn = document.getElementById('payBtn');
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader" style="width: 20px; height: 20px;"></i> Создание платежа...';

            try {
                const response = await fetch('/api/payment.php?action=init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        psychologistId: psychologistData.id,
                        dateTime: bookingData.datetime,
                        format: bookingData.format,
                        price: psychologistData.price
                    })
                });

                const data = await response.json();

                if (data.error) {
                    document.getElementById('errorMsg').innerHTML =
                        `<div class="error">${data.error}</div>`;
                    btn.disabled = false;
                    btn.innerHTML = '<i data-lucide="credit-card" style="width: 20px; height: 20px;"></i> Перейти к оплате'; if (typeof lucide !== 'undefined') lucide.createIcons();
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                    return;
                }

                if (data.paymentUrl) {
                    window.location.href = data.paymentUrl;
                } else {
                    throw new Error('No payment URL');
                }
            } catch (error) {
                console.error('Payment error:', error);
                document.getElementById('errorMsg').innerHTML =
                    '<div class="error">Ошибка создания платежа. Попробуйте позже.</div>';
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="credit-card" style="width: 20px; height: 20px;"></i> Перейти к оплате'; if (typeof lucide !== 'undefined') lucide.createIcons();
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
        }

        async function proceedMockPayment() {
            const btn = document.getElementById('mockPayBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Создание тестовой записи...';

            // Fully client-side mock when no session (came from book.html without login)
            if (fromCache) {
                const fakeId = 'mock-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
                // Persist booking so the dashboard can display it
                try {
                    const cachedPsych = JSON.parse(sessionStorage.getItem('bookingPsychologist') || '{}');
                    const appt = {
                        id: fakeId,
                        psychologist_name: cachedPsych.name || (psychologistData.first_name + ' ' + psychologistData.last_name).trim(),
                        psychologist_id: psychologistData.id,
                        psychologist_color: cachedPsych.color || '#7C3AED',
                        date_time: bookingData.datetime,
                        format: bookingData.format,
                        price: psychologistData.price || 0,
                        status: 'scheduled',
                        is_mock: true,
                        created_at: new Date().toISOString()
                    };
                    const list = JSON.parse(localStorage.getItem('psyMockAppointments') || '[]');
                    list.unshift(appt);
                    localStorage.setItem('psyMockAppointments', JSON.stringify(list.slice(0, 20)));
                } catch(_) {}
                window.location.href = `/payment-success.html?appointment_id=${fakeId}&mock=1`;
                return;
            }

            try {
                const response = await fetch('/api/payment_mock.php?action=init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        psychologistId: psychologistData.id,
                        dateTime: bookingData.datetime,
                        format: bookingData.format,
                        price: psychologistData.price
                    })
                });

                const data = await response.json();

                if (data.error) {
                    document.getElementById('errorMsg').innerHTML =
                        `<div class="error">${data.error}</div>`;
                    btn.disabled = false;
                    btn.textContent = '🧪 Тестовая оплата (без платёжной системы)';
                    return;
                }

                if (data.ok && data.appointment_id) {
                    window.location.href = `/payment-success.html?appointment_id=${data.appointment_id}&mock=1`;
                } else {
                    throw new Error('Неожиданный ответ сервера');
                }
            } catch (error) {
                console.error('Mock payment error:', error);
                document.getElementById('errorMsg').innerHTML =
                    '<div class="error">Ошибка тестовой оплаты. Проверьте консоль.</div>';
                btn.disabled = false;
                btn.textContent = '🧪 Тестовая оплата (без платёжной системы)';
            }
        }

        function showError(message) {
            document.getElementById('bookingCard').innerHTML = `
                <div class="error">${message}</div>
                <a href="/" class="back-link">← На главную</a>
            `;
        }

        init();
    </script>
    </div></div>
    <script>psyWriteFooter();</script>
</body>

</html>
