<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <title>Подтверждение записи - psytalk.pro</title>
    <link rel="stylesheet" href="/css/styles.css?v=20260823d">
    <script src="/js/netguard.js?v=20260821c"></script>
    <script src="/js/layout.js?v=20260823d"></script>
    <link rel="preconnect" href="https://unpkg.com">
    <script defer src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background: #FAFAFA;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .booking-wrap {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 2.5rem 1rem 3rem;
        }
        .booking-card {
            background: white;
            border-radius: 1.5rem;
            padding: 2.5rem;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 8px 40px rgba(0,0,0,0.08);
            border: 1px solid #F0F0F0;
        }
        .booking-heading { text-align: center; margin-bottom: 2rem; }
        .booking-heading h1 { color: #1A1A1A; font-size: 1.75rem; margin-bottom: 0.375rem; }
        .booking-heading p { color: #6B7280; font-size: 0.9375rem; margin: 0; }
        .psychologist-info {
            display: flex; gap: 1rem; align-items: center;
            background: #ECFDF5; padding: 1rem; border-radius: 1rem;
            margin-bottom: 1.5rem; border: 1px solid #D1FAE5;
        }
        .psychologist-avatar {
            width: 56px; height: 56px; border-radius: 50%;
            background: linear-gradient(135deg, #047857 0%, #059669 100%);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 1.375rem; font-weight: 700;
            flex-shrink: 0; overflow: hidden;
        }
        .psychologist-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .psychologist-name { font-weight: 700; color: #1A1A1A; margin-bottom: 0.125rem; }
        .psychologist-spec { color: #047857; font-size: 0.875rem; font-weight: 500; }
        .details { margin-bottom: 1.5rem; }
        .detail-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.75rem 0; border-bottom: 1px solid #F5F5F5;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: #6B7280; display: flex; align-items: center; gap: 0.5rem; font-size: 0.9375rem; }
        .detail-value { font-weight: 600; color: #1A1A1A; }
        /* Промокод бесплатной записи */
        .promo-box {
            border: 1.5px dashed #A7F3D0; border-radius: 0.9rem;
            padding: 0.85rem 1rem; margin: 1rem 0 0.5rem; background: #F7FDFA;
        }
        .promo-label { display: block; font-size: 0.8rem; font-weight: 700; color: #047857; margin-bottom: 0.45rem; }
        .promo-row { display: flex; gap: 0.5rem; }
        .promo-row input {
            flex: 1; min-width: 0; padding: 0.6rem 0.75rem; font-family: inherit; font-size: 0.95rem;
            border: 1.5px solid #E5E7EB; border-radius: 0.6rem; outline: none;
            text-transform: uppercase; letter-spacing: 0.04em;
        }
        .promo-row input:focus { border-color: #6EE7B7; }
        .promo-row input:disabled { background: #ECFDF5; border-color: #A7F3D0; color: #065F46; }
        .promo-row button {
            flex-shrink: 0; border: none; border-radius: 0.6rem; padding: 0 1rem; cursor: pointer;
            background: #047857; color: #fff; font-family: inherit; font-weight: 700; font-size: 0.9rem;
        }
        .promo-row button:disabled { opacity: 0.6; cursor: default; }
        .promo-msg { font-size: 0.82rem; margin-top: 0.45rem; color: #6B7280; min-height: 1.1em; }
        .promo-msg.ok { color: #16A34A; font-weight: 600; }
        .promo-msg.err { color: #DC2626; font-weight: 600; }

        .total-row {
            background: linear-gradient(135deg, #047857 0%, #059669 100%);
            color: white; padding: 1.125rem 1.25rem; border-radius: 1rem;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;
        }
        .total-label { font-size: 1rem; font-weight: 500; opacity: 0.9; }
        .total-value { font-size: 1.875rem; font-weight: 800; letter-spacing: -0.03em; }
        .format-select { margin-bottom: 1.5rem; }
        .format-select label { display: block; color: #1A1A1A; font-weight: 600; margin-bottom: 0.75rem; }
        .format-options { display: flex; gap: 0.5rem; }
        .format-option {
            flex: 1; padding: 0.75rem; border: 1.5px solid #E2E8F0;
            border-radius: 0.75rem; text-align: center; cursor: pointer;
            transition: all 0.2s; font-size: 0.9rem; color: #374151; font-weight: 500;
        }
        .format-option:hover { border-color: #047857; color: #047857; }
        .format-option.selected { border-color: #047857; background: #D1FAE5; color: #047857; font-weight: 600; }
        .format-option input { display: none; }
        .btn-pay {
            width: 100%; padding: 1rem; font-size: 1.0625rem; font-weight: 700;
            background: linear-gradient(135deg, #047857 0%, #059669 100%);
            color: white; border: none; border-radius: 0.875rem;
            cursor: pointer; transition: all 0.2s; font-family: inherit;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            box-shadow: 0 4px 14px rgba(4,120,87,0.35);
        }
        .btn-pay:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(4,120,87,0.45); }
        .btn-pay:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-mock {
            width: 100%; padding: 0.75rem; background: #FFF8E7;
            color: #92400E; border: 1.5px dashed #F59E0B; border-radius: 0.875rem;
            font-size: 0.9375rem; font-weight: 600; cursor: pointer; font-family: inherit;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 0.75rem;
        }
        .btn-mock:hover { background: #FEF3C7; }
        .btn-mock:disabled { opacity: 0.5; cursor: not-allowed; }
        .mock-badge {
            background: #FFF8E7; color: #92400E; border: 1px solid #F59E0B;
            border-radius: 0.625rem; padding: 0.5rem 0.75rem; font-size: 0.8rem; text-align: center; margin-top: 0.5rem;
        }
        .secure-badge {
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            color: #16A34A; font-size: 0.875rem; margin-top: 1rem; font-weight: 500;
        }
        .back-link { display: block; text-align: center; color: #047857; text-decoration: none; margin-top: 1rem; font-size: 0.9rem; }
        .loading { text-align: center; padding: 3rem; color: #6B7280; }
        .error { background: #FFF1F2; color: #BE123C; padding: 1rem; border-radius: 0.75rem; margin-bottom: 1rem; font-size: 0.9rem; border: 1px solid #FECDD3; }

        body.dark { background: #191919 !important; color: #E6E6E6 !important; }
        body.dark .booking-card { background: #252525; border-color: #333; box-shadow: 0 8px 40px rgba(0,0,0,0.3); }
        body.dark .booking-heading h1 { color: #E6E6E6; }
        body.dark .booking-heading p { color: #999; }
        body.dark .psychologist-info { background: #0B3B2E; border-color: #14503B; }
        body.dark .psychologist-name { color: #E6E6E6; }
        body.dark .detail-row { border-bottom-color: #333; }
        body.dark .detail-label { color: #999; }
        body.dark .detail-value { color: #E6E6E6; }
        body.dark .format-select label { color: #E6E6E6; }
        body.dark .format-option { border-color: #444; color: #CCC; }
        body.dark .format-option:hover { border-color: #047857; color: #6EE7B7; }
        body.dark .format-option.selected { border-color: #047857; background: #0B3B2E; color: #6EE7B7; }
        body.dark .mock-badge { background: #3D3520; color: #D4A844; border-color: #5A4E2D; }
        body.dark .btn-mock { background: #3D3520; color: #D4A844; border-color: #5A4E2D; }
        body.dark .btn-mock:hover { background: #4A4025; }
        body.dark .secure-badge { color: #6BCB77; }
        body.dark .error { background: #3D1F1F; color: #F87171; border-color: #5A2D2D; }
        body.dark .loading { color: #999; }
        body.dark .promo-box { background: #1F2A26; border-color: #14503B; }
        body.dark .promo-label { color: #6EE7B7; }
        body.dark .promo-row input { background: #2A2A2A; border-color: #444; color: #E6E6E6; }
        body.dark .promo-row input::placeholder { color: #777; }
        body.dark .promo-row input:focus { border-color: #047857; }
        body.dark .promo-row input:disabled { background: #0B3B2E; border-color: #14503B; color: #6EE7B7; }
        body.dark .promo-msg { color: #999; }

        /* ── Мобильная адаптация ── */
        @media (max-width: 600px) {
            .booking-wrap { padding: 1.25rem 0.75rem 2.5rem; }
            .booking-card { padding: 1.25rem 1rem; border-radius: 1.125rem; }
            .booking-heading { margin-bottom: 1.25rem; }
            .booking-heading h1 { font-size: 1.25rem; }
            .booking-heading p { font-size: 0.875rem; }

            .psychologist-info { gap: 0.75rem; padding: 0.75rem; margin-bottom: 1.125rem; }
            .psychologist-avatar { width: 44px; height: 44px; font-size: 1.0625rem; }
            .psychologist-name { font-size: 0.9375rem; }
            .psychologist-spec { font-size: 0.8125rem; }

            .details { margin-bottom: 1.125rem; }
            .detail-row { padding: 0.625rem 0; gap: 0.75rem; }
            .detail-label { font-size: 0.875rem; flex-shrink: 0; }
            .detail-value { font-size: 0.875rem; text-align: right; min-width: 0; overflow-wrap: anywhere; }

            /* Промокод: поле во всю ширину, кнопка отдельной строкой — удобно попадать пальцем */
            .promo-box { padding: 0.875rem; margin: 0.875rem 0 0.5rem; }
            .promo-row { flex-wrap: wrap; gap: 0.5rem; }
            .promo-row input { flex: 1 1 100%; width: 100%; font-size: 1rem; padding: 0.75rem 0.875rem; letter-spacing: 0.08em; }
            .promo-row button { flex: 1 1 100%; padding: 0.75rem 1rem; font-size: 0.9375rem; }

            .total-row { padding: 0.875rem 1rem; margin-bottom: 1.125rem; gap: 0.75rem; }
            .total-label { font-size: 0.875rem; }
            .total-value { font-size: 1.375rem; white-space: nowrap; }

            .format-select { margin-bottom: 1.125rem; }
            .format-select label { font-size: 0.9375rem; margin-bottom: 0.5rem; }
            .format-options { gap: 0.375rem; }
            .format-option { padding: 0.625rem 0.25rem; font-size: 0.8125rem; }

            .btn-pay { padding: 0.875rem; font-size: 1rem; }
            .btn-mock { font-size: 0.875rem; }
            .secure-badge { font-size: 0.8125rem; margin-top: 0.75rem; }
        }
        @media (max-width: 360px) {
            .booking-card { padding: 1rem 0.75rem; }
            .format-option { font-size: 0.75rem; }
            .total-value { font-size: 1.25rem; }
        }
    </style>
</head>

<body>
    <script>psyWriteHeader();</script>
    <div class="booking-wrap">
    <div class="booking-card" id="bookingCard">
        <div class="loading">Загрузка...</div>
    </div>

    <script src="/js/api.js?v=20260821"></script>
    <script src="/js/auth.js?v=20260821"></script>
    <script>
        let psychologistData = null;
        let bookingData = {
            datetime: null,
            format: 'video'
        };
        let mockMode = false;
        let packageId = null; // если запись по абонементу — id пакета
        let introEligible = false; // положена ли клиенту бесплатная вводная у этого психолога
        let sessionType = 'full'; // 'full' | 'intro' — выбор клиента, когда вводная доступна

        const FORMAT_NAMES = {
            'video': '📹 Видео',
            'audio': '📞 Аудио',
            'chat': '💬 Чат',
            'phone': '📞 Звонок'
        };

        const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
            'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const psychologistId = urlParams.get('psychologist_id');
            const datetime = urlParams.get('datetime');
            packageId = urlParams.get('pkg');

            if (!psychologistId || !datetime) {
                showError('Недостаточно данных для бронирования');
                return;
            }

            bookingData.datetime = datetime;

            // Запись требует авторизации — это реальный бэкенд
            let user = null;
            if (window.Auth && window.Auth.getCurrentUser) {
                user = await window.Auth.getCurrentUser();
            }
            if (!user) {
                window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
                return;
            }

            // Тестовая оплата включается в админ-настройках платформы
            try {
                const s = await fetch('/api/settings.php?action=public').then(r => r.json());
                if (String(s.mock_payment_enabled) === '1') mockMode = true;
            } catch (_) {}

            try {
                const response = await fetch(`/api/psychologists.php?action=get&id=${encodeURIComponent(psychologistId)}`, {
                    credentials: 'include'
                });
                const data = await response.json();

                if (!data || data.error || !data.id) {
                    if (packageId) {
                        document.getElementById('bookingCard').innerHTML = `
                            <div style="text-align:center;padding:2rem;">
                                <div style="font-size:2.5rem;margin-bottom:0.75rem;">😕</div>
                                <h2 style="font-size:1.25rem;margin-bottom:0.5rem;">Специалист больше недоступен</h2>
                                <p style="color:#6B7280;margin-bottom:1.5rem;">Ваш абонемент по-прежнему действует. Выберите другого психолога.</p>
                                <a href="/search.html?pkg=${encodeURIComponent(packageId)}" style="display:inline-block;padding:0.75rem 1.5rem;background:linear-gradient(135deg,#047857,#059669);color:white;text-decoration:none;border-radius:0.75rem;font-weight:600;">🔄 Выбрать другого психолога</a>
                            </div>`;
                    } else {
                        showError((data && data.error) || 'Специалист не найден');
                    }
                    return;
                }

                psychologistData = data;
                await loadPromoEnabled();
                await loadFreeIntroEligibility();
                renderBookingForm();

                if (typeof lucide !== 'undefined') {
                    try { lucide.createIcons(); } catch(e) {}
                }
            } catch (error) {
                console.error('Load error:', error);
                showError('Ошибка загрузки данных');
            }
        }

        function formatDateTime(dateTimeStr) {
            const date = new Date(dateTimeStr);
            const day = date.getDate();
            const month = MONTHS[date.getMonth()];
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            return `${day} ${month}, ${hours}:${minutes}`;
        }

        function renderBookingForm() {
            const p = psychologistData;
            const formats = p.formats || ['video'];

            const mockButton = (mockMode && !packageId) ? `
                <button class="btn-mock" id="mockPayBtn" onclick="proceedMockPayment()">
                    🧪 Тестовая оплата (без платёжной системы)
                </button>
                <div class="mock-badge">⚠️ Режим разработки — деньги не списываются</div>
            ` : '';

            // По абонементу — без оплаты, списывается одна сессия
            const isPackage = !!packageId;
            const isIntro = !isPackage && introEligible && sessionType === 'intro';

            // Выбор типа сессии — только когда клиенту вообще положена бесплатная вводная
            const sessionTypeBlock = (isPackage || !introEligible) ? '' : `
                <div class="format-select">
                    <label>Тип сессии</label>
                    <div class="format-options">
                        <label class="format-option ${isIntro ? 'selected' : ''}" onclick="selectSessionType('intro')">
                            🎁 Вводная 20 мин — бесплатно
                        </label>
                        <label class="format-option ${!isIntro ? 'selected' : ''}" onclick="selectSessionType('full')">
                            Полная 50 мин — ${new Intl.NumberFormat('ru-RU').format(p.price || 0)} ₽
                        </label>
                    </div>
                </div>`;

            const totalBlock = isPackage
                ? `<div class="total-row" style="background:linear-gradient(135deg,#16A34A,#22C55E);">
                       <span class="total-label">По абонементу</span>
                       <span class="total-value" style="font-size:1.25rem;">Бесплатно · −1 сессия</span>
                   </div>`
                : (isIntro
                    ? `<div class="total-row" style="background:linear-gradient(135deg,#16A34A,#22C55E);">
                           <span class="total-label">Вводная сессия 20 мин</span>
                           <span class="total-value" style="font-size:1.25rem;">Бесплатно</span>
                       </div>`
                    : promoOk
                    ? `<div class="total-row" style="background:linear-gradient(135deg,#16A34A,#22C55E);">
                           <span class="total-label">По промокоду</span>
                           <span class="total-value" style="font-size:1.25rem;">
                               <s style="opacity:0.65;font-size:0.9rem;font-weight:500;">${new Intl.NumberFormat('ru-RU').format(p.price || 0)} ₽</s>
                               &nbsp;0 ₽</span>
                       </div>`
                    : `<div class="total-row">
                           <span class="total-label">К оплате</span>
                           <span class="total-value">${new Intl.NumberFormat('ru-RU').format(p.price || 0)} ₽</span>
                       </div>`);
            const payButton = isPackage
                ? `<button class="btn-pay" id="payBtn" onclick="proceedPackageBooking()" style="background:linear-gradient(135deg,#16A34A,#22C55E);">
                       <i data-lucide="ticket" style="width: 20px; height: 20px;"></i> Записаться по абонементу
                   </button>`
                : (isIntro
                    ? `<button class="btn-pay" id="payBtn" onclick="proceedFreeIntro()" style="background:linear-gradient(135deg,#16A34A,#22C55E);">
                           <i data-lucide="gift" style="width: 20px; height: 20px;"></i> Записаться на вводную бесплатно
                       </button>`
                    : promoOk
                    ? `<button class="btn-pay" id="payBtn" onclick="proceedPromoBooking()" style="background:linear-gradient(135deg,#16A34A,#22C55E);">
                           <i data-lucide="check" style="width: 20px; height: 20px;"></i> Записаться бесплатно
                       </button>`
                    : `<button class="btn-pay" id="payBtn" onclick="proceedToPayment()">
                           <i data-lucide="credit-card" style="width: 20px; height: 20px;"></i> Перейти к оплате
                       </button>`);
            // Промокод — только для обычной платной записи: по абонементу и вводной и так без оплаты
            const promoBlock = (isPackage || isIntro || !promoEnabled) ? '' : `
                <div class="promo-box">
                    <label class="promo-label" for="promoInput">Промокод</label>
                    <div class="promo-row">
                        <input id="promoInput" type="text" placeholder="Введите промокод" autocomplete="off"
                               maxlength="40" value="${promoOk ? promoCode.replace(/"/g, '&quot;') : ''}"
                               ${promoOk ? 'disabled' : ''} oninput="promoReset()"
                               onkeydown="if(event.key==='Enter'){event.preventDefault();applyPromo();}">
                        <button type="button" id="promoBtn" onclick="applyPromo()" ${promoOk ? 'style="display:none;"' : ''}>Применить</button>
                    </div>
                    <div id="promoMsg" class="promo-msg${promoOk ? ' ok' : ''}">${promoOk ? '✓ Промокод принят — запись без оплаты' : ''}</div>
                </div>`;
            const secureBlock = isPackage
                ? `<div class="secure-badge"><i data-lucide="ticket" style="width: 18px; height: 18px;"></i> Сессия из вашего абонемента — повторная оплата не нужна</div>`
                : (isIntro
                    ? `<div class="secure-badge"><i data-lucide="gift" style="width: 18px; height: 18px;"></i> Вводная сессия положена один раз у каждого психолога — платить не нужно</div>`
                    : promoOk
                    ? `<div class="secure-badge"><i data-lucide="check" style="width: 18px; height: 18px;"></i> Запись по промокоду — платить не нужно</div>`
                    : `<div class="secure-badge"><i data-lucide="shield-check" style="width: 18px; height: 18px;"></i> Безопасная оплата через Robokassa</div>`);

            document.getElementById('bookingCard').innerHTML = `
                <div class="booking-heading">
                    <h1>Подтверждение записи</h1>
                    <p>Проверьте данные и перейдите к оплате</p>
                    <div style="display:inline-flex;align-items:center;gap:0.375rem;background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE;border-radius:2rem;padding:0.3rem 0.875rem;font-size:0.8rem;font-weight:600;margin-top:0.625rem;">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
                        Вы записываетесь как клиент
                    </div>
                </div>

                <div class="psychologist-info">
                    <div class="psychologist-avatar">
                        ${p.avatar ? `<img src="${p.avatar}" alt="${p.first_name}">` : p.first_name?.charAt(0) || '?'}
                    </div>
                    <div>
                        <div class="psychologist-name">${p.first_name || ''} ${p.last_name || ''}</div>
                        <div class="psychologist-spec">${p.specialization || 'Психолог'}</div>
                    </div>
                </div>

                <div class="details">
                    <div class="detail-row">
                        <span class="detail-label">
                            <i data-lucide="calendar" style="width: 18px; height: 18px;"></i>
                            Дата и время
                        </span>
                        <span class="detail-value">${formatDateTime(bookingData.datetime)}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">
                            <i data-lucide="clock" style="width: 18px; height: 18px;"></i>
                            Длительность
                        </span>
                        <span class="detail-value">${isIntro ? '20 минут' : '50 минут'}</span>
                    </div>
                </div>

                ${sessionTypeBlock}

                <div class="format-select">
                    <label>Формат консультации</label>
                    <div class="format-options">
                        ${formats.map((f, i) => `
                            <label class="format-option ${i === 0 ? 'selected' : ''}" onclick="selectFormat('${f}', this)">
                                <input type="radio" name="format" value="${f}" ${i === 0 ? 'checked' : ''}>
                                ${FORMAT_NAMES[f] || f}
                            </label>
                        `).join('')}
                    </div>
                </div>

                ${promoBlock}
                ${totalBlock}

                <div id="errorMsg"></div>

                ${payButton}

                ${mockButton}

                ${secureBlock}

                <a href="/book.html?id=${p.id}${isPackage ? '&pkg=' + encodeURIComponent(packageId) : ''}" class="back-link">
                    ← Назад к выбору времени
                </a>
            `;

            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        function selectFormat(format, element) {
            document.querySelectorAll('.format-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            bookingData.format = format;
        }

        // ── Промокод бесплатной записи ────────────────────────────────────────
        //  Пока приём платежей не настроен, а проверить весь путь «клиент записался →
        //  психолог увидел → созвонились» нужно уже сейчас. Общий тумблер «тестовая
        //  оплата» для этого не годится: он делает бесплатным всё и для всех.
        //  Код знает только тот, кому его дали, и проверяется он на сервере — здесь
        //  только показываем результат.
        let promoOk = false;
        let promoCode = '';
        // Задана ли вообще бесплатная запись по промокоду. Пока админ не задал код,
        // поле не показываем: иначе клиент вводит код и получает «сейчас отключено»,
        // а выглядит это как поломка страницы.
        //
        // По умолчанию — ПОКАЗЫВАЕМ. Прячем только если сервер прямо ответил, что
        // функция выключена. Иначе любая сетевая ошибка прятала бы поле совсем, и
        // человек с действующим промокодом не смог бы его ввести — это хуже, чем
        // лишнее поле на экране.
        let promoEnabled = true;

        async function loadPromoEnabled() {
            try {
                const r = await fetch('/api/promo_booking.php?action=enabled', { credentials: 'include' });
                const d = await r.json();
                if (d && d.ok) promoEnabled = !!d.enabled;
            } catch (e) { /* оставляем поле показанным */ }
        }

        // ── Бесплатная вводная сессия (20 минут) ────────────────────────────────
        // Положена один раз каждому клиенту у каждого психолога — узнаём у сервера,
        // не бронировал ли клиент этого специалиста раньше. По умолчанию выбираем
        // вводную, если она положена и это не запись по абонементу.
        async function loadFreeIntroEligibility() {
            if (packageId) return;
            try {
                const r = await fetch('/api/free_intro.php?action=eligible&psychologist_id=' + encodeURIComponent(psychologistData.id), { credentials: 'include' });
                const d = await r.json();
                if (d && d.ok) {
                    introEligible = !!d.eligible;
                    if (introEligible) sessionType = 'intro';
                }
            } catch (e) { /* нет вводной — работаем как раньше */ }
        }

        function selectSessionType(type) {
            sessionType = type;
            renderBookingForm();
        }
        window.selectSessionType = selectSessionType;

        function promoReset() {
            if (!promoOk) return;
            promoOk = false; promoCode = '';
            renderBookingForm();   // вернём обычную цену и кнопку оплаты
        }
        window.promoReset = promoReset;

        async function applyPromo() {
            const inp = document.getElementById('promoInput');
            const msg = document.getElementById('promoMsg');
            const btn = document.getElementById('promoBtn');
            const code = (inp.value || '').trim();
            if (!code) { msg.className = 'promo-msg err'; msg.textContent = 'Введите промокод'; return; }
            btn.disabled = true; msg.className = 'promo-msg'; msg.textContent = 'Проверяем…';
            try {
                const r = await fetch('/api/promo_booking.php?action=check', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    credentials: 'include', body: JSON.stringify({ code })
                });
                const d = await r.json();
                if (d && d.valid) {
                    promoOk = true; promoCode = code;
                    renderBookingForm();
                    const m2 = document.getElementById('promoMsg');
                    if (m2) { m2.className = 'promo-msg ok'; m2.textContent = '✓ Промокод принят — запись без оплаты'; }
                    const i2 = document.getElementById('promoInput');
                    if (i2) { i2.value = code; i2.disabled = true; }
                    const b2 = document.getElementById('promoBtn');
                    if (b2) b2.style.display = 'none';
                } else {
                    msg.className = 'promo-msg err';
                    msg.textContent = (d && d.error) || 'Промокод не подошёл';
                    btn.disabled = false;
                }
            } catch (e) {
                msg.className = 'promo-msg err'; msg.textContent = 'Не удалось проверить промокод';
                btn.disabled = false;
            }
        }
        window.applyPromo = applyPromo;

        async function proceedPromoBooking() {
            const btn = document.getElementById('payBtn');
            btn.disabled = true;
            btn.textContent = 'Записываем…';
            try {
                const r = await fetch('/api/promo_booking.php?action=book', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        code: promoCode,
                        psychologistId: psychologistData.id,
                        dateTime: bookingData.datetime,
                        format: bookingData.format
                    })
                });
                const d = await r.json();
                if (d && d.ok && d.appointment_id) {
                    window.location.href = `/payment-success.html?appointment_id=${d.appointment_id}&promo=1`;
                    return;
                }
                document.getElementById('errorMsg').innerHTML =
                    `<div class="error">${(d && d.error) || 'Не удалось записаться'}</div>`;
            } catch (e) {
                document.getElementById('errorMsg').innerHTML =
                    '<div class="error">Ошибка записи. Попробуйте позже.</div>';
            }
            btn.disabled = false;
            btn.innerHTML = '<i data-lucide="check" style="width: 20px; height: 20px;"></i> Записаться бесплатно';
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }
        window.proceedPromoBooking = proceedPromoBooking;

        async function proceedFreeIntro() {
            const btn = document.getElementById('payBtn');
            btn.disabled = true;
            btn.textContent = 'Записываем…';
            try {
                const r = await fetch('/api/free_intro.php?action=book', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        psychologistId: psychologistData.id,
                        dateTime: bookingData.datetime,
                        format: bookingData.format
                    })
                });
                const d = await r.json();
                if (d && d.ok && d.appointment_id) {
                    window.location.href = `/payment-success.html?appointment_id=${d.appointment_id}&intro=1`;
                    return;
                }
                document.getElementById('errorMsg').innerHTML =
                    `<div class="error">${(d && d.error) || 'Не удалось записаться'}</div>`;
            } catch (e) {
                document.getElementById('errorMsg').innerHTML =
                    '<div class="error">Ошибка записи. Попробуйте позже.</div>';
            }
            btn.disabled = false;
            btn.innerHTML = '<i data-lucide="gift" style="width: 20px; height: 20px;"></i> Записаться на вводную бесплатно';
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }
        window.proceedFreeIntro = proceedFreeIntro;

        /** Какой эквайринг включён. Спрашиваем сервер: в браузере этому решению не место. */
        let _payProvider = null;
        let _payTestAmount = 0;
        async function paymentProvider() {
            if (_payProvider) return _payProvider;
            try {
                // Спрашиваем НАШ эндпоинт: settings.php?action=public отдаёт только
                // свой белый список ключей, и payment_provider в него не входит —
                // через него выбор админа до страницы оплаты не доходил вовсе.
                const r = await fetch('/api/sber_acquiring.php?action=provider');
                const d = await r.json();
                _payProvider = (d && d.ok && d.provider) ? String(d.provider) : 'robokassa';
                if (d && d.test_amount > 0) _payTestAmount = d.test_amount;
            } catch (e) { _payProvider = 'robokassa'; }
            return _payProvider;
        }

        async function proceedToPayment() {
            const btn = document.getElementById('payBtn');
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader" style="width: 20px; height: 20px;"></i> Создание платежа...';

            try {
                // Чем принимаем оплату — решает настройка в админке (payment_provider).
                // Сбер отвечает formUrl, Робокасса — paymentUrl; ниже приводим к одному.
                const provider = await paymentProvider();
                const url = provider === 'sber'
                    ? '/api/sber_acquiring.php?action=init'
                    : '/api/robokassa.php?action=init';
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        psychologistId: psychologistData.id,
                        psychologist_id: psychologistData.id,   // Сбер ждёт это имя
                        dateTime: bookingData.datetime,
                        format: bookingData.format,
                        price: psychologistData.price,
                        amount: psychologistData.price          // Сбер ждёт это имя
                    })
                });

                const data = await response.json();
                if (data.formUrl && !data.paymentUrl) data.paymentUrl = data.formUrl;
                // Сумма подменена на тестовую — предупреждаем, иначе человек увидит
                // в банке 10 ₽ вместо трёх тысяч и решит, что сайт сломан.
                if (data.test_amount) {
                    document.getElementById('errorMsg').innerHTML =
                        `<div class="error" style="background:#FFF8EC;color:#B45309;border-color:#F0D9A8;">
                            ⚠️ Идёт проверка оплаты: к списанию ${data.amount_rub} ₽ вместо полной стоимости.
                         </div>`;
                }

                if (data.error) {
                    document.getElementById('errorMsg').innerHTML =
                        `<div class="error">${data.error}</div>`;
                    btn.disabled = false;
                    btn.innerHTML = '<i data-lucide="credit-card" style="width: 20px; height: 20px;"></i> Перейти к оплате'; if (typeof lucide !== 'undefined') lucide.createIcons();
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                    return;
                }

                if (data.paymentUrl) {
                    window.location.href = data.paymentUrl;
                } else {
                    throw new Error('No payment URL');
                }
            } catch (error) {
                console.error('Payment error:', error);
                document.getElementById('errorMsg').innerHTML =
                    '<div class="error">Ошибка создания платежа. Попробуйте позже.</div>';
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="credit-card" style="width: 20px; height: 20px;"></i> Перейти к оплате'; if (typeof lucide !== 'undefined') lucide.createIcons();
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
        }

        async function proceedPackageBooking() {
            const btn = document.getElementById('payBtn');
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader" style="width: 20px; height: 20px;"></i> Записываем...';
            try {
                const response = await fetch('/api/packages.php?action=book', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        package_id: packageId,
                        datetime: bookingData.datetime,
                        format: bookingData.format
                    })
                });
                const data = await response.json();
                if (data.error) {
                    document.getElementById('errorMsg').innerHTML = `<div class="error">${data.error}</div>`;
                    btn.disabled = false;
                    btn.innerHTML = '<i data-lucide="ticket" style="width: 20px; height: 20px;"></i> Записаться по абонементу';
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                    return;
                }
                if (data.ok) {
                    window.location.href = `/payment-success.html?appointment_id=${data.appointment_id || ''}&pkg=1`;
                } else {
                    throw new Error('Неожиданный ответ сервера');
                }
            } catch (error) {
                console.error('Package booking error:', error);
                document.getElementById('errorMsg').innerHTML = '<div class="error">Ошибка записи по абонементу. Попробуйте позже.</div>';
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="ticket" style="width: 20px; height: 20px;"></i> Записаться по абонементу';
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
        }

        async function proceedMockPayment() {
            const btn = document.getElementById('mockPayBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Создание тестовой записи...';

            try {
                // Реальный мок-эндпоинт: создаёт запись и платёж в БД (нужна авторизация)
                const response = await fetch('/api/payment_mock.php?action=init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        psychologistId: psychologistData.id,
                        dateTime: bookingData.datetime,
                        format: bookingData.format,
                        price: psychologistData.price
                    })
                });

                const data = await response.json();

                if (data.error) {
                    document.getElementById('errorMsg').innerHTML =
                        `<div class="error">${data.error}</div>`;
                    btn.disabled = false;
                    btn.textContent = '🧪 Тестовая оплата (без платёжной системы)';
                    return;
                }

                if (data.ok && data.appointment_id) {
                    window.location.href = `/payment-success.html?appointment_id=${data.appointment_id}&mock=1`;
                } else {
                    throw new Error('Неожиданный ответ сервера');
                }
            } catch (error) {
                console.error('Mock payment error:', error);
                document.getElementById('errorMsg').innerHTML =
                    '<div class="error">Ошибка тестовой оплаты. Проверьте консоль.</div>';
                btn.disabled = false;
                btn.textContent = '🧪 Тестовая оплата (без платёжной системы)';
            }
        }

        function showError(message) {
            document.getElementById('bookingCard').innerHTML = `
                <div class="error">${message}</div>
                <a href="/" class="back-link">← На главную</a>
            `;
        }

        init();
    </script>
    </div></div>
    <script>psyWriteFooter();</script>
</body>

</html>
