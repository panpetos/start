name: Deploy to psytalk.pro via FTP

on:
  push:
    branches:
      - claude/psytalk-pro-dev-onsqnt
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy changed files via SFTP
        run: |
          sudo apt-get install -y lftp
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            open sftp://u3105470:a9Y3yfN5Im4It0bF@31.31.197.13;
            cd /var/www/u3105470/data/www/psytalk.pro;
            put index.html;
            put search.html;
            put css/styles.css;
            put js/layout.js;
            put book.html;
            put book-confirm.html;
            put payment-success.html;
            put client-dashboard.html;
            put psychologist-dashboard.html;
            put chat.html;
            put consultation.html;
            put consent.html;
            put offer.html;
            put privacy.html;
            put refund.html;
            put api/payment_mock.php;
            bye;
          "
          echo "Deployment complete"
