<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <title>Вход на компьютере — psytalk.pro</title>
    <link rel="stylesheet" href="/css/styles.css?v=20260821">
    <script src="/js/netguard.js?v=20260821c"></script>
    <script src="/js/layout.js?v=20260821c"></script>
    <script src="/js/api.js?v=20260821"></script>
    <script src="/js/auth.js?v=20260821"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #ECFDF5; color: #1A1A1A;
               min-height: 100vh; display: flex; flex-direction: column; }
        .page-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
        .card {
            background: #fff; border: 1px solid #D1FAE5; border-radius: 1.5rem;
            padding: 2rem 1.75rem; max-width: 420px; width: 100%; text-align: center;
            box-shadow: 0 8px 40px rgba(4,120,87,0.12);
        }
        .icon { font-size: 2.75rem; line-height: 1; margin-bottom: 0.75rem; }
        h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.4rem; }
        .sub { color: #6B7280; font-size: 0.9rem; line-height: 1.55; }
        .device {
            margin: 1rem 0; padding: 0.7rem 0.85rem; background: #ECFDF5; border: 1px solid #DCEBE4;
            border-radius: 0.75rem; font-size: 0.82rem; color: #4B5563; line-height: 1.5; text-align: left;
            word-break: break-word;
        }
        .device b { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em;
                    color: #047857; margin-bottom: 0.2rem; }
        .warn {
            margin-top: 0.9rem; font-size: 0.8rem; color: #8A6D1F; background: #FFF8EC;
            border: 1px solid #F0D9A8; border-radius: 0.75rem; padding: 0.65rem 0.8rem; line-height: 1.5; text-align: left;
        }
        .btns { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 1.1rem; }
        .btn {
            width: 100%; padding: 0.85rem; border-radius: 0.75rem; border: none;
            font-family: inherit; font-size: 0.97rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
            text-decoration: none; display: block;
        }
        .btn-yes { background: linear-gradient(135deg, #047857, #059669); color: #fff;
                   box-shadow: 0 4px 14px rgba(4,120,87,0.35); }
        .btn-yes:hover:not(:disabled) { transform: translateY(-1px); }
        .btn-yes:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }
        .btn-no { background: #fff; border: 2px solid #E5E7EB; color: #6B7280; }
        .btn-no:hover { border-color: #EF4444; color: #EF4444; }
        .state { font-size: 0.9rem; line-height: 1.55; }
        .state.ok { color: #16A34A; font-weight: 600; }
        .state.err { color: #DC2626; font-weight: 600; }
        body.dark { background: #191919; color: #E6E6E6; }
        body.dark .card { background: #252525; border-color: #10402F; box-shadow: 0 8px 40px rgba(0,0,0,0.3); }
        body.dark .sub { color: #A0A0A0; }
        body.dark .device { background: #0B3B2E; border-color: #1F6B4F; color: #C0C0C0; }
        body.dark .device b { color: #6EE7B7; }
        body.dark .warn { background: #2D2A1E; border-color: #5C4B1A; color: #D4A944; }
        body.dark .btn-no { background: #2A2A2A; border-color: #444; color: #C0C0C0; }
    </style>
</head>
<body>
    <script>psyWriteHeader();</script>
    <div class="page-wrap">
        <div class="card" id="card">
            <div class="icon">💻</div>
            <h1>Вход на компьютере</h1>
            <p class="sub" id="qrSub">Проверяем код…</p>
            <div id="qrBody"></div>
        </div>
    </div>
    <script>psyWriteFooter();</script>
    <script>
        // Страница открывается сканированием QR с экрана компьютера. Всё, что она делает, —
        // спрашивает у человека, он ли сейчас входит, и передаёт «да» серверу. Сам вход
        // происходит на компьютере: он опрашивает qr_login.php?action=poll.
        const qrCode = new URLSearchParams(location.search).get('code') || '';

        function qrSub(t) { document.getElementById('qrSub').textContent = t; }
        function qrBody(html) { document.getElementById('qrBody').innerHTML = html; }

        /** Из строки браузера делаем что-то читаемое: «Chrome на Windows». */
        function niceDevice(ua) {
            ua = String(ua || '');
            if (!ua) return 'Неизвестное устройство';
            let br = 'Браузер';
            if (/Edg\//.test(ua)) br = 'Edge';
            else if (/OPR\/|Opera/.test(ua)) br = 'Opera';
            else if (/YaBrowser/.test(ua)) br = 'Яндекс.Браузер';
            else if (/Firefox\//.test(ua)) br = 'Firefox';
            else if (/Chrome\//.test(ua)) br = 'Chrome';
            else if (/Safari\//.test(ua)) br = 'Safari';
            let os = '';
            if (/Windows NT/.test(ua)) os = 'Windows';
            else if (/Mac OS X/.test(ua)) os = 'macOS';
            else if (/Android/.test(ua)) os = 'Android';
            else if (/iPhone|iPad/.test(ua)) os = 'iPhone или iPad';
            else if (/Linux/.test(ua)) os = 'Linux';
            return os ? (br + ' на ' + os) : br;
        }

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"]/g, c =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        }

        async function qrInit() {
            if (!qrCode) {
                qrSub('Ссылка неполная — отсканируйте QR-код на экране компьютера ещё раз.');
                return;
            }
            let me = null;
            try { me = window.Auth && window.Auth.getCurrentUser ? await window.Auth.getCurrentUser() : null; } catch (e) {}
            if (!me) {
                // Подтвердить вход может только тот, кто уже вошёл на этом телефоне.
                qrSub('Сначала войдите на телефоне — потом вернитесь по этой ссылке.');
                qrBody('<div class="btns"><a class="btn btn-yes" href="/login.html?redirect=' +
                       encodeURIComponent('/qr.html?code=' + qrCode) + '">Войти</a></div>');
                return;
            }

            let info = null;
            try {
                const r = await fetch('/api/qr_login.php?action=info&code=' + encodeURIComponent(qrCode) + '&x=' + Date.now(),
                                      { credentials: 'include' });
                info = await r.json();
            } catch (e) {}
            if (!info || !info.ok) {
                qrSub((info && info.error) || 'Код устарел — обновите страницу входа на компьютере.');
                return;
            }

            const name = [me.first_name || me.firstName || '', me.last_name || me.lastName || ''].join(' ').trim()
                       || me.email || 'ваш аккаунт';
            qrSub('Подтвердите вход в аккаунт ' + name + ' на другом устройстве.');
            qrBody(
                '<div class="device"><b>Устройство</b>' + esc(niceDevice(info.device)) + '</div>' +
                '<div class="warn">Если вы сейчас не входили с компьютера — нажмите «Это не я». ' +
                'Никогда не подтверждайте вход по чужой просьбе.</div>' +
                '<div class="btns">' +
                '<button class="btn btn-yes" id="qrYes" onclick="qrDecide(\'approve\')">Это я, войти</button>' +
                '<button class="btn btn-no" onclick="qrDecide(\'reject\')">Это не я</button>' +
                '</div>'
            );
        }

        async function qrDecide(action) {
            const yes = document.getElementById('qrYes');
            if (yes) yes.disabled = true;
            let d = null;
            try {
                const r = await fetch('/api/qr_login.php?action=' + action, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    credentials: 'include', body: JSON.stringify({ code: qrCode })
                });
                d = await r.json();
            } catch (e) {}
            if (!d || !d.ok) {
                qrSub('');
                qrBody('<p class="state err">' + esc((d && d.error) || 'Не получилось — попробуйте ещё раз.') + '</p>');
                if (yes) yes.disabled = false;
                return;
            }
            qrSub('');
            if (action === 'approve') {
                qrBody('<p class="state ok">Готово! Возвращайтесь к компьютеру — там уже открылся кабинет.</p>');
            } else {
                qrBody('<p class="state">Вход отклонён. Если это были не вы, на всякий случай смените пароль.</p>');
            }
        }

        qrInit();
    </script>
</body>
</html>
