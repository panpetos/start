                    <div class="note-view-${n.id}">
                        ${n.title ? `<div class="note-card-title">${esc(n.title)}</div>` : ''}
                        ${n.body ? `<div class="note-card-text">${esc(n.body)}</div>` : ''}
                        <div class="note-card-meta">${fmtDateTime(n.created_at)}</div>
                        ${noteDueBadge(n)}
                    </div>
                    <div class="note-edit-${n.id}" style="display:none;margin-top:0.3rem;">
                        <input id="noteEditTitle-${n.id}" value="${esc(n.title||'')}" placeholder="Заголовок" style="width:100%;padding:0.4rem 0.6rem;border:1.5px solid #7C3AED;border-radius:0.5rem;font-family:inherit;margin-bottom:0.4rem;background:var(--a-input-bg);color:var(--a-text);">
                        <textarea id="noteEditBody-${n.id}" rows="3" placeholder="Текст" style="width:100%;padding:0.4rem 0.6rem;border:1.5px solid #7C3AED;border-radius:0.5rem;font-family:inherit;font-size:0.88rem;resize:vertical;background:var(--a-input-bg);color:var(--a-text);">${esc(n.body||'')}</textarea>
                        <div style="display:flex;gap:0.5rem;align-items:center;margin-top:0.4rem;flex-wrap:wrap;">
                            <label style="font-size:0.78rem;color:var(--a-text-sec);display:flex;align-items:center;gap:0.3rem;">Срок:
                                <input id="noteEditDue-${n.id}" type="date" value="${esc(n.due_date||'')}" style="padding:0.3rem 0.45rem;border:1.5px solid var(--a-input-border);border-radius:0.4rem;font-family:inherit;background:var(--a-input-bg);color:var(--a-text);">
                            </label>
                            <label style="font-size:0.78rem;color:var(--a-text-sec);display:flex;align-items:center;gap:0.3rem;">Время:
                                <input id="noteEditDueTime-${n.id}" type="time" value="${esc(n.due_time ? String(n.due_time).slice(0,5) : '')}" style="padding:0.3rem 0.45rem;border:1.5px solid var(--a-input-border);border-radius:0.4rem;font-family:inherit;background:var(--a-input-bg);color:var(--a-text);">
                            </label>
                            <button class="btn-sm btn-purple" onclick="saveNoteEdit(${n.id})">Сохранить</button>
                            <button class="btn-sm btn-outline" onclick="cancelNoteEdit(${n.id})">Отмена</button>
                        </div>
                    </div>
                </div>
                <button class="note-card-edit-btn" onclick="startNoteEdit(${n.id})" title="Редактировать">✏️</button>
                ${isDone ? '' : `<button class="note-card-delete" onclick="noteToTask(${n.id})" title="Перенести в задачи Клоду" style="opacity:1;font-size:0.95rem;">🤖</button>`}
                <button class="note-card-delete" onclick="deleteNote(${n.id})" title="Удалить">×</button>
            </div>`;
        }

        function renderNotesList(active, done){
            const el = document.getElementById('notesList');
            if (!el) return;
            el.innerHTML =
                (active.length ? active.map(noteCardHtml).join('') : '<div class="empty" style="padding:1.5rem;">Записок пока нет — добавьте выше.</div>') +
                (done.length ? `<details style="margin-top:1rem;"><summary style="cursor:pointer;color:var(--a-text-muted);font-size:0.9rem;">Завершённые (${done.length})</summary><div style="margin-top:0.5rem;">${done.map(noteCardHtml).join('')}</div></details>` : '');
        }

        function startNoteEdit(id){
            const view = document.querySelector('.note-view-' + id);
            const edit = document.querySelector('.note-edit-' + id);
            if (!view || !edit) return;
            view.style.display = 'none';
            edit.style.display = 'block';
        }
        function cancelNoteEdit(id){
            const view = document.querySelector('.note-view-' + id);
            const edit = document.querySelector('.note-edit-' + id);
            if (!view || !edit) return;
            view.style.display = 'block';
            edit.style.display = 'none';
        }
        async function saveNoteEdit(id){
            const title = document.getElementById('noteEditTitle-' + id).value.trim();
            const body = document.getElementById('noteEditBody-' + id).value.trim();
            const due = document.getElementById('noteEditDue-' + id).value;
            const dueTime = document.getElementById('noteEditDueTime-' + id).value;
            if (!title && !body) { alert('Введите заголовок или текст'); return; }
            try {
                await fetch('/api/admin_notes.php?action=update', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body:JSON.stringify({id, title, body, due_date: due || '', due_time: due ? (dueTime || '') : ''}) });
                renderNotes();
            } catch(e){ alert('Не удалось сохранить'); }
        }

        async function addNote(btn){
            const title = document.getElementById('noteTitle').value.trim();
            const body = document.getElementById('noteBody').value.trim();
            const due = document.getElementById('noteDueDate').value;
            const dueTime = document.getElementById('noteDueTime').value;
            const msg = document.getElementById('noteMsg');
            if (!title && !body){ if(msg){msg.textContent='Введите заголовок или текст';msg.style.color='#DC2626';} return; }
            btn.disabled = true;
            try {
                const r = await (await fetch('/api/admin_notes.php?action=add', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body:JSON.stringify({title, body, due_date: due || '', due_time: due ? (dueTime || '') : ''}) })).json();
                btn.disabled = false;
                if (r.ok) { document.getElementById('noteDueTime').value=''; renderNotes(); }
                else { if(msg){msg.textContent=r.error||'Ошибка';msg.style.color='#DC2626';} }
            } catch(e){ btn.disabled=false; if(msg){msg.textContent='Ошибка сети';msg.style.color='#DC2626';} }
        }

        async function toggleNoteDone(id, checked){
            try {
                await fetch('/api/admin_notes.php?action=update', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body:JSON.stringify({id, is_done:checked?1:0}) });
                renderNotes();
            } catch(e){}
        }

        async function deleteNote(id){
            if (!confirm('Удалить записку?')) return;
            try {
                await fetch('/api/admin_notes.php?action=delete', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body:JSON.stringify({id}) });
                renderNotes();
            } catch(e){}
        }

        async function noteToTask(id){
            const n = notesCache.find(x => x.id === id);
            if (!n) return;
            const title = (n.title || '').trim() || 'Из записки';
            const body = (n.body || n.title || '').trim();
            if (!body) { alert('Пустая записка — нечего переносить'); return; }
            if (!confirm('Перенести эту записку в «Задачи Клоду»?')) return;
            try {
                const r = await apiPostTo(DEV_API, 'add', { title, body });
                if (r.ok) {
                    try { await fetch('/api/admin_notes.php?action=update', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body:JSON.stringify({id, is_done:1}) }); } catch(e){}
                    renderNotes();
                } else {
                    alert(r.error || 'Не удалось перенести задачу');
                }
            } catch(e) { alert('Ошибка сети'); }
        }

        // ── Напоминания о сроке записки (задача #41, доработка) — за 5 минут до срока и в момент срока ──
        let noteReminderTimer = null;
        function noteReminderKey(n){ return n.id + '_' + (n.due_date||'') + '_' + (n.due_time||''); }
        function noteReminderSeen(key, stage){ try { return localStorage.getItem('psyNoteReminder_' + stage + '_' + key) === '1'; } catch(e){ return false; } }
        function noteReminderMarkSeen(key, stage){ try { localStorage.setItem('psyNoteReminder_' + stage + '_' + key, '1'); } catch(e){} }
        function noteReminderBeep(){
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.setValueAtTime(660, ctx.currentTime + 0.15);
                osc.frequency.setValueAtTime(880, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.18, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.6);
            } catch(e){}
        }
        function noteReminderToast(title, text){
            let el = document.getElementById('noteReminderToast');
            if (!el) {
                el = document.createElement('div');
                el.id = 'noteReminderToast';
                el.style.cssText = 'position:fixed;top:14px;right:14px;z-index:3000;background:#fff;border:1px solid #FCA5A5;border-left:3px solid #DC2626;border-radius:0.6rem;padding:0.6rem 1rem;box-shadow:0 8px 24px rgba(0,0,0,0.15);max-width:320px;font-size:0.85rem;cursor:pointer;color:#333;';
                el.onclick = () => { el.style.display = 'none'; };
                document.body.appendChild(el);
            }
            el.innerHTML = `<div style="font-weight:700;font-size:0.75rem;color:#DC2626;margin-bottom:0.15rem;">⏰ ${esc(title)}</div>` + esc(text);
            el.style.display = 'block';
            setTimeout(() => { if (el) el.style.display = 'none'; }, 8000);
        }
        function noteReminderNotify(title, body){
            noteReminderBeep();
            noteReminderToast(title, body);
            try {
                if (window.Notification && Notification.permission === 'granted') {
                    new Notification(title, { body, icon: '/assets/favicon.svg' });
                }
            } catch(e){}
        }
        function checkNoteReminders(notes){
            const now = Date.now();
            (notes || []).forEach(n => {
                if (parseInt(n.is_done)) return;
                if (!n.due_date || !n.due_time) return;
                const due = new Date(n.due_date + 'T' + String(n.due_time).slice(0,5) + ':00');
                if (isNaN(due)) return;
                const diffMs = due.getTime() - now;
                const key = noteReminderKey(n);
                const label = n.title || n.body || 'Записка';
                if (diffMs > 0 && diffMs <= 5 * 60 * 1000 && !noteReminderSeen(key, '5m')) {
                    noteReminderMarkSeen(key, '5m');
                    noteReminderNotify('Через 5 минут — срок записки', label);
                }
                if (diffMs <= 0 && diffMs > -10 * 60 * 1000 && !noteReminderSeen(key, 'due')) {
                    noteReminderMarkSeen(key, 'due');
                    noteReminderNotify('Срок записки наступил', label);
                }
            });
        }
        async function pollNoteReminders(){
            try {
                const res = await (await fetch('/api/admin_notes.php?action=list', { credentials:'include' })).json();
                if (res && res.ok) checkNoteReminders(res.data || []);
            } catch(e){}
        }
        function noteReminderStartPolling(){
            if (window.Notification && Notification.permission === 'default') {
                try { Notification.requestPermission(); } catch(e){}
            }
            pollNoteReminders();
            if (noteReminderTimer) clearInterval(noteReminderTimer);
            noteReminderTimer = setInterval(pollNoteReminders, 20000);
        }

        // ── Права дополнительных акков админа ──────────────────────────────────
        const SECTION_LABELS = {
            overview:'📊 Обзор', users:'👤 Пользователи', psychologists:'🎓 Психологи', appointments:'📅 Записи',
            calls:'📞 Звонки', replacements:'🔄 Замены', supervision:'🎓 Супервизия', payments:'💳 Оплаты',
            tariffs:'💰 Тарифы', robokassa:'🏦 Робокасса', yookassa:'🏦 ЮKassa', subscribers:'📧 Подписчики',
            referrals:'🔗 Источники', activity:'📜 Журнал', support:'💬 Поддержка', devtasks:'🤖 Задачи Клоду',
            notifications:'🔔 Уведомления', notes:'📝 Записки', adminperms:'🔐 Права админов', metrics:'📊 Метрики',
            sitemap:'🗺️ Карта сайта', content:'🛡 Контент'
        };
        async function renderAdminPerms(){
            let res;
            try { res = await (await fetch('/api/admin_permissions.php?action=list', { credentials:'include' })).json(); }
            catch(e){ return fail(); }
            if (!res || !res.ok) {
                document.getElementById('content').innerHTML = `<div class="panel"><div class="empty">${esc((res && res.error) || 'Доступно только администратору с полным доступом.')}</div></div>`;
                return;
            }
            const admins = res.data || [];
            const allSections = res.all_sections || Object.keys(SECTION_LABELS);
            document.getElementById('content').innerHTML =
                '<div class="note">🔐 По умолчанию у всех админов полный доступ. Отметьте галочками, какие разделы видит конкретный акк — остальные будут скрыты в его меню (например, для техподдержки или бухгалтера). Себя ограничить нельзя.</div>' +
                admins.map(a => {
                    const name = ((a.first_name||'')+' '+(a.last_name||'')).trim() || a.email || a.id;
                    const isSelf = a.id === myUserId;
                    const full = a.sections === null;
                    const checked = (key) => full || (a.sections||[]).includes(key);
                    return `<div class="panel" style="margin-bottom:0.9rem;"><div class="panel-head"><h2>${esc(name)}</h2><span class="badge ${full?'b-green':'b-amber'}">${full?'полный доступ':'ограничен: '+(a.sections||[]).length+' из '+allSections.length}</span></div>
                        <div style="padding:1rem;">
                            ${isSelf ? '<div class="muted" style="font-size:0.82rem;margin-bottom:0.5rem;">Это ваш аккаунт — себя ограничить нельзя.</div>' : ''}
                            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(180px, 100%), 1fr));gap:0.4rem;margin-bottom:0.7rem;">
                                ${allSections.map(s => `<label style="display:flex;align-items:center;gap:0.4rem;font-size:0.85rem;${isSelf?'opacity:0.5;':''}">
                                    <input type="checkbox" data-perm-admin="${esc(a.id)}" data-perm-section="${s}" ${checked(s)?'checked':''} ${isSelf?'disabled':''}> ${SECTION_LABELS[s]||s}
                                </label>`).join('')}
                            </div>
                            ${isSelf ? '' : `<button class="btn-sm btn-purple" onclick="saveAdminPerms('${esc(a.id)}')">Сохранить</button>
                            <button class="btn-sm btn-outline" onclick="grantFullAccess('${esc(a.id)}')">Дать полный доступ</button>
                            <span id="permMsg-${esc(a.id)}" style="font-size:0.85rem;margin-left:0.5rem;"></span>`}
                        </div></div>`;
                }).join('');
        }
        async function saveAdminPerms(adminId){
            const boxes = document.querySelectorAll(`input[data-perm-admin="${adminId}"]`);
            const sections = Array.from(boxes).filter(b => b.checked).map(b => b.dataset.permSection);
            const msg = document.getElementById('permMsg-' + adminId);
            try {
                const r = await (await fetch('/api/admin_permissions.php?action=set', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body:JSON.stringify({user_id: adminId, sections}) })).json();
                if (msg) { msg.textContent = r.ok ? '✅ Сохранено' : ('⚠️ ' + (r.error||'Ошибка')); msg.style.color = r.ok ? '#16A34A' : '#DC2626'; }
                if (r.ok) setTimeout(renderAdminPerms, 700);
            } catch(e){ if (msg) { msg.textContent = '⚠️ Ошибка сети'; msg.style.color = '#DC2626'; } }
        }
        async function grantFullAccess(adminId){
            try {
                await fetch('/api/admin_permissions.php?action=set', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body:JSON.stringify({user_id: adminId, sections: []}) });
                renderAdminPerms();
            } catch(e){}
        }

        // ── Helpers ─────────────────────────────────────────────────────────
        function fail(){ document.getElementById('content').innerHTML = '<div class="panel"><div class="empty">Не удалось загрузить данные. Проверьте, что вы вошли как администратор.</div></div>'; }
        function empty(msg){ document.getElementById('content').innerHTML = '<div class="panel"><div class="empty">'+esc(msg)+'</div></div>'; }

        try { if (window.lucide) lucide.createIcons(); } catch(e){}
        init();
    </script>
    <div id="psychModal" onclick="if(event.target===this)closePsychModal()">
        <div class="pm-card" id="psychModalContent"></div>
    </div>
    <script>
    var _psychRows = [];
    function closePsychModal(){ document.getElementById('psychModal').classList.remove('active'); }

    function pmField(id, label, value, type) {
        type = type || 'text';
        if (type === 'textarea') {
            return '<div class="pm-row"><div class="pm-label">'+esc(label)+'</div><div class="pm-val"><textarea class="pm-input" id="pm_'+id+'">'+esc(value||'')+'</textarea></div></div>';
        }
        return '<div class="pm-row"><div class="pm-label">'+esc(label)+'</div><div class="pm-val"><input class="pm-input" type="'+type+'" id="pm_'+id+'" value="'+esc(value||'')+'"></div></div>';
    }

    function openPsychModal(idx){
        var p = _psychRows[idx]; if(!p) return;
        var hasAvatar = p.avatar && p.avatar.length > 10;
        var initials = (p.name||'?').split(' ').map(function(w){return w[0]||''}).join('').slice(0,2).toUpperCase();
        var avatarHtml = hasAvatar
            ? '<img class="pm-avatar" src="'+esc(p.avatar)+'" alt="">'
            : '<div class="pm-initials">'+initials+'</div>';
        var approved = String(p.is_approved)==='1';
        var nameParts = (p.name||'').split(' ');
        var firstName = nameParts[0]||'';
        var lastName = nameParts.slice(1).join(' ')||'';

        var html = '<button class="pm-close" onclick="closePsychModal()">&times;</button>' +
            avatarHtml +
            '<div class="pm-name">'+esc(p.name||'—')+'</div>' +
            '<div class="pm-spec">'+esc(p.specialization||'Специализация не указана')+'</div>' +
            '<div class="pm-row"><div class="pm-label">ID</div><div class="pm-val">'+esc(p.id||'')+'</div></div>' +
            '<div class="pm-row"><div class="pm-label">Статус</div><div class="pm-val">'+(approved?'✅ Одобрен':'⏳ На модерации')+'</div></div>' +

            '<div class="pm-section">Личные данные</div>' +
            pmField('first_name','Имя',firstName) +
            pmField('last_name','Фамилия',lastName) +
            pmField('specialization','Специализация',p.specialization) +
            pmField('experience','Опыт (лет)',p.experience||'','number') +
            pmField('price','Цена (₽)',p.price||'','number') +
            pmField('education','Образование',p.education,'textarea') +
            pmField('description','О себе',p.description,'textarea') +
            pmField('not_working_with','Не работает с',p.not_working_with,'textarea') +

            '<div class="pm-section">Контакты</div>' +
            '<div class="pm-row"><div class="pm-label">Email</div><div class="pm-val">'+esc(p.email||'—')+'</div></div>' +
            pmField('phone','Телефон',p.phone) +
            pmField('telegram','Telegram',p.telegram) +
            pmField('whatsapp','WhatsApp',p.whatsapp) +
            pmField('max_msg','MAX',p.max_msg) +

            '<div class="pm-section">Документы и сертификаты</div>' +
            '<div id="pmCreds" class="pm-creds"><span class="pm-cred-empty">Загрузка...</span></div>' +

            '<div class="pm-actions">' +
                '<button class="btn-sm btn-purple" onclick="savePsychModal(\''+esc(p.id)+'\')">Сохранить изменения</button>' +
                '<span class="pm-save-ok" id="pmSaveOk">✓ Сохранено</span>' +
                (approved
                    ? '<button class="btn-sm btn-outline" onclick="toggleApproved(\''+esc(p.id)+'\',0);closePsychModal()">Снять одобрение</button>'
                    : '<button class="btn-sm btn-purple" onclick="toggleApproved(\''+esc(p.id)+'\',1);closePsychModal()">Одобрить</button>') +
            '</div>';
        document.getElementById('psychModalContent').innerHTML = html;
        document.getElementById('psychModal').classList.add('active');
        loadPsychCredentials(p.id);
    }

    async function loadPsychCredentials(psychId) {
        var cont = document.getElementById('pmCreds');
        if (!cont) return;
        try {
            var res = await apiPost('psychologist-credentials', { psychologist_id: psychId });
            var creds = (res && res.data) ? res.data : [];
            if (!creds.length) { cont.innerHTML = '<span class="pm-cred-empty">Нет загруженных документов</span>'; return; }
            cont.innerHTML = creds.map(function(c) {
                var typeLabel = c.type === 'cert' ? 'Сертификат' : (c.type === 'inn' ? 'ИНН' : 'Диплом');
                var title = typeLabel + (c.name ? ': '+c.name : '');
                if (c.url) {
                    return '<a href="'+esc(c.url)+'" target="_blank" title="'+esc(title)+'">' +
                        '<img class="pm-cred-thumb" src="'+esc(c.url)+'" alt="'+esc(typeLabel)+'" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<span class=pm-cred-placeholder>'+esc(typeLabel)+'</span>\'">' +
                        '</a>';
                }
                return '<span class="pm-cred-placeholder">'+esc(title)+'</span>';
            }).join('');
        } catch(e) { cont.innerHTML = '<span class="pm-cred-empty">Не удалось загрузить</span>'; }
    }

    async function savePsychModal(psychId) {
        var data = { psychologist_id: psychId };
        var fields = ['first_name','last_name','specialization','experience','price','education','description','not_working_with','phone','telegram','whatsapp','max_msg'];
        fields.forEach(function(f) {
            var el = document.getElementById('pm_'+f);
            if (el) data[f] = el.value;
        });
        if (data.experience !== undefined) data.experience = parseInt(data.experience) || 0;
        if (data.price !== undefined) data.price = parseFloat(data.price) || 0;
        try {
            var res = await apiPost('update-psychologist', data);
            if (res && res.ok) {
                var ok = document.getElementById('pmSaveOk');
                if (ok) { ok.style.display = 'inline'; setTimeout(function(){ ok.style.display = 'none'; }, 2000); }
                renderPsych();
            } else { alert('Ошибка: '+(res.error||'Неизвестная ошибка')); }
        } catch(e) { alert('Ошибка сохранения'); }
    }
    </script>
