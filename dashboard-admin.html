<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка — psytalk.pro</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/layout.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #F4F0FF; min-height: 100vh; color: #1A1A1A; padding-top: 84px; }
        .container { max-width: 1280px; margin: 0 auto; padding: 1.5rem; }
        .page-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.75rem; }
        .page-head h1 { font-size: 1.6rem; letter-spacing: -0.02em; }
        .page-head p { color: #6B7280; font-size: 0.9rem; }

        .tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
        .tab { padding: 0.55rem 1rem; border-radius: 0.7rem; border: 1px solid #E5E0F5; background: #fff; color: #4B5563; font-weight: 600; font-size: 0.875rem; cursor: pointer; font-family: inherit; transition: all 0.15s; }
        .tab:hover { border-color: #C4B5FD; }
        .tab.active { background: linear-gradient(135deg,#7C3AED,#9F67FA); color: #fff; border-color: transparent; box-shadow: 0 3px 10px rgba(124,58,237,0.3); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px,1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .stat { background: #fff; border-radius: 1rem; padding: 1.25rem; border: 1px solid #EDE9FF; box-shadow: 0 2px 10px rgba(124,58,237,0.06); }
        .stat .v { font-size: 1.75rem; font-weight: 800; color: #7C3AED; letter-spacing: -0.02em; }
        .stat .l { font-size: 0.8rem; color: #6B7280; margin-top: 0.2rem; }

        .panel { background: #fff; border-radius: 1.1rem; border: 1px solid #EDE9FF; box-shadow: 0 2px 12px rgba(0,0,0,0.05); overflow: hidden; }
        .panel-head { padding: 1rem 1.25rem; border-bottom: 1px solid #F0ECF8; display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
        .panel-head h2 { font-size: 1.05rem; }
        .panel-head .search { padding: 0.5rem 0.85rem; border: 1.5px solid #E5E7EB; border-radius: 0.6rem; font-size: 0.85rem; font-family: inherit; outline: none; min-width: 200px; }
        .panel-head .search:focus { border-color: #7C3AED; }

        .tbl-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { text-align: left; padding: 0.7rem 1rem; background: #FAFAFA; color: #6B7280; font-weight: 600; white-space: nowrap; border-bottom: 1px solid #F0F0F0; position: sticky; top: 0; }
        td { padding: 0.7rem 1rem; border-bottom: 1px solid #F5F5F5; vertical-align: middle; }
        tr:hover td { background: #FBFAFF; }
        .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 2rem; font-size: 0.72rem; font-weight: 700; }
        .b-green { background: #F0FDF4; color: #16A34A; border: 1px solid #BBF7D0; }
        .b-purple { background: #F3E8FF; color: #7C3AED; border: 1px solid #E9D5FF; }
        .b-red { background: #FFF1F2; color: #BE123C; border: 1px solid #FECDD3; }
        .b-amber { background: #FFF8E7; color: #92400E; border: 1px solid #FCD34D; }
        .b-gray { background: #F3F4F6; color: #6B7280; border: 1px solid #E5E7EB; }
        .btn-sm { padding: 0.35rem 0.7rem; border-radius: 0.5rem; border: none; font-size: 0.78rem; font-weight: 600; cursor: pointer; font-family: inherit; }
        .btn-purple { background: linear-gradient(135deg,#7C3AED,#9F67FA); color: #fff; }
        .btn-outline { background: #fff; border: 1.5px solid #E5E7EB; color: #374151; }
        .btn-outline:hover { border-color: #7C3AED; color: #7C3AED; }
        .btn-red { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; }
        .muted { color: #9CA3AF; }
        .loading, .empty { text-align: center; padding: 2.5rem; color: #9CA3AF; }
        .note { background: #FFF8E7; border: 1px solid #FCD34D; color: #92400E; border-radius: 0.7rem; padding: 0.75rem 1rem; font-size: 0.83rem; margin-bottom: 1rem; line-height: 1.5; }

        .timeline { padding: 0.5rem 0; }
        .tl-item { display: flex; gap: 0.85rem; padding: 0.65rem 1.25rem; border-bottom: 1px solid #F5F5F5; align-items: flex-start; }
        .tl-ico { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 0.9rem; }
        .tl-body { flex: 1; min-width: 0; }
        .tl-sum { font-size: 0.87rem; color: #1A1A1A; }
        .tl-ts { font-size: 0.74rem; color: #9CA3AF; margin-top: 0.1rem; }
        @media (max-width: 820px) { #tariffGrid { grid-template-columns: 1fr !important; } }
    </style>
</head>
<body>
    <script>psyWriteHeader();</script>
    <div class="container">
        <div class="page-head">
            <div>
                <h1>Админ-панель</h1>
                <p id="adminWho">Загрузка...</p>
            </div>
            <button class="btn-sm btn-outline" onclick="psyLogout()" style="padding:0.5rem 1rem;">Выйти →</button>
        </div>

        <div class="tabs" id="tabs">
            <button class="tab active" data-tab="overview" onclick="switchTab('overview')">Обзор</button>
            <button class="tab" data-tab="support" onclick="switchTab('support')">💬 Поддержка / чаты</button>
            <button class="tab" data-tab="users" onclick="switchTab('users')">Пользователи</button>
            <button class="tab" data-tab="psychologists" onclick="switchTab('psychologists')">Психологи</button>
            <button class="tab" data-tab="tariffs" onclick="switchTab('tariffs')">Тарифы и цены</button>
            <button class="tab" data-tab="robokassa" onclick="switchTab('robokassa')">Робокасса</button>
            <button class="tab" data-tab="devtasks" onclick="switchTab('devtasks')">🤖 Задачи Клоду</button>
            <button class="tab" data-tab="appointments" onclick="switchTab('appointments')">Записи</button>
            <button class="tab" data-tab="replacements" onclick="switchTab('replacements')">Замены психолога</button>
            <button class="tab" data-tab="supervision" onclick="switchTab('supervision')">Супервизия</button>
            <button class="tab" data-tab="calls" onclick="switchTab('calls')">Звонки / сессии</button>
            <button class="tab" data-tab="payments" onclick="switchTab('payments')">Оплаты</button>
            <button class="tab" data-tab="subscribers" onclick="switchTab('subscribers')">Подписки</button>
            <button class="tab" data-tab="referrals" onclick="switchTab('referrals')">Источники</button>
            <button class="tab" data-tab="activity" onclick="switchTab('activity')">Журнал активности</button>
        </div>

        <div id="content"><div class="loading">Загрузка...</div></div>
    </div>

    <script>
        const API = '/api/admin_ext.php';
        let cache = {};

        function fmtMoney(n){ return (Number(n)||0).toLocaleString('ru-RU'); }
        function fmtDateTime(s){ if(!s) return '—'; const d=new Date(String(s).replace(' ','T')); if(isNaN(d)) return s; return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}); }
        function fmtDur(sec){ sec=Number(sec)||0; if(!sec) return '—'; const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }
        function esc(s){ const d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }

        async function apiGet(action){
            const r = await fetch(`${API}?action=${action}`, { credentials:'include' });
            return r.json();
        }
        async function apiPost(action, body){
            const r = await fetch(`${API}?action=${action}`, { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify(body) });
            return r.json();
        }

        async function psyLogout(){
            try { sessionStorage.removeItem('psy_user'); } catch(e) {}
            try {
                if (window.Auth && window.Auth.logout) { await window.Auth.logout(); return; }
                await fetch('/api/auth.php?action=logout', { method: 'POST', credentials: 'include' });
            } catch (e) {}
            window.location.href = '/';
        }
        window.psyLogout = psyLogout;

        async function init(){
            let user = null;
            if (window.Auth && window.Auth.getCurrentUser) { try { user = await window.Auth.getCurrentUser(); } catch(e){} }
            if (!user) { window.location.href = '/login.html?redirect=' + encodeURIComponent('/dashboard-admin.html'); return; }
            if (user.role !== 'admin') {
                document.getElementById('content').innerHTML = '<div class="panel"><div class="empty">⛔ Доступ только для администратора.<br>Вы вошли как «'+esc(user.role)+'».</div></div>';
                document.getElementById('tabs').style.display = 'none';
                document.getElementById('adminWho').textContent = '';
                return;
            }
            document.getElementById('adminWho').textContent = 'Вы вошли как администратор: ' + ((user.first_name||'')+' '+(user.last_name||'')).trim();
            switchTab('overview');
        }

        function switchTab(tab){
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab===tab));
            const el = document.getElementById('content');
            el.innerHTML = '<div class="loading">Загрузка...</div>';
            ({ overview:renderOverview, support:renderSupport, users:renderUsers, psychologists:renderPsych, tariffs:renderTariffs, robokassa:renderRobokassa, devtasks:renderDevTasks, appointments:renderAppointments, replacements:renderReplacements, supervision:renderSupervision, calls:renderCalls, payments:renderPayments, subscribers:renderSubscribers, referrals:renderReferrals, activity:renderActivity }[tab])();
        }

        async function renderOverview(){
            const res = await apiGet('overview');
            if (!res.ok) return fail();
            const d = res.data;
            const cards = [
                ['Пользователей', d.users_total], ['Клиентов', d.clients], ['Психологов', d.psychologists],
                ['На модерации', d.psy_pending], ['Записей всего', d.appointments_total],
                ['Запланировано', d.appt_scheduled], ['Завершено', d.appt_completed], ['Отменено', d.appt_cancelled],
                ['Успешных оплат', d.payments_total], ['Выручка всего, ₽', fmtMoney(d.revenue_total)],
                ['Выручка за месяц, ₽', fmtMoney(d.revenue_month)], ['Звонков', d.calls_total],
                ['Среднее время звонка', fmtDur(d.avg_call_sec)],
            ];
            document.getElementById('content').innerHTML =
                '<div class="stats-grid">' + cards.map(c => `<div class="stat"><div class="v">${esc(c[1])}</div><div class="l">${esc(c[0])}</div></div>`).join('') + '</div>' +
                '<div class="note">📊 Сводка по реальным данным БД. Раздел «Журнал активности» собирает события (регистрации, записи, оплаты, звонки) в единую ленту — это аудит на основе данных. Детальный аудит действий (входы, правки полей) требует логирующих хуков в бэкенде — добавлю, когда дашь доступ к серверной части.</div>';
        }

        function tableSearch(id){
            const q = document.getElementById(id).value.toLowerCase();
            document.querySelectorAll('#dataTable tbody tr').forEach(tr => {
                tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
            });
        }

        function panel(title, searchId, bodyHtml){
            return `<div class="panel">
                <div class="panel-head"><h2>${title}</h2>
                  <input class="search" id="${searchId}" placeholder="Поиск..." oninput="tableSearch('${searchId}')"></div>
                <div class="tbl-wrap">${bodyHtml}</div></div>`;
        }

        async function renderUsers(){
            const res = await apiGet('users');
            if (!res.ok) return fail();
            const rows = res.data || [];
            if (!rows.length) return empty('Нет пользователей');
            const body = `<table id="dataTable"><thead><tr>
                <th>Имя</th><th>Email</th><th>Роль</th><th>Статус</th><th>Регистрация</th><th>Действия</th></tr></thead><tbody>` +
                rows.map(u => {
                    const name = ((u.first_name||'')+' '+(u.last_name||'')).trim() || '—';
                    const role = u.role==='admin'?'<span class="badge b-purple">админ</span>':u.role==='psychologist'?'<span class="badge b-green">психолог</span>':'<span class="badge b-gray">клиент</span>';
                    const frozen = String(u.is_frozen)==='1';
                    const status = frozen?'<span class="badge b-red">заморожен</span>':'<span class="badge b-green">активен</span>';
                    const btn = frozen
                        ? `<button class="btn-sm btn-outline" onclick="toggleFrozen('${esc(u.id)}',0)">Разморозить</button>`
                        : `<button class="btn-sm btn-red" onclick="toggleFrozen('${esc(u.id)}',1)">Заморозить</button>`;
                    return `<tr><td>${esc(name)}</td><td>${esc(u.email||'—')}</td><td>${role}</td><td>${status}</td><td class="muted">${fmtDateTime(u.created_at)}</td><td>${u.role!=='admin'?btn:''}</td></tr>`;
                }).join('') + '</tbody></table>';
            document.getElementById('content').innerHTML = panel('Пользователи ('+rows.length+')','sUsers',body);
        }

        async function toggleFrozen(id, frozen){
            const res = await apiPost('set-frozen', { user_id:id, frozen });
            if (res.error) return alert(res.error);
            renderUsers();
        }

        async function renderPsych(){
            const res = await apiGet('psychologists');
            if (!res.ok) return fail();
            const rows = res.data || [];
            if (!rows.length) return empty('Нет психологов');
            // на модерации — сверху
            rows.sort((a,b)=> (String(a.is_approved)==='1'?1:0) - (String(b.is_approved)==='1'?1:0));
            const body = `<table id="dataTable"><thead><tr>
                <th>Имя</th><th>Контакты</th><th>Специализация</th><th>Цена</th><th>Опыт</th><th>Статус</th><th>Действия</th></tr></thead><tbody>` +
                rows.map((p,idx) => {
                    const approved = String(p.is_approved)==='1';
                    const status = approved?'<span class="badge b-green">одобрен</span>':'<span class="badge b-amber">на модерации</span>';
                    const btn = approved
                        ? `<button class="btn-sm btn-outline" onclick="toggleApproved('${esc(p.id)}',0)">Снять</button>`
                        : `<button class="btn-sm btn-purple" onclick="toggleApproved('${esc(p.id)}',1)">Одобрить</button>`;
                    const contactLines = [
                        p.phone ? '📞 '+esc(p.phone) : '',
                        p.telegram ? '✈️ TG: '+esc(p.telegram) : '',
                        p.whatsapp ? '🟢 WA: '+esc(p.whatsapp) : '',
                        p.max_msg ? '🅼 MAX: '+esc(p.max_msg) : ''
                    ].filter(Boolean).join('<br>');
                    const contact = `${esc(p.email||'—')}${p.phone?('<br>'+esc(p.phone)):''}`;
                    const details = [
                        contactLines ? '<b>Связь:</b><br>'+contactLines : '<span class="muted">Контакты не указаны</span>',
                        p.description ? '<b>О себе:</b> '+esc(p.description) : '',
                        p.education ? '<b>Образование:</b> '+esc(p.education) : '',
                        (Array.isArray(p.certifications)&&p.certifications.length) ? '<b>Сертификаты:</b> '+esc(p.certifications.join(', ')) : '',
                        p.not_working_with ? '<b>Не работает с:</b> '+esc(p.not_working_with) : '',
                        '<b>ID:</b> '+esc(p.id)
                    ].filter(Boolean).join('<br>');
                    const priceCell = (parseFloat(p.price)>0)
                        ? `<div style="font-weight:700;margin-bottom:0.25rem;">${fmtMoney(p.price)} ₽</div><button class="btn-sm btn-outline" onclick="setPrice('${esc(p.id)}',${parseFloat(p.price)||0})" title="Изменить цену">✎ Изменить</button>`
                        : `<div><span class="badge b-amber">не задана</span></div><button class="btn-sm btn-purple" style="margin-top:0.25rem;" onclick="setPrice('${esc(p.id)}',0)">Назначить цену</button>`;
                    return `<tr><td>${esc(p.name||'—')}</td><td style="font-size:0.8rem;">${contact}</td><td>${esc(p.specialization||'—')}</td><td style="white-space:nowrap;">${priceCell}</td><td>${esc(p.experience||0)} лет</td><td>${status}</td><td style="white-space:nowrap;">${btn} <button class="btn-sm btn-outline" onclick="document.getElementById('pd${idx}').style.display=document.getElementById('pd${idx}').style.display==='none'?'table-row':'none'">Подробнее</button></td></tr>
                    <tr id="pd${idx}" style="display:none;"><td colspan="7" style="background:#FBFAFF;font-size:0.82rem;line-height:1.7;color:#374151;">${details||'<span class="muted">Профиль не заполнен — стоит запросить данные перед одобрением.</span>'}</td></tr>`;
                }).join('') + '</tbody></table>';
            document.getElementById('content').innerHTML = panel('Психологи ('+rows.length+')','sPsych',body);
        }

        async function toggleApproved(id, approved){
            const res = await apiPost('set-approved', { psychologist_id:id, approved });
            if (res.error) return alert(res.error);
            renderPsych();
        }

        async function setPrice(id, current){
            const v = prompt('Стоимость сессии для этого психолога (₽):', current || '');
            if (v === null) return;
            const price = parseFloat(v);
            if (isNaN(price) || price < 0) { alert('Введите корректную сумму'); return; }
            const res = await apiPost('set-price', { psychologist_id:id, price });
            if (res.error) return alert(res.error);
            renderPsych();
        }

        async function renderAppointments(){
            const res = await apiGet('appointments');
            if (!res.ok) return fail();
            const rows = res.data || [];
            if (!rows.length) return empty('Нет записей');
            const stMap = { scheduled:['b-purple','запланировано'], completed:['b-green','завершено'], cancelled:['b-red','отменено'] };
            const body = `<table id="dataTable"><thead><tr>
                <th>Дата/время</th><th>Клиент</th><th>Психолог</th><th>Формат</th><th>Цена</th><th>Статус</th></tr></thead><tbody>` +
                rows.map(a => {
                    const s = stMap[a.status] || ['b-gray', a.status||'—'];
                    return `<tr><td>${fmtDateTime(a.date_time)}</td><td>${esc(a.client_name||'—')}</td><td>${esc(a.psychologist_name||'—')}</td><td>${esc(a.format||'—')}</td><td>${fmtMoney(a.price)} ₽</td><td><span class="badge ${s[0]}">${esc(s[1])}</span></td></tr>`;
                }).join('') + '</tbody></table>';
            document.getElementById('content').innerHTML = panel('Записи ('+rows.length+')','sAppt',body);
        }

        async function renderCalls(){
            const res = await apiGet('calls');
            if (!res.ok) return fail();
            const rows = res.data || [];
            if (!rows.length) return empty('Звонков пока нет (появятся после первых сессий)');
            const body = `<table id="dataTable"><thead><tr>
                <th>Время</th><th>От кого</th><th>Кому</th><th>Длительность</th><th>Статус</th></tr></thead><tbody>` +
                rows.map(c => {
                    const dur = c.duration ?? c.duration_sec ?? c.seconds ?? c.length;
                    const st = c.status ? `<span class="badge b-gray">${esc(c.status)}</span>` : '';
                    return `<tr><td>${fmtDateTime(c.created_at||c.started_at||c.start_time)}</td><td>${esc(c.from_name||'—')}</td><td>${esc(c.to_name||'—')}</td><td>${fmtDur(dur)}</td><td>${st}</td></tr>`;
                }).join('') + '</tbody></table>';
            document.getElementById('content').innerHTML = panel('Звонки / сессии ('+rows.length+')','sCalls',body);
        }

        async function renderPayments(){
            const res = await apiGet('payments');
            if (!res.ok) return fail();
            const rows = res.data || [];
            if (!rows.length) return empty('Оплат пока нет');
            const body = `<table id="dataTable"><thead><tr>
                <th>Дата</th><th>Клиент</th><th>Психолог</th><th>Сумма</th><th>Статус</th></tr></thead><tbody>` +
                rows.map(p => {
                    const ok = p.status==='success';
                    const st = ok?'<span class="badge b-green">успешно</span>':`<span class="badge b-amber">${esc(p.status||'—')}</span>`;
                    return `<tr><td>${fmtDateTime(p.paid_at||p.created_at)}</td><td>${esc(p.client_name||'—')}</td><td>${esc(p.psychologist_name||'—')}</td><td><b>${fmtMoney(p.amount)} ₽</b></td><td>${st}</td></tr>`;
                }).join('') + '</tbody></table>';
            document.getElementById('content').innerHTML = panel('Оплаты ('+rows.length+')','sPay',body);
        }

        async function renderSubscribers(){
            const res = await apiGet('subscribers');
            if (!res.ok) return fail();
            const rows = res.data || [];
            if (!rows.length) return empty('Пока никто не подписался на рассылку');
            const emails = rows.map(r => r.email).filter(Boolean);
            const body = `<table id="dataTable"><thead><tr><th>Email</th><th>Дата подписки</th></tr></thead><tbody>` +
                rows.map(r => `<tr><td>${esc(r.email)}</td><td class="muted">${fmtDateTime(r.created_at)}</td></tr>`).join('') + '</tbody></table>';
            document.getElementById('content').innerHTML =
                `<div class="panel"><div class="panel-head"><h2>Подписки на рассылку (${rows.length})</h2>
                  <button class="btn-sm btn-purple" onclick="copyEmails()">📋 Скопировать все email</button></div>
                  <textarea id="allEmails" style="position:absolute;left:-9999px;">${esc(emails.join(', '))}</textarea>
                  <div class="tbl-wrap">${body}</div></div>`;
        }
        function copyEmails(){
            const t = document.getElementById('allEmails'); t.style.left='0'; t.select();
            try { document.execCommand('copy'); alert('Email-адреса скопированы в буфер обмена'); } catch(e){ alert('Скопируйте вручную из поля'); }
            t.style.left='-9999px';
        }

        async function renderReferrals(){
            const res = await apiGet('referrals');
            if (!res.ok) return fail();
            const rows = res.data || [];
            const summary = res.summary || {};
            const sumHtml = Object.keys(summary).length

        ];

        function sGet(k, def){ const v = SETTINGS[k]; return (v===undefined||v===null||v==='') ? def : v; }
        function num(id){ const el=document.getElementById(id); return el ? (parseFloat(el.value)||0) : 0; }

        async function renderTariffs(){
            // Читаем из БД (admin), при пустом — из публичного эндпоинта.
            let s = {};
            try { const r = await apiGet('get-settings'); if (r.ok && r.data) s = r.data; } catch(e){}
            if (!s || !Object.keys(s).length) {
                try { const r2 = await fetch('/api/settings.php?action=public'); s = await r2.json(); } catch(e){}
            }
            SETTINGS = s || {};

            const fld = (id, label, val, suffix) =>
                `<label style="display:block;margin-bottom:0.9rem;">
                    <span style="display:block;font-size:0.82rem;color:#6B7280;margin-bottom:0.3rem;font-weight:600;">${label}</span>

                      <span style="color:#9CA3AF;font-size:0.85rem;">${suffix||''}</span>

            const baseInputs = TARIFFS.map(t =>

            ).join('');

            const commission = sGet('platform_commission', '40');
            const acquiring  = sGet('acquiring_fee', '3');
            const tax        = sGet('tax_rate', '6');

            // Блок акций «первая сессия»
            const promoBlocks = TARIFFS.map(t => {

                    <input type="checkbox" id="promo_${k}_enabled" ${en?'checked':''} style="width:18px;height:18px;accent-color:#7C3AED;cursor:pointer;">

                  </label>
                  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0.7rem;">
                    <label style="font-size:0.8rem;color:#6B7280;">Цена акции, ₽<br>
                      <input id="promo_${k}_price" type="number" min="0" step="50" value="${esc(sGet('promo_'+k+'_price',''))}" style="width:100%;margin-top:0.25rem;padding:0.45rem 0.6rem;border:1.5px solid #E5E7EB;border-radius:0.5rem;font-family:inherit;"></label>
                    <label style="font-size:0.8rem;color:#6B7280;">Заголовок<br>
                      <input id="promo_${k}_title" type="text" value="${esc(sGet('promo_'+k+'_title',''))}" placeholder="Сессия-знакомство" style="width:100%;margin-top:0.25rem;padding:0.45rem 0.6rem;border:1.5px solid #E5E7EB;border-radius:0.5rem;font-family:inherit;"></label>
                    <label style="font-size:0.8rem;color:#6B7280;">Длительность<br>
                      <input id="promo_${k}_duration" type="text" value="${esc(sGet('promo_'+k+'_duration',''))}" placeholder="30 мин" style="width:100%;margin-top:0.25rem;padding:0.45rem 0.6rem;border:1.5px solid #E5E7EB;border-radius:0.5rem;font-family:inherit;"></label>
                    <label style="font-size:0.8rem;color:#6B7280;">Действует до<br>
                      <input id="promo_${k}_deadline" type="datetime-local" value="${esc(sGet('promo_'+k+'_deadline',''))}" style="width:100%;margin-top:0.25rem;padding:0.45rem 0.6rem;border:1.5px solid #E5E7EB;border-radius:0.5rem;font-family:inherit;"></label>

            document.getElementById('content').innerHTML = `
              <div class="note">💡 Базовые цены тарифов видны клиентам на страницах «Пакеты и цены» и в подборе. Комиссия и налоги используются только для расчёта дохода — клиенту проценты не показываются.</div>

                  <div style="padding:1.25rem;">
                    ${fld('commission_platform','Комиссия платформы', commission, '%')}
                    ${fld('fee_acquiring','Эквайринг / Robokassa', acquiring, '%')}
                    ${fld('tax_rate','Налог УСН (с комиссии)', tax, '%')}

              </div>`;

        function recalcIncome(){
            const c = num('commission_platform'), a = num('fee_acquiring'), t = num('tax_rate');
            const rows = TARIFFS.map(tr => {
                const P = num('price_'+tr.key);
                const comm = P*c/100;
                const psy = P - comm;
                const acq = P*a/100;
                const tax = comm*t/100;
                const net = comm - acq - tax;
                const f = n => Math.round(n).toLocaleString('ru-RU');
                return `<tr>
                  <td><b>${esc(tr.label)}</b></td>
                  <td>${f(P)} ₽</td>
                  <td>${f(psy)} ₽</td>
                  <td>${f(comm)} ₽</td>
                  <td class="muted">−${f(acq)} ₽</td>
                  <td class="muted">−${f(tax)} ₽</td>
                  <td style="color:#16A34A;font-weight:700;">${f(net)} ₽</td>
                </tr>`;
            }).join('');
            const el = document.getElementById('incomeTable');
            if (el) el.innerHTML = `
              <table style="font-size:0.78rem;"><thead><tr>
                <th>Тариф</th><th>Клиент платит</th><th>Психолог</th><th>Комиссия</th><th>Эквайринг</th><th>Налог</th><th>Чистыми</th>
              </tr></thead><tbody>${rows}</tbody></table>
              <p style="font-size:0.74rem;color:#9CA3AF;margin-top:0.6rem;line-height:1.5;">«Психолог» — выплата специалисту (цена минус комиссия). «Чистыми» — доход платформы после эквайринга и налога. Клиент видит только итоговую цену.</p>`;
        }

        async function saveTariffs(btn){
            const payload = {};
            TARIFFS.forEach(t => { payload['price_'+t.key] = num('price_'+t.key); });
            payload.platform_commission = num('commission_platform');
            payload.acquiring_fee = num('fee_acquiring');
            payload.tax_rate = num('tax_rate');
            TARIFFS.forEach(t => {
                const k = t.key;
                payload['promo_'+k+'_enabled']  = document.getElementById('promo_'+k+'_enabled').checked ? '1' : '0';
                payload['promo_'+k+'_price']    = document.getElementById('promo_'+k+'_price').value.trim();
                payload['promo_'+k+'_title']    = document.getElementById('promo_'+k+'_title').value.trim();
                payload['promo_'+k+'_duration'] = document.getElementById('promo_'+k+'_duration').value.trim();
                payload['promo_'+k+'_deadline'] = document.getElementById('promo_'+k+'_deadline').value.trim();
            });
            const msg = document.getElementById('saveMsg');
            btn.disabled = true; if(msg){ msg.textContent='Сохраняем...'; msg.style.color='#6B7280'; }
            const res = await apiPost('save-settings', { settings: payload });
            btn.disabled = false;
            if (res && res.ok) {
                if(msg){ msg.textContent = '✅ Сохранено (обновлено полей: '+(res.saved||0)+')'; msg.style.color='#16A34A'; }
            } else {
                if(msg){ msg.textContent = '⚠️ ' + ((res&&res.error)||'Не удалось сохранить'); msg.style.color='#DC2626'; }
            }
        }

        // ── Поддержка / входящие чаты (рег. и не зарег.) ──────────────────────────
        let supportThreadId = null;
        async function renderSupport(){
            let res;
            try { res = await (await fetch('/api/support.php?action=threads', { credentials:'include' })).json(); }
            catch(e){ return fail(); }
            if (!res || !res.ok) return fail();
            const rows = res.data || [];
            const roleBadge = (t) => {
                const reg = t.registered ? '<span class="badge b-green">в системе</span>' : '<span class="badge b-amber">не зарегистрирован</span>';
                const role = t.role ? `<span class="badge b-purple">${esc(t.role)}</span>` : '';

            };

                const unread = t.unread > 0 ? `<span class="badge b-red">${t.unread} новых</span>` : '';
                return `<tr style="cursor:pointer;" onclick="openSupportThread('${esc(t.id)}')">
                    <td><b>${esc(t.name || 'Гость')}</b><br><span class="muted" style="font-size:0.78rem;">${contact}</span></td>
                    <td>${roleBadge(t)}</td>

            document.getElementById('content').innerHTML =
                '<div class="note">💬 Здесь все обращения из чата поддержки на сайте — от зарегистрированных (контакты подставляются автоматически) и от гостей (указывают имя, email и роль). Нажмите на обращение, чтобы ответить.</div>' +
                `<div class="panel"><div class="panel-head"><h2>Обращения (${rows.length})</h2><button class="btn-sm btn-outline" onclick="renderSupport()">↻ Обновить</button></div>
                  <div class="tbl-wrap"><table><thead><tr><th>Контакт</th><th>Роль / статус</th><th>Последнее сообщение</th><th>Когда</th></tr></thead><tbody>${list}</tbody></table></div></div>` +
                '<div id="supportThreadPanel" style="margin-top:1.25rem;"></div>';

        async function openSupportThread(id){
            supportThreadId = id;
            const panel = document.getElementById('supportThreadPanel');
            panel.innerHTML = '<div class="panel"><div class="loading">Загрузка переписки...</div></div>';
            let res;
            try { res = await (await fetch('/api/support.php?action=messages&thread_id=' + encodeURIComponent(id), { credentials:'include' })).json(); }
            catch(e){ panel.innerHTML = '<div class="panel"><div class="empty">Не удалось загрузить</div></div>'; return; }
            const t = res.thread || {};
            const msgs = res.data || [];
            const head = `${esc(t.name||'Гость')} · ${t.role?esc(t.role):'—'} · ${t.registered||t.user_id?'<span class="badge b-green">в системе</span>':'<span class="badge b-amber">гость</span>'}${t.email?(' · '+esc(t.email)):''}`;
            const bubbles = msgs.length ? msgs.map(m => {
                const admin = m.sender === 'admin';
                return `<div style="align-self:${admin?'flex-end':'flex-start'};max-width:75%;background:${admin?'linear-gradient(135deg,#7C3AED,#9F67FA)':'#fff'};color:${admin?'#fff':'#1A1A1A'};border:${admin?'none':'1px solid #ECECEC'};border-radius:0.9rem;padding:0.5rem 0.8rem;font-size:0.875rem;line-height:1.45;">${esc(m.body)}<div style="font-size:0.68rem;opacity:0.7;margin-top:0.2rem;">${fmtDateTime(m.created_at)}</div></div>`;
            }).join('') : '<div class="muted" style="text-align:center;padding:1rem;">Нет сообщений</div>';
            panel.innerHTML = `<div class="panel">
                <div class="panel-head"><h2 style="font-size:0.95rem;">${head}</h2></div>
                <div style="display:flex;flex-direction:column;gap:0.5rem;padding:1rem;background:#F7F8FA;max-height:340px;overflow-y:auto;">${bubbles}</div>

                    <input id="supReplyInput" placeholder="Ответ клиенту..." style="flex:1;padding:0.6rem 0.85rem;border:1.5px solid #E5E7EB;border-radius:0.6rem;font-family:inherit;outline:none;" onkeypress="if(event.key==='Enter')sendSupportReply()">
                    <button class="btn-sm btn-purple" style="padding:0.6rem 1.2rem;" onclick="sendSupportReply()">Ответить</button>
                </div></div>`;
            const box = panel.querySelector('div[style*="overflow-y"]'); if (box) box.scrollTop = box.scrollHeight;
        }
        async function sendSupportReply(){
            const inp = document.getElementById('supReplyInput');
            const msg = (inp.value||'').trim();
            if (!msg || !supportThreadId) return;
            inp.value = '';
            try {
                await fetch('/api/support.php?action=reply', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify({ thread_id: supportThreadId, message: msg }) });
                await openSupportThread(supportThreadId);
            } catch(e){ alert('Не удалось отправить ответ'); inp.value = msg; }
        }

                        <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
                          <input id="devToken" placeholder="секретный токен (мин. 16 символов)" style="flex:1;min-width:240px;padding:0.55rem 0.75rem;border:1.5px solid #E5E7EB;border-radius:0.6rem;font-family:monospace;">
                          <button class="btn-sm btn-outline" onclick="document.getElementById('devToken').value=[...crypto.getRandomValues(new Uint8Array(24))].map(b=>b.toString(16).padStart(2,'0')).join('')">🎲 Сгенерировать</button>
                          <button class="btn-sm btn-purple" onclick="devSaveToken(this)">Сохранить токен</button>
                        </div>
                        <span id="devTokMsg" style="font-size:0.85rem;"></span>
                    </div></div>`) +
                '<h3 style="margin:0.5rem 0;font-size:1rem;">Задачи</h3>' + rows;
        }
        async function devAdd(btn){
            const title = document.getElementById('devTitle').value.trim();
            const body = document.getElementById('devBody').value.trim();
            const msg = document.getElementById('devMsg');
            if (!body){ msg.textContent='Введите текст'; msg.style.color='#DC2626'; return; }
            btn.disabled = true;
            const r = await apiPostTo(DEV_API, 'add', { title, body });
            btn.disabled = false;
            if (r.ok) renderDevTasks(); else { msg.textContent = r.error||'Ошибка'; msg.style.color='#DC2626'; }
        }
        async function devRunNow(btn){
            const m = document.getElementById('devRunMsg');
            btn.disabled = true; m.textContent = ' ставлю запрос...'; m.style.color = '#6B7280';
            const r = await apiPostTo(DEV_API, 'request-run', {});
            btn.disabled = false;
            if (r.ok) { m.textContent = ' ✅ Запрос поставлен. Клод обработает при ближайшем прогоне (по расписанию — раз в 3 дня в 04:00 МСК; вручную — из Claude Code).'; m.style.color = '#16A34A'; }
            else { m.textContent = ' ⚠️ ' + (r.error || 'ошибка'); m.style.color = '#DC2626'; }
        }
        async function devSet(id, status){ const r = await apiPostTo(DEV_API,'set-status',{id,status}); if(r.ok) renderDevTasks(); else alert(r.error||'Ошибка'); }
        async function devRework(id){ const c = prompt('Что доработать? (комментарий Клоду)'); if(c===null) return; const r = await apiPostTo(DEV_API,'set-status',{id,status:'rework',admin_comment:c}); if(r.ok) renderDevTasks(); else alert(r.error||'Ошибка'); }
        async function devSaveToken(btn){ const t=document.getElementById('devToken').value.trim(); const m=document.getElementById('devTokMsg'); if(t.length<16){m.textContent=' минимум 16 символов';m.style.color='#DC2626';return;} btn.disabled=true; const r=await apiPostTo(DEV_API,'save-token',{token:t}); btn.disabled=false; if(r.ok){ m.textContent=' ✅ сохранён'; m.style.color='#16A34A'; alert('Токен сохранён. Передайте его Клоду в чате для настройки расписания:\n\n'+t);} else { m.textContent=' '+(r.error||'ошибка'); m.style.color='#DC2626'; } }
        async function apiPostTo(url, action, body){
            try { const r = await fetch(url+'?action='+action, { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify(body) }); return await r.json(); }
            catch(e){ return { error:'сеть' }; }
        }

        // ── Робокасса: настройка ключей (пишет robokassa_config.php на сервере) ────
        async function renderRobokassa(){
            let diag = {};
            try { diag = await (await fetch('/api/robokassa.php?action=diag', { credentials:'include' })).json(); } catch(e){}
            const yn = (v) => v ? '<span class="badge b-green">задан</span>' : '<span class="badge b-red">пусто</span>';
            const status = `
                <div class="stats-grid" style="margin-bottom:1rem;">
                    <div class="stat"><div class="v" style="font-size:1rem;">${diag.config_is_array ? '✅' : '⚠️'}</div><div class="l">Файл конфигурации ${diag.config_file_present ? 'есть' : 'отсутствует'}${diag.config_is_array ? '' : ' (некорректен)'}</div></div>
                    <div class="stat"><div class="v" style="font-size:1rem;">${diag.is_test ? 'ТЕСТ' : 'БОЕВОЙ'}</div><div class="l">Режим (IsTest=${diag.is_test})</div></div>
                    <div class="stat"><div class="v" style="font-size:1rem;">${diag.active_configured ? '✅ готово' : '— не готово'}</div><div class="l">Приём платежей</div></div>
                </div>
                <table style="font-size:0.85rem;margin-bottom:1rem;"><tbody>
                    <tr><td>MerchantLogin</td><td><b>${esc(diag.merchant_login||'—')}</b></td></tr>
                    <tr><td>TEST Password#1 / #2</td><td>${yn(diag.test_password1_set)} ${yn(diag.test_password2_set)}</td></tr>
                    <tr><td>PROD Password#1 / #2</td><td>${yn(diag.prod_password1_set)} ${yn(diag.prod_password2_set)}</td></tr>
                </tbody></table>`;
            const fld = (id,label,type,ph) => `<label style="display:block;margin-bottom:0.7rem;"><span style="display:block;font-size:0.82rem;color:#6B7280;margin-bottom:0.25rem;font-weight:600;">${label}</span><input id="${id}" type="${type}" placeholder="${ph||''}" autocomplete="off" style="width:100%;max-width:420px;padding:0.55rem 0.7rem;border:1.5px solid #E5E7EB;border-radius:0.6rem;font-family:inherit;font-size:0.9rem;"></label>`;
            document.getElementById('content').innerHTML =
                '<div class="note">🔐 Ключи Робокассы хранятся в файле <b>api/robokassa_config.php</b> на сервере (не в git). Здесь можно записать их безопасно — поля с паролями не показывают текущее значение; пустое поле = «не менять». После сохранения проверьте статус «Приём платежей: готово».</div>' +
                '<div class="panel"><div class="panel-head"><h2>Ключи и режим Робокассы</h2><button class="btn-sm btn-outline" onclick="renderRobokassa()">↻ Обновить статус</button></div>' +
                '<div style="padding:1.25rem;">' + status +
                    fld('rkMerchant','MerchantLogin (идентификатор магазина)','text','psytalk.pro') +
                    `<label style="display:block;margin-bottom:0.7rem;"><span style="display:block;font-size:0.82rem;color:#6B7280;margin-bottom:0.25rem;font-weight:600;">Режим</span>
                     <select id="rkIsTest" style="padding:0.55rem 0.7rem;border:1.5px solid #E5E7EB;border-radius:0.6rem;font-family:inherit;"><option value="1"${diag.is_test?' selected':''}>ТЕСТ (IsTest=1)</option><option value="0"${!diag.is_test?' selected':''}>БОЕВОЙ (IsTest=0)</option></select></label>` +
                    '<div style="font-weight:700;margin:0.6rem 0 0.4rem;">Тестовые пароли</div>' +
                    fld('rkTest1','TEST Password #1','password','оставьте пустым — не менять') +
                    fld('rkTest2','TEST Password #2','password','оставьте пустым — не менять') +
                    '<div style="font-weight:700;margin:0.6rem 0 0.4rem;">Боевые пароли</div>' +
                    fld('rkProd1','PROD Password #1','password','оставьте пустым — не менять') +
                    fld('rkProd2','PROD Password #2','password','оставьте пустым — не менять') +
                    `<label style="display:flex;align-items:center;gap:0.5rem;margin:0.5rem 0 1rem;cursor:pointer;"><input type="checkbox" id="rkReceipt" ${diag.receipt_enabled?'checked':''} style="width:18px;height:18px;accent-color:#7C3AED;"> Фискализация чеков (Receipt, УСН доход)</label>` +
                    '<button class="btn-sm btn-purple" style="padding:0.7rem 1.6rem;" onclick="saveRobokassa(this)">💾 Сохранить ключи</button> <span id="rkMsg" style="font-size:0.88rem;margin-left:0.5rem;"></span>' +
                '</div></div>';
        }
        async function saveRobokassa(btn){
            const payload = {
                merchant_login: document.getElementById('rkMerchant').value.trim(),
                is_test: document.getElementById('rkIsTest').value,
                test_password1: document.getElementById('rkTest1').value,
                test_password2: document.getElementById('rkTest2').value,
                prod_password1: document.getElementById('rkProd1').value,
                prod_password2: document.getElementById('rkProd2').value,
                receipt_enabled: document.getElementById('rkReceipt').checked
            };
            const msg = document.getElementById('rkMsg');
            btn.disabled = true; msg.textContent = 'Сохраняем...'; msg.style.color = '#6B7280';
            try {
                const r = await fetch('/api/robokassa.php?action=save-config', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify(payload) });
                const d = await r.json();
                btn.disabled = false;
                if (d.ok) { msg.textContent = '✅ Сохранено. Обновляю статус...'; msg.style.color = '#16A34A'; setTimeout(renderRobokassa, 800); }
                else { msg.textContent = '⚠️ ' + (d.error || 'Не удалось сохранить'); msg.style.color = '#DC2626'; }
            } catch(e){ btn.disabled = false; msg.textContent = '⚠️ Ошибка сети'; msg.style.color = '#DC2626'; }
        }

        // ── Супервизия (группы + индивидуальные запросы) ──────────────────────────
        async function renderSupervision(){
            let res;
            try { res = await (await fetch('/api/supervision.php?action=admin-overview', { credentials:'include' })).json(); }
            catch(e){ return fail(); }
            if (!res || !res.ok) return fail();
            const sessions = res.sessions || [];
            const requests = res.requests || [];
            const durLbl = d => d==120?'2 ч':'1,5 ч';
            const sTable = sessions.length ? `<table id="dataTable"><thead><tr><th>Тема</th><th>Супервизор</th><th>Когда</th><th>Длит.</th><th>Цена</th><th>Участники</th></tr></thead><tbody>` +
                sessions.map(s=>`<tr><td><b>${esc(s.title)}</b></td><td>${esc(s.supervisor_name)}</td><td class="muted">${fmtDateTime(s.datetime)}</td><td>${durLbl(s.duration_min)}</td><td>${fmtMoney(s.price)} ₽</td><td>${esc(s.taken)} / ${esc(s.capacity)}</td></tr>`).join('') + '</tbody></table>'
                : '<div class="empty">Групповых супервизий пока нет</div>';
            const stMap = { new:['b-amber','новый'], priced:['b-purple','названа цена'], accepted:['b-green','принят'], declined:['b-gray','отклонён'] };
            const rTable = requests.length ? `<table id="dataTable2"><thead><tr><th>Психолог</th><th>Супервизор</th><th>Тема</th><th>Цена</th><th>Статус</th></tr></thead><tbody>` +
                requests.map(r=>{ const st=stMap[r.status]||['b-gray',r.status]; return `<tr><td>${esc(r.requester_name)}</td><td>${esc(r.supervisor_name||'—')}</td><td style="max-width:260px;white-space:normal;">${esc(r.topic||'')}</td><td>${r.price?fmtMoney(r.price)+' ₽':'—'}</td><td><span class="badge ${st[0]}">${st[1]}</span></td></tr>`; }).join('') + '</tbody></table>'
                : '<div class="empty">Индивидуальных запросов пока нет</div>';
            document.getElementById('content').innerHTML =
                '<div class="note">🎓 Групповая супервизия (опытный психолог ведёт группу младших, до 1500 ₽ за участника) и индивидуальная по запросу. Платформа удерживает комиссию, остальное — супервизору.</div>' +
                `<div class="panel" style="margin-bottom:1.25rem;"><div class="panel-head"><h2>Групповые супервизии (${sessions.length})</h2></div><div class="tbl-wrap">${sTable}</div></div>` +
                `<div class="panel"><div class="panel-head"><h2>Индивидуальные запросы (${requests.length})</h2></div><div class="tbl-wrap">${rTable}</div></div>`;
        }

        // ── Заявки на замену психолога ───────────────────────────────────────────
        async function renderReplacements(){
            const res = await apiGet('replacements');
            if (!res.ok) return fail();
            const rows = res.data || [];
            if (!rows.length) return empty('Заявок на замену психолога пока нет');
            rows.sort((a,b)=> (a.status==='new'?0:1) - (b.status==='new'?0:1));
            const stMap = { new:['b-amber','новая'], in_progress:['b-purple','в работе'], done:['b-green','закрыта'] };
            const body = `<table id="dataTable"><thead><tr>
                <th>Дата</th><th>Клиент</th><th>Текущий психолог</th><th>Причина</th><th>Статус</th><th>Действия</th></tr></thead><tbody>` +
                rows.map(r => {
                    const s = stMap[r.status] || ['b-gray', r.status||'—'];
                    const acts = r.status!=='done'
                        ? `${r.status==='new'?`<button class="btn-sm btn-purple" onclick="setReplStatus('${esc(r.id)}','in_progress')">Взять в работу</button> `:''}<button class="btn-sm btn-outline" onclick="setReplStatus('${esc(r.id)}','done')">Закрыть</button>`
                        : `<button class="btn-sm btn-outline" onclick="setReplStatus('${esc(r.id)}','new')">Вернуть</button>`;
                    const client = esc(r.client_name||'—') + (r.client_email?`<br><span class="muted" style="font-size:0.78rem;">${esc(r.client_email)}</span>`:'');
                    return `<tr><td class="muted">${fmtDateTime(r.created_at)}</td><td>${client}</td><td>${esc(r.psychologist_name||'—')}</td><td style="max-width:280px;white-space:normal;">${esc(r.reason||'—')}</td><td><span class="badge ${s[0]}">${esc(s[1])}</span></td><td style="white-space:nowrap;">${acts}</td></tr>`;
                }).join('') + '</tbody></table>';
            document.getElementById('content').innerHTML =
                '<div class="note">🔄 Клиенты оставляют заявку «Заменить психолога» в личном кабинете. Возьмите в работу, помогите подобрать другого специалиста и закройте заявку.</div>' +
                panel('Заявки на замену ('+rows.length+')','sRepl',body);
        }
        async function setReplStatus(id, status){
            const res = await apiPost('set-replacement-status', { id, status });
            if (res.error) return alert(res.error);
            renderReplacements();
        }

        function fail(){ document.getElementById('content').innerHTML = '<div class="panel"><div class="empty">Не удалось загрузить данные. Проверьте, что вы вошли как администратор.</div></div>'; }
        function empty(msg){ document.getElementById('content').innerHTML = '<div class="panel"><div class="empty">'+esc(msg)+'</div></div>'; }

        try { if (window.lucide) lucide.createIcons(); } catch(e){}
        init();
    </script>
</body>
</html>
