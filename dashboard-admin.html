<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка — psytalk.pro</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/layout.js"></script>
    <!-- Одно меню в кабинете. Разделы сайта живут в боковом меню («Сайт»), поэтому
         бургер шапки здесь лишний: на телефоне рядом оказывались два меню, и человек
         не понимал, в какое жать. Правило дублирует логику layout.js намеренно —
         HTML не кэшируется, а js мог остаться в кэше телефона прежней версии. -->
    <style id="psyOneMenu">
      #burgerMenu{display:none!important}
      @media (max-width:768px){#navMenu.nav-menu:not(.nav-menu-slim){display:none!important}}
    </style>
    <script src="/js/lightbox.js?v=2"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        /* ── Theme variables ─────────────────────────────────────── */
        :root {
            --a-bg: #F4F0FF;
            --a-sidebar: #FFFFFF;
            --a-sidebar-hover: #F3E8FF;
            --a-sidebar-active-bg: #EDE9FF;
            --a-sidebar-active-text: #7C3AED;
            --a-sidebar-border: #EDE9FF;
            --a-sidebar-group: #9CA3AF;
            --a-panel: #FFFFFF;
            --a-panel-border: #EDE9FF;
            --a-panel-head-border: #F0ECF8;
            --a-text: #1A1A1A;
            --a-text-sec: #6B7280;
            --a-text-muted: #9CA3AF;
            --a-input-bg: #FFFFFF;
            --a-input-border: #E5E7EB;
            --a-th-bg: #FAFAFA;
            --a-td-border: #F5F5F5;
            --a-tr-hover: #FBFAFF;
            --a-note-bg: #FFF8E7;
            --a-note-border: #FCD34D;
            --a-note-color: #92400E;
            --a-stat-shadow: rgba(124,58,237,0.06);
            --a-drop-bg: #FAF8FF;
            --a-drop-border: #C4B5FD;
        }
        body.dark {
            --a-bg: #191919;
            --a-sidebar: #202020;
            --a-sidebar-hover: #2D2D2D;
            --a-sidebar-active-bg: #37254A;
            --a-sidebar-active-text: #B794F4;
            --a-sidebar-border: #333;
            --a-sidebar-group: #9A9A9A;
            --a-panel: #252525;
            --a-panel-border: #333;
            --a-panel-head-border: #333;
            --a-text: #E6E6E6;
            --a-text-sec: #A0A0A0;
            --a-text-muted: #9A9A9A;
            --a-input-bg: #2A2A2A;
            --a-input-border: #444;
            --a-th-bg: #2A2A2A;
            --a-td-border: #333;
            --a-tr-hover: #2D2D2D;
            --a-note-bg: #2D2A1E;
            --a-note-border: #5C4B1A;
            --a-note-color: #D4A944;
            --a-stat-shadow: rgba(0,0,0,0.2);
            --a-drop-bg: #2A2235;
            --a-drop-border: #5B3D8F;
        }

        /* ── Reset ───────────────────────────────────────────────── */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--a-bg); min-height: 100vh; color: var(--a-text); padding-top: 84px; transition: background 0.2s, color 0.2s; }

        /* ── Dark header override ────────────────────────────────── */
        body.dark .nav { background: #1E1E1E !important; border-color: #333 !important; }
        body.dark .nav-brand span:first-child { color: #E6E6E6 !important; }
        body.dark .nav a.nav-link { color: #A0A0A0 !important; }
        body.dark .nav a.nav-link:hover { color: #E6E6E6 !important; }

        /* ── Layout ──────────────────────────────────────────────── */
        .admin-layout { display: flex; min-height: calc(100vh - 84px); }

        /* ── Sidebar ─────────────────────────────────────────────── */
        .sidebar { width: 260px; background: var(--a-sidebar); border-right: 1px solid var(--a-sidebar-border); display: flex; flex-direction: column; position: sticky; top: 84px; height: calc(100vh - 84px); flex-shrink: 0; transition: background 0.2s, border-color 0.2s; z-index: 10; }
        .sidebar-header { padding: 0.6rem 1rem 0.55rem; border-bottom: 1px solid var(--a-sidebar-border); }
        .sidebar-sub { font-size: 0.78rem; color: var(--a-text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sidebar-nav { flex: 1; padding: 0.5rem 0; overflow-y: auto; }
        .sidebar-group { padding: 0.6rem 0 0.15rem; }
        .sidebar-group-label { padding: 0.25rem 1rem 0.35rem; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--a-sidebar-group); user-select: none; }
        .sidebar-item { display: flex; align-items: center; gap: 0.55rem; padding: 0.42rem 0.75rem; margin: 0.08rem 0.5rem; border-radius: 0.45rem; font-size: 0.88rem; color: var(--a-text-sec); cursor: pointer; transition: background 0.12s, color 0.12s; font-weight: 500; text-decoration: none; border: none; background: none; width: calc(100% - 1rem); text-align: left; font-family: inherit; line-height: 1.4; }
        .sidebar-item:hover { background: var(--a-sidebar-hover); color: var(--a-text); }
        .sidebar-item.active { background: var(--a-sidebar-active-bg); color: var(--a-sidebar-active-text); font-weight: 600; }
        .sidebar-item-icon { font-size: 1rem; width: 1.35rem; text-align: center; flex-shrink: 0; }
        .sidebar-footer { padding: 0.6rem 0.5rem; border-top: 1px solid var(--a-sidebar-border); display: flex; flex-direction: column; gap: 0.15rem; }
        .sidebar-footer-btn { display: flex; align-items: center; gap: 0.55rem; padding: 0.42rem 0.55rem; border-radius: 0.45rem; font-size: 0.85rem; color: var(--a-text-sec); cursor: pointer; background: none; border: none; width: 100%; font-family: inherit; font-weight: 500; text-align: left; transition: background 0.12s, color 0.12s; }
        .sidebar-footer-btn:hover { background: var(--a-sidebar-hover); color: var(--a-text); }

        /* Mobile sidebar */
        .sidebar-toggle { display: none; position: fixed; top: 92px; left: 0.75rem; z-index: 1001; width: 38px; height: 38px; border-radius: 0.5rem; border: 1px solid var(--a-input-border); background: var(--a-panel); color: var(--a-text); font-size: 1.2rem; cursor: pointer; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 999; }
        .sidebar-overlay.open { display: block; }

        @media (max-width: 768px) {
            /* Шторка накрывает шапку сайта (её z-index 999), поэтому отступ под шапку не нужен:
               раньше сверху пустовало 84px, а нижние пункты (в том числе «Выйти») уезжали
               за пределы видимой части — и долистать до них было нельзя. 100dvh учитывает
               панели браузера, overflow-y возвращает прокрутку. */
            .sidebar { position: fixed; top: 0; left: -290px; bottom: 0; z-index: 1000; width: 280px; transition: left 0.25s ease; padding-top: 0.5rem; height: 100vh; height: 100dvh; max-height: 100dvh; overflow-y: auto; overscroll-behavior: contain; }
            .sidebar.open { left: 0; }
            /* Бургер встроен в шапку сайта (справа), а не плавает поверх контента */
            .sidebar-toggle { display: flex; top: 17px; left: auto; right: 12px; width: 34px; height: 34px; font-size: 1.05rem; }
            .nav .burger-menu, .nav .nav-menu { display: none !important; }
            .admin-layout { display: block; }
            .main-content { padding: 0.75rem !important; }
            .panel-head { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
            /* Поле поиска в шапке разделов — компактнее на мобильных */
            .panel-head .search { width: 100%; min-width: 0; padding: 0.4rem 0.6rem; font-size: 0.8rem; }
        }

        /* ── Main content ────────────────────────────────────────── */
        .main-content { flex: 1; min-width: 0; padding: 1.5rem; }
        .container { max-width: 1100px; margin: 0 auto; }

        /* ── Stats ───────────────────────────────────────────────── */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(170px, 100%), 1fr)); gap: 1rem; margin-bottom: 1.5rem; background: none; }
        .stat { background: var(--a-panel); border-radius: 1rem; padding: 1.25rem; border: 1px solid var(--a-panel-border); box-shadow: 0 2px 10px var(--a-stat-shadow); transition: background 0.2s, border-color 0.2s; }
        .stat .v { font-size: 1.75rem; font-weight: 800; color: #7C3AED; letter-spacing: -0.02em; }
        body.dark .stat .v { color: #B794F4; }
        .stat .l { font-size: 0.8rem; color: var(--a-text-sec); margin-top: 0.2rem; }

        /* ── Panels ──────────────────────────────────────────────── */
        .panel { background: var(--a-panel); border-radius: 1.1rem; border: 1px solid var(--a-panel-border); box-shadow: 0 2px 12px rgba(0,0,0,0.05); overflow: hidden; transition: background 0.2s, border-color 0.2s; }
        .panel-head { padding: 1rem 1.25rem; border-bottom: 1px solid var(--a-panel-head-border); display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
        .panel-head h2 { font-size: 1.05rem; }
        .panel-head .search { padding: 0.5rem 0.85rem; border: 1.5px solid var(--a-input-border); border-radius: 0.6rem; font-size: 0.85rem; font-family: inherit; outline: none; min-width: 200px; background: var(--a-input-bg); color: var(--a-text); }
        .panel-head .search:focus { border-color: #7C3AED; }

        /* ── Tables ──────────────────────────────────────────────── */
        .tbl-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { text-align: left; padding: 0.7rem 1rem; background: var(--a-th-bg); color: var(--a-text-sec); font-weight: 600; white-space: nowrap; border-bottom: 1px solid var(--a-td-border); position: sticky; top: 0; }
        td { padding: 0.7rem 1rem; border-bottom: 1px solid var(--a-td-border); vertical-align: middle; }
        tr:hover td { background: var(--a-tr-hover); }

        /* ── Badges ──────────────────────────────────────────────── */
        .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 2rem; font-size: 0.72rem; font-weight: 700; }
        .b-green { background: #F0FDF4; color: #16A34A; border: 1px solid #BBF7D0; }
        .b-purple { background: #F3E8FF; color: #7C3AED; border: 1px solid #E9D5FF; }
        .b-red { background: #FFF1F2; color: #BE123C; border: 1px solid #FECDD3; }
        .b-amber { background: #FFF8E7; color: #92400E; border: 1px solid #FCD34D; }
        .b-gray { background: #F3F4F6; color: #6B7280; border: 1px solid #E5E7EB; }
        .b-blue { background: #EFF6FF; color: #2563EB; border: 1px solid #BFDBFE; }
        body.dark .b-green { background: #1A2E1A; color: #4ADE80; border-color: #2D5A2D; }
        body.dark .b-purple { background: #2D1F4E; color: #B794F4; border-color: #4A3670; }
        body.dark .b-red { background: #2E1A1A; color: #F87171; border-color: #5C2020; }
        body.dark .b-amber { background: #2E2A1A; color: #FBBF24; border-color: #5C4B1A; }
        body.dark .b-gray { background: #2A2A2A; color: #A0A0A0; border-color: #444; }
        body.dark .b-blue { background: #1A2438; color: #93C5FD; border-color: #2A3F63; }
        .dev-tab { padding: 0.4rem 0.85rem; border-radius: 2rem; font-size: 0.82rem; font-weight: 600; border: 1.5px solid var(--a-input-border); background: var(--a-input-bg); color: var(--a-text-sec); cursor: pointer; white-space: nowrap; }
        .dev-tab.active { background: #7C3AED; color: #fff; border-color: #7C3AED; }
        .dev-bulkbar { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; background: var(--a-sidebar-active-bg); border-radius: 0.6rem; padding: 0.6rem 0.8rem; margin-bottom: 0.75rem; }

        /* ── Buttons ─────────────────────────────────────────────── */
        .btn-sm { padding: 0.35rem 0.7rem; border-radius: 0.5rem; border: none; font-size: 0.78rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s; }
        .btn-purple { background: linear-gradient(135deg,#7C3AED,#9F67FA); color: #fff; }
        .btn-outline { background: var(--a-panel); border: 1.5px solid var(--a-input-border); color: var(--a-text-sec); }
        .btn-outline:hover { border-color: #7C3AED; color: #7C3AED; }
        body.dark .btn-outline:hover { color: #B794F4; border-color: #B794F4; }
        .btn-red { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; }
        body.dark .btn-red { background: #2E1A1A; color: #F87171; border-color: #5C2020; }

        /* ── Misc ────────────────────────────────────────────────── */
        .muted { color: var(--a-text-muted); }
        .loading, .empty { text-align: center; padding: 2.5rem; color: var(--a-text-muted); }
        .note { background: var(--a-note-bg); border: 1px solid var(--a-note-border); color: var(--a-note-color); border-radius: 0.7rem; padding: 0.75rem 1rem; font-size: 0.83rem; margin-bottom: 1rem; line-height: 1.5; transition: background 0.2s, border-color 0.2s, color 0.2s; }

        /* Timeline */
        .timeline { padding: 0.5rem 0; }
        .tl-item { display: flex; gap: 0.85rem; padding: 0.65rem 1.25rem; border-bottom: 1px solid var(--a-td-border); align-items: flex-start; }
        .tl-ico { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 0.9rem; }
        .tl-body { flex: 1; min-width: 0; }
        .tl-sum { font-size: 0.87rem; color: var(--a-text); }
        .tl-ts { font-size: 0.74rem; color: var(--a-text-muted); margin-top: 0.1rem; }

        /* ── Notes section ───────────────────────────────────────── */
        .note-card { display: flex; gap: 0.75rem; padding: 0.85rem 1rem; background: var(--a-panel); border: 1px solid var(--a-panel-border); border-radius: 0.7rem; margin-bottom: 0.5rem; align-items: flex-start; transition: all 0.15s; }
        .note-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .note-card.is-done { opacity: 0.5; }
        .note-card.is-done .note-card-title { text-decoration: line-through; }
        .note-card-check { flex-shrink: 0; padding-top: 0.15rem; }
        .note-card-check input[type="checkbox"] { width: 18px; height: 18px; accent-color: #7C3AED; cursor: pointer; }
        .note-card-content { flex: 1; min-width: 0; }
        .note-card-title { font-weight: 600; font-size: 0.93rem; margin-bottom: 0.15rem; word-break: break-word; }
        .note-card-text { font-size: 0.84rem; color: var(--a-text-sec); white-space: pre-wrap; word-break: break-word; }
        .note-card-meta { font-size: 0.73rem; color: var(--a-text-muted); margin-top: 0.25rem; }
        .note-card-delete { flex-shrink: 0; width: 26px; height: 26px; border-radius: 0.35rem; border: none; background: transparent; color: var(--a-text-muted); font-size: 1.15rem; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.15s; }
        .note-card:hover .note-card-delete { opacity: 1; }
        .note-card-delete:hover { background: #FEF2F2; color: #DC2626; }
        body.dark .note-card-delete:hover { background: #3A2020; color: #F87171; }
        .note-card.is-overdue { border-color: #FCA5A5; background: #FEF2F2; }
        body.dark .note-card.is-overdue { border-color: #7F1D1D; background: #2E1A1A; }
        .note-card-due { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 0.1rem 0.5rem; border-radius: 1rem; margin-top: 0.3rem; }
        .note-card-due.due-ok { background: var(--a-sidebar-active-bg); color: var(--a-text-sec); }
        .note-card-due.due-over { background: #FEE2E2; color: #B91C1C; }
        body.dark .note-card-due.due-over { background: #3A1F1F; color: #F87171; }
        .note-card-edit-btn { flex-shrink: 0; width: 26px; height: 26px; border-radius: 0.35rem; border: none; background: transparent; color: var(--a-text-muted); font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.15s; }
        .note-card:hover .note-card-edit-btn { opacity: 1; }
        .note-card-edit-btn:hover { background: var(--a-sidebar-active-bg); color: #7C3AED; }

        /* ── Archive details/summary ────────────────────────────── */
        details { border: 1px solid var(--a-panel-border); border-radius: 0.7rem; overflow: hidden; background: var(--a-panel); transition: background 0.2s, border-color 0.2s; }
        details summary { padding: 0.7rem 1rem; cursor: pointer; font-size: 0.88rem; color: var(--a-text-sec); font-weight: 500; user-select: none; list-style: none; display: flex; align-items: center; gap: 0.4rem; }
        details summary::before { content: '▸'; font-size: 0.8rem; transition: transform 0.15s; }
        details[open] summary::before { transform: rotate(90deg); }
        details summary::-webkit-details-marker { display: none; }
        details > div { padding: 0 0.75rem 0.75rem; }

        /* ── Dark mode deep overrides ────────────────────────────── */
        body.dark input, body.dark textarea, body.dark select { background: var(--a-input-bg) !important; border-color: var(--a-input-border) !important; color: var(--a-text) !important; }
        body.dark input::placeholder, body.dark textarea::placeholder { color: var(--a-text-muted) !important; }
        body.dark .panel-head .search { background: var(--a-input-bg); color: var(--a-text); }
        body.dark #devModal > div { background: var(--a-panel) !important; color: var(--a-text) !important; }
        body.dark #devModal p, body.dark #devModal h2 { color: var(--a-text) !important; }
        body.dark [id*="Drop"] { background: var(--a-drop-bg) !important; border-color: var(--a-drop-border) !important; }
        body.dark [id*="Drop"] div { color: var(--a-text-sec) !important; }
        body.dark details summary { color: var(--a-text-muted); }

        @media (max-width: 820px) { #tariffGrid { grid-template-columns: 1fr !important; } }

        /* ── Psychologist detail modal ─── */
        #psychModal { display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.45); align-items:center; justify-content:center; }
        #psychModal.active { display:flex; }
        #psychModal .pm-card { background:var(--a-panel); border-radius:1.25rem; max-width:680px; width:95%; max-height:90vh; overflow-y:auto; padding:2rem; position:relative; box-shadow:0 16px 48px rgba(0,0,0,0.18); }
        #psychModal .pm-close { position:absolute; top:1rem; right:1rem; background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--a-text-sec); line-height:1; z-index:1; }
        #psychModal .pm-avatar { width:96px; height:96px; border-radius:50%; object-fit:cover; border:3px solid #F3E8FF; display:block; margin:0 auto 1rem; }
        #psychModal .pm-initials { width:96px; height:96px; border-radius:50%; background:linear-gradient(135deg,#7C3AED,#9F67FA); display:flex; align-items:center; justify-content:center; color:#fff; font-size:2rem; font-weight:700; margin:0 auto 1rem; }
        #psychModal .pm-name { text-align:center; font-size:1.25rem; font-weight:700; color:var(--a-text); margin-bottom:0.25rem; }
        #psychModal .pm-spec { text-align:center; font-size:0.875rem; color:#7C3AED; margin-bottom:1rem; }
        #psychModal .pm-section { font-size:0.8rem; font-weight:700; color:var(--a-text-sec); text-transform:uppercase; letter-spacing:0.04em; margin:1.25rem 0 0.5rem; padding-bottom:0.25rem; border-bottom:1px solid var(--a-td-border); }
        #psychModal .pm-row { display:flex; gap:0.5rem; margin-bottom:0.6rem; font-size:0.875rem; line-height:1.6; color:var(--a-text); align-items:flex-start; }
        #psychModal .pm-label { font-weight:600; min-width:120px; flex-shrink:0; color:var(--a-text-sec); padding-top:0.35rem; }
        #psychModal .pm-val { word-break:break-word; flex:1; }
        #psychModal .pm-input { width:100%; padding:0.4rem 0.6rem; border:1px solid var(--a-input-border); border-radius:0.5rem; background:var(--a-input-bg); color:var(--a-text); font-size:0.875rem; font-family:inherit; }
        #psychModal .pm-input:focus { outline:none; border-color:#7C3AED; box-shadow:0 0 0 2px rgba(124,58,237,0.15); }
        #psychModal textarea.pm-input { min-height:3.5rem; resize:vertical; }
        #psychModal .pm-actions { display:flex; gap:0.75rem; justify-content:center; margin-top:1.25rem; flex-wrap:wrap; }
        #psychModal .pm-creds { display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:0.25rem; }
        #psychModal .pm-cred-thumb { width:80px; height:80px; border-radius:0.5rem; object-fit:cover; border:1px solid var(--a-input-border); cursor:pointer; transition:transform 0.15s; }
        #psychModal .pm-cred-thumb:hover { transform:scale(1.08); }
        #psychModal .pm-cred-empty { font-size:0.8rem; color:var(--a-text-muted); font-style:italic; }
        #psychModal .pm-cred-placeholder { display:inline-flex; width:80px; height:80px; border-radius:0.5rem; background:var(--a-th-bg); align-items:center; justify-content:center; font-size:0.7rem; text-align:center; padding:0.25rem; border:1px solid var(--a-input-border); color:var(--a-text-sec); }
        #psychModal .pm-save-ok { color:#22C55E; font-size:0.8rem; margin-left:0.5rem; display:none; }
    .pay-model-row { display:flex; gap:0.6rem; align-items:flex-start; padding:0.6rem 0.7rem; margin-bottom:0.3rem;

    <script>
        const API = '/api/admin_ext.php';
        let cache = {};

        function fmtMoney(n){ return (Number(n)||0).toLocaleString('ru-RU'); }
        function fmtDateTime(s){ if(!s) return '—'; const d=new Date(String(s).replace(' ','T')); if(isNaN(d)) return s; return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}); }
        function fmtDur(sec){ sec=Number(sec)||0; if(!sec) return '—'; const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }
        function esc(s){ const d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }

        async function apiGet(action){
            const r = await fetch(`${API}?action=${action}`, { credentials:'include' });
            return r.json();
        }
        async function apiPost(action, body){
            const r = await fetch(`${API}?action=${action}`, { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify(body) });
            return r.json();
        }

        async function psyLogout(){
            try { sessionStorage.removeItem('psy_user'); } catch(e) {}
            try {
                if (window.Auth && window.Auth.logout) { await window.Auth.logout(); return; }
                await fetch('/api/auth.php?action=logout', { method: 'POST', credentials: 'include' });
            } catch (e) {}
            window.location.href = '/';
        }
        window.psyLogout = psyLogout;

        // ── Theme (light / dark / system) ──────────────────────────────────
        const THEME_CYCLE = ['light', 'dark', 'system'];
        const THEME_LABELS = { light: 'Тёмная тема', dark: 'Системная тема', system: 'Светлая тема' };
        const THEME_ICONS  = { light: '🌙', dark: '💻', system: '☀️' };
        function getAdminTheme(){ return localStorage.getItem('admin-theme') || localStorage.getItem('psy-theme') || 'light'; }
        function applyAdminTheme(t){
            const prefersDark = window.matchMedia('(prefers-color-scheme:dark)').matches;
            const dark = t === 'dark' || (t === 'system' && prefersDark);
            document.body.classList.toggle('dark', dark);
            // Синхронизируем с общим ключом темы сайта, чтобы чаты и другие страницы
            // подхватывали тот же светлый/тёмный режим, что выбран в админке.
            try { localStorage.setItem('psy-theme', dark ? 'dark' : 'light'); } catch (e) {}
        }
        function toggleTheme(){
            const cur = getAdminTheme();
            const next = THEME_CYCLE[(THEME_CYCLE.indexOf(cur) + 1) % THEME_CYCLE.length];
            localStorage.setItem('admin-theme', next);
            applyAdminTheme(next);
            updateThemeUI();
        }
        function updateThemeUI(){
            const t = getAdminTheme();
            const icon = document.getElementById('themeIcon');
            const label = document.getElementById('themeLabel');
            if (icon) icon.textContent = THEME_ICONS[t] || '🌙';
            if (label) label.textContent = THEME_LABELS[t] || 'Тёмная тема';
        }
        try { window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', () => { if (getAdminTheme() === 'system') applyAdminTheme('system'); }); } catch(e){}
        updateThemeUI();

        // ── Mobile sidebar ──────────────────────────────────────────────────
        function toggleSidebar(){
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
        }

        // ── Init & navigation ───────────────────────────────────────────────
        let myAdminSections = null; // null = полный доступ; иначе — массив разрешённых разделов
        let myUserId = null;
        async function init(){
            let user = null;
            if (window.Auth && window.Auth.getCurrentUser) { try { user = await window.Auth.getCurrentUser(); } catch(e){} }
            if (!user) { window.location.href = '/login.html?redirect=' + encodeURIComponent('/dashboard-admin.html'); return; }
            if (user.role !== 'admin') {
                document.getElementById('content').innerHTML = '<div class="panel"><div class="empty">⛔ Доступ только для администратора.<br>Вы вошли как «'+esc(user.role)+'».</div></div>';
                document.getElementById('sidebar').style.display = 'none';
                return;
            }
            document.getElementById('adminWho').textContent = ((user.first_name||'')+' '+(user.last_name||'')).trim() || 'Администратор';
            myUserId = user.id;
            try {
                const p = await (await fetch('/api/admin_permissions.php?action=my', { credentials:'include' })).json();
                myAdminSections = (p && p.ok) ? p.sections : null;
            } catch(e){ myAdminSections = null; }
            if (myAdminSections) {
                document.querySelectorAll('.sidebar-item[data-tab]').forEach(t => {
                    if (!myAdminSections.includes(t.dataset.tab)) t.style.display = 'none';
                });
            }
            supStartPolling();
            noteReminderStartPolling();
            // Вкладка из адреса (?tab=…) — чтобы обновление страницы (F5) возвращало
            // в тот же раздел, а не выкидывало в «Обзор», как было раньше.
            const fallbackTab = (myAdminSections && !myAdminSections.includes('overview')) ? myAdminSections[0] : 'overview';
            let startTab = fallbackTab;
            let restoreState = false;
            try {
                const sp = new URLSearchParams(location.search);
                const fromUrl = sp.get('tab');
                if (fromUrl && document.querySelector(`.sidebar-item[data-tab="${CSS.escape(fromUrl)}"]`)
                    && (!myAdminSections || myAdminSections.includes(fromUrl))) startTab = fromUrl;
                // Восстанавливаем и вложенное состояние раздела (открытый тикет, фильтр, поиск) — тоже теряется при F5.
                const threadFromUrl = sp.get('thread');
                if (threadFromUrl) supportThreadId = threadFromUrl;
                const filterFromUrl = sp.get('filter');
                if (filterFromUrl) complaintsFilter = filterFromUrl;
                const subFromUrl = sp.get('sub');
                if (subFromUrl) devActiveTab = subFromUrl;
                const qFromUrl = sp.get('q');
                if (qFromUrl) devSearchQuery = qFromUrl;
                restoreState = true;
            } catch(e) {}
            switchTab(startTab, restoreState);
        }

        let currentTab = 'overview';
        function switchTab(tab, preserveState){
            if (myAdminSections && !myAdminSections.includes(tab)) {
                document.getElementById('content').innerHTML = '<div class="panel"><div class="empty">⛔ Этот раздел вам не доступен. Обратитесь к главному администратору.</div></div>';
                return;
            }
            currentTab = tab;
            // Держим раздел (и его вложенное состояние) в адресе — без новой записи в истории,
            // чтобы «Назад» вёл из кабинета, а F5 возвращал туда же, где были.
            try {
                const p = new URLSearchParams(location.search);
                p.set('tab', tab);
                if (!preserveState) { p.delete('thread'); p.delete('filter'); p.delete('sub'); p.delete('q'); }
                history.replaceState(null, '', location.pathname + '?' + p.toString());
            } catch(e) {}
            if (supMsgPollTimer) { clearInterval(supMsgPollTimer); supMsgPollTimer = null; }
            if (!preserveState) { supportThreadId = null; complaintsFilter = 'open'; devActiveTab = 'open'; devSearchQuery = ''; }
            document.querySelectorAll('.sidebar-item').forEach(t => t.classList.toggle('active', t.dataset.tab===tab));
            const el = document.getElementById('content');
            el.innerHTML = '<div class="loading">Загрузка...</div>';
            // Close mobile sidebar
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('open');
            ({ overview:renderOverview, support:renderSupport, users:renderUsers, psychologists:renderPsych, tariffs:renderTariffs, robokassa:renderRobokassa, yookassa:renderYookassa, devtasks:renderDevTasks, appointments:renderAppointments, replacements:renderReplacements, supervision:renderSupervision, calls:renderCalls, payments:renderPayments, subscribers:renderSubscribers, referrals:renderReferrals, activity:renderActivity, notes:renderNotes, notifications:renderNotifications, adminperms:renderAdminPerms, metrics:renderMetrics, sitemap:renderSitemap, content:renderContentMod, complaints:renderComplaints }[tab])();
        }

        // Точечно обновляет вложенное состояние текущего раздела в адресе (открытый тикет,
        // фильтр, поиск), не трогая остальные параметры — чтобы F5 возвращал не только
        // в тот же раздел, но и в то же место внутри него.
        function syncUrlState(patch){
            try {
                const p = new URLSearchParams(location.search);
                Object.keys(patch).forEach(k => {
                    const v = patch[k];
                    if (v === null || v === undefined || v === '') p.delete(k); else p.set(k, v);
                });
                history.replaceState(null, '', location.pathname + '?' + p.toString());
            } catch(e) {}
        }

        // ── Жалобы на пользователей ─────────────────────────────────────────
        // Переписку показываем ТОЛЬКО если её автор сам разрешил и срок доступа не истёк.
        // Каждое открытие пишется в журнал, автор жалобы видит, сколько раз смотрели.
        let complaintsFilter = 'open';

        function setComplaintsFilter(f){
            complaintsFilter = f;
            syncUrlState({ filter: f });
            renderComplaints();
        }

        async function renderComplaints(){
            const el = document.getElementById('content');
            let rows = [], err = '';
            try {
                const d = await (await fetch('/api/complaints.php?action=list&status=' + complaintsFilter, { credentials:'include' })).json();
                if (d && d.ok) rows = d.data || []; else err = (d && d.error) || 'ошибка';
            } catch(e){ err = 'нет связи с сервером'; }
            const tabs = ['open','all'].map(f => `<button class="btn ${complaintsFilter===f?'':'btn-ghost'}" onclick="setComplaintsFilter('${f}')">${f==='open'?'Открытые':'Все'}</button>`).join(' ');
            if (err) { el.innerHTML = `<div class="panel"><div class="empty">⚠️ Не удалось загрузить жалобы: ${esc(err)}</div></div>`; return; }
            const name = (f,l,e) => ((f||'')+' '+(l||'')).trim() || e || '—';
            const body = rows.length ? rows.map(c => `
                <div class="panel" style="margin-bottom:0.75rem;">
                    <div style="display:flex;justify-content:space-between;gap:0.75rem;flex-wrap:wrap;align-items:flex-start;">
                        <div style="min-width:0;">
                            <div style="font-weight:700;">На ${esc(name(c.against_first,c.against_last,c.against_email))}
                                <span style="font-weight:400;color:var(--a-text-sec);font-size:0.85rem;">· ${esc(c.against_role||'')}</span></div>
                            <div style="font-size:0.82rem;color:var(--a-text-sec);">от ${esc(name(c.author_first,c.author_last,c.author_email))} · ${esc(c.created_at||'')}</div>
                        </div>
                        <div style="text-align:right;font-size:0.8rem;">
                            <div>${c.status==='open'?'🟠 открыта':(c.status==='closed'?'✅ закрыта':'⛔ отклонена')}</div>
                            <div style="color:var(--a-text-sec);">${c.access_alive ? ('доступ до ' + esc(c.access_until)) : (c.allow_access ? 'срок доступа истёк' : 'доступ не давали')}</div>
                        </div>
                    </div>
                    <div style="margin-top:0.6rem;white-space:pre-wrap;line-height:1.5;">${esc(c.reason||'')}</div>
                    ${c.admin_comment ? `<div style="margin-top:0.5rem;font-size:0.85rem;color:var(--a-text-sec);">Комментарий: ${esc(c.admin_comment)}</div>` : ''}
                    <div style="display:flex;gap:0.4rem;margin-top:0.75rem;flex-wrap:wrap;">
                        ${c.access_alive ? `<button class="btn" onclick="openComplaintThread(${c.id})">👁 Посмотреть переписку</button>` : ''}
                        <button class="btn btn-ghost" onclick="showComplaintLog(${c.id})">Журнал открытий</button>
                        ${c.status==='open' ? `<button class="btn btn-ghost" onclick="resolveComplaint(${c.id},'closed')">Закрыть</button>
                                               <button class="btn btn-ghost" onclick="resolveComplaint(${c.id},'rejected')">Отклонить</button>` : ''}
                    </div>
                    <div id="cmpl-thread-${c.id}"></div>
                </div>`).join('') : '<div class="panel"><div class="empty">Жалоб нет</div></div>';
            el.innerHTML = `<div class="panel" style="margin-bottom:0.75rem;">
                    <h2 style="margin-bottom:0.35rem;">🚩 Жалобы</h2>
                    <div style="font-size:0.85rem;color:var(--a-text-sec);margin-bottom:0.6rem;">
                        Переписка открывается только с разрешения того, кто подал жалобу, и только пока
                        не истёк срок. Каждое открытие видно автору жалобы.
                    </div>
                    <div style="display:flex;gap:0.4rem;">${tabs}</div>
                </div>${body}`;
        }

        async function openComplaintThread(id){
            const box = document.getElementById('cmpl-thread-' + id);
            if (!box) return;
            if (box.dataset.open === '1') { box.innerHTML = ''; box.dataset.open = ''; return; }
            box.dataset.open = '1';
            box.innerHTML = '<div class="loading">Загрузка переписки…</div>';
            try {
                const d = await (await fetch('/api/complaints.php?action=thread&id=' + id, { credentials:'include' })).json();
                if (!d || d.ok === false) { box.innerHTML = `<div class="empty">${esc((d&&d.error)||'Нет доступа')}</div>`; return; }
                const rows = d.data || [];
                const who = (uid) => uid === d.author.id ? esc(((d.author.first_name||'')+' '+(d.author.last_name||'')).trim()||'автор жалобы')
                                                        : esc(((d.against.first_name||'')+' '+(d.against.last_name||'')).trim()||'собеседник');
                box.innerHTML = `<div style="margin-top:0.75rem;border-top:1px solid var(--a-sidebar-border);padding-top:0.6rem;">
                    <div style="font-size:0.8rem;color:var(--a-text-sec);margin-bottom:0.5rem;">
                        Доступ до ${esc(d.access_until||'')} · открытие записано в журнал</div>
                    ${rows.length ? rows.map(m => `
                        <div style="margin-bottom:0.5rem;">
                            <div style="font-size:0.78rem;color:var(--a-text-sec);">${who(m.sender_id)} · ${esc(m.created_at||'')}</div>
                            <div style="white-space:pre-wrap;line-height:1.45;">${esc(m.content||'')}</div>
                            ${m.attachment_url ? `<div style="font-size:0.8rem;"><a href="${esc(m.attachment_url)}" target="_blank" rel="noopener">вложение: ${esc(m.attachment_name||'файл')}</a></div>` : ''}
                        </div>`).join('') : '<div class="empty">Переписка пуста</div>'}
                </div>`;
            } catch(e){ box.innerHTML = '<div class="empty">Не удалось загрузить переписку</div>'; }
        }

        async function showComplaintLog(id){
            try {
                const d = await (await fetch('/api/complaints.php?action=access-log&id=' + id, { credentials:'include' })).json();
                const rows = (d && d.data) || [];
                alert(rows.length
                    ? 'Переписку открывали:\n' + rows.map(r => `${r.opened_at} — ${((r.first_name||'')+' '+(r.last_name||'')).trim()||r.admin_id}`).join('\n')
                    : 'Переписку ещё никто не открывал.');
            } catch(e){ alert('Не удалось загрузить журнал'); }
        }

        async function resolveComplaint(id, status){
            const comment = prompt(status==='closed' ? 'Что сделали по жалобе? (видно только админам)' : 'Почему отклонили?', '');
            if (comment === null) return;
            try {
                const r = await fetch('/api/complaints.php?action=resolve', {
                    method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
                    body: JSON.stringify({ id, status, admin_comment: comment })
                });
                const d = await r.json().catch(()=>({}));
                if (!r.ok || d.ok === false) throw new Error(d.error||'ошибка');
                renderComplaints();
            } catch(e){ alert('Не удалось сохранить: ' + e.message); }
        }

        // ── Overview ────────────────────────────────────────────────────────
        async function renderOverview(){
            const res = await apiGet('overview');
            if (!res.ok) return fail();
            const d = res.data;
            const cards = [
                ['Пользователей', d.users_total], ['Клиентов', d.clients], ['Психологов', d.psychologists],
                ['На модерации', d.psy_pending], ['Записей всего', d.appointments_total],

        // ── Диагностика сервера (диск/память/БД) ───────────────────────────────
        function fmtBytes(n){
            n = Number(n) || 0;
            if (n >= 1073741824) return (n / 1073741824).toFixed(2) + ' ГБ';
            if (n >= 1048576) return (n / 1048576).toFixed(1) + ' МБ';
            if (n >= 1024) return (n / 1024).toFixed(1) + ' КБ';
            return n + ' Б';
        }
        async function renderServerStats(){
            const el = document.getElementById('serverStats');
            if (!el) return;
            let d;
            try { d = await (await fetch('/api/server_stats.php?action=overview', { credentials:'include' })).json(); }
            catch(e){ return; }
            if (!d || !d.ok) return;
            const disk = d.disk;
            const diskPct = disk ? disk.used_percent : null;
            const diskColor = diskPct == null ? 'var(--a-text-sec)' : diskPct > 90 ? '#DC2626' : diskPct > 75 ? '#D97706' : '#16A34A';
            const load = d.load_avg ? d.load_avg.map(v => v.toFixed(2)).join(' / ') : '—';
            el.innerHTML = `<div class="panel"><div class="panel-head"><h2>🖥️ Диагностика сервера</h2><button class="btn-sm btn-outline" onclick="renderServerStats()">↻ Обновить</button></div>
                <div style="padding:1.1rem;">
                    <div class="stats-grid">
                        <div class="stat"><div class="v" style="color:${diskColor};">${disk ? disk.used_percent + '%' : '—'}</div><div class="l">Диск занят${disk ? ' (' + fmtBytes(disk.used_bytes) + ' из ' + fmtBytes(disk.total_bytes) + ')' : ' — недоступно на этом хостинге'}</div></div>
                        <div class="stat"><div class="v">${fmtBytes((d.uploads||{}).size_bytes)}</div><div class="l">Папка /uploads (${(d.uploads||{}).files||0} файлов)</div></div>
                        <div class="stat"><div class="v">${fmtBytes((d.database||{}).size_bytes)}</div><div class="l">Размер БД (${(d.database||{}).tables||0} таблиц)</div></div>
                        <div class="stat"><div class="v" style="font-size:1rem;">${load}</div><div class="l">Load average (1/5/15 мин)${d.load_avg ? '' : ' — недоступно'}</div></div>
                        <div class="stat"><div class="v" style="font-size:1rem;">${esc((d.php||{}).memory_limit||'—')}</div><div class="l">Лимит памяти PHP (текущий процесс: ${fmtBytes((d.php||{}).memory_usage_bytes)})</div></div>
                    </div>
                    <div class="muted" style="font-size:0.78rem;margin-top:0.6rem;">На шаред-хостинге системная память процессора недоступна из PHP напрямую — показатели диска, БД и load average дают достаточный сигнал, когда пора расширять тариф на reg.ru.</div>
                </div></div>`;
        }

        let smNodes = [], smEdges = [];

        let smDirty = false;

        async function renderSitemap(){
            document.getElementById('content').innerHTML =
                `<div class="note">🗺️ Схематичная карта сайта — узлы (блоки) и связи между ними. Перетаскивайте блоки мышью, «+ Блок» добавляет новый, «🔗 Связать» — режим соединения двух блоков (кликните по первому, потом по второму). Двойной клик по блоку — переименовать. Не забудьте «💾 Сохранить».</div>
                <div class="panel" style="margin-top:0.75rem;">

                        <h2>Карта сайта</h2>

                    <div style="padding:1rem 1.1rem;overflow:auto;">
                        <div id="smCanvas" style="position:relative;width:100%;min-width:900px;height:600px;background:var(--a-panel-alt);border:1.5px dashed var(--a-input-border);border-radius:0.75rem;overflow:hidden;">
                            <svg id="smSvg" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;"></svg>
                        </div>
                    </div>
                </div>`;
            let res;
            try { res = await (await fetch('/api/site_structure.php?action=get', { credentials:'include' })).json(); }
            catch(e){ return fail(); }
            if (!res || !res.ok) return fail();
            smNodes = (res.data && res.data.nodes) || [];
            smEdges = (res.data && res.data.edges) || [];
            smSelectedId = null;
            smDirty = false;
            document.getElementById('smUpdatedNote').textContent = res.is_default
                ? 'Схема ещё не сохранялась — показан пример по умолчанию.'
                : (res.updated_at ? 'Обновлено: ' + new Date(res.updated_at).toLocaleString('ru-RU') : '');
            smRender();
        }

        let smSelectedId = null;
        function smRender(){
            const canvas = document.getElementById('smCanvas');
            if (!canvas) return;
            canvas.querySelectorAll('.sm-node').forEach(n => n.remove());
            smNodes.forEach(n => {
                const el = document.createElement('div');
                el.className = 'sm-node';
                el.dataset.id = n.id;
                el.style.cssText = `position:absolute;left:${n.x}px;top:${n.y}px;min-width:140px;max-width:220px;padding:0.6rem 0.9rem;border-radius:0.7rem;background:${n.color||'#7C3AED'};color:#fff;font-weight:600;font-size:0.85rem;cursor:move;box-shadow:0 2px 8px rgba(0,0,0,0.2);user-select:none;${smSelectedId===n.id?'outline:3px solid #FBBF24;':''}${smLinkMode?'cursor:pointer;':''}`;
                el.textContent = n.label || '…';
                el.addEventListener('mousedown', (e) => smNodeMouseDown(e, n.id));
                el.addEventListener('dblclick', (e) => { e.stopPropagation(); smRenameNode(n.id); });
                el.addEventListener('click', (e) => { e.stopPropagation(); smNodeClick(n.id); });
                canvas.appendChild(el);
            });
            smRenderEdges();
        }

        function smNodeCenter(id){
            const n = smNodes.find(x => x.id === id);
            if (!n) return { x:0, y:0 };
            return { x: n.x + 80, y: n.y + 20 };
        }

        function smRenderEdges(){
            const svg = document.getElementById('smSvg');
            if (!svg) return;
            svg.innerHTML = '<defs><marker id="smArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9CA3AF"/></marker></defs>' +
                smEdges.map((e, i) => {
                    const a = smNodeCenter(e.from), b = smNodeCenter(e.to);
                    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#9CA3AF" stroke-width="2" marker-end="url(#smArrow)" style="pointer-events:auto;cursor:pointer;" onclick="smRemoveEdge(${i})"><title>Клик — удалить связь</title></line>`;
                }).join('');
        }

        function smNodeMouseDown(e, id){
            if (smLinkMode) return; // в режиме связывания перетаскивание отключено
            e.preventDefault();
            smDragId = id;
            const n = smNodes.find(x => x.id === id);
            const canvasRect = document.getElementById('smCanvas').getBoundingClientRect();
            smDragDX = e.clientX - canvasRect.left - n.x;
            smDragDY = e.clientY - canvasRect.top - n.y;
        }
        document.addEventListener('mousemove', (e) => {
            if (!smDragId) return;
            const canvas = document.getElementById('smCanvas');
            if (!canvas) return;
            const rect = canvas.getBoundingClientRect();
            const n = smNodes.find(x => x.id === smDragId);
            if (!n) return;
            n.x = Math.max(0, e.clientX - rect.left - smDragDX);
            n.y = Math.max(0, e.clientY - rect.top - smDragDY);
            const el = canvas.querySelector(`.sm-node[data-id="${smDragId}"]`);
            if (el) { el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; }
            smRenderEdges();
            smDirty = true;
        });
        document.addEventListener('mouseup', () => { smDragId = null; });

        function smNodeClick(id){
            if (smLinkMode) {
                if (!smLinkFrom) { smLinkFrom = id; smRender(); }
                else if (smLinkFrom !== id) {
                    smEdges.push({ from: smLinkFrom, to: id });
                    smLinkFrom = null;
                    smDirty = true;
                    smRender();
                }
                return;
            }
            smSelectedId = (smSelectedId === id) ? null : id;
            smRender();
        }

        function smToggleLinkMode(){
            smLinkMode = !smLinkMode;
            smLinkFrom = null;
            const btn = document.getElementById('smLinkBtn');
            if (btn) btn.className = 'btn-sm ' + (smLinkMode ? 'btn-purple' : 'btn-outline');
            smRender();
        }

        function smRemoveEdge(i){
            smEdges.splice(i, 1);
            smDirty = true;
            smRenderEdges();
        }

        const SM_COLORS = ['#7C3AED','#2563EB','#059669','#D97706','#DB2777','#0891B2','#DC2626'];
        function smAddNode(){
            const label = prompt('Название блока:', 'Новый блок');
            if (!label) return;
            const id = 'n' + Date.now();
            smNodes.push({ id, x: 40 + Math.random()*400, y: 40 + Math.random()*300, label, color: SM_COLORS[smNodes.length % SM_COLORS.length] });
            smDirty = true;
            smRender();
        }

        function smRenameNode(id){
            const n = smNodes.find(x => x.id === id);
            if (!n) return;
            const label = prompt('Название блока:', n.label || '');
            if (label === null) return;
            n.label = label.trim() || n.label;
            smDirty = true;
            smRender();
        }

        function smDeleteSelected(){
            if (!smSelectedId) { alert('Кликните по блоку, чтобы выбрать его для удаления.'); return; }
            if (!confirm('Удалить выбранный блок и все его связи?')) return;
            smEdges = smEdges.filter(e => e.from !== smSelectedId && e.to !== smSelectedId);
            smNodes = smNodes.filter(n => n.id !== smSelectedId);
            smSelectedId = null;
            smDirty = true;
            smRender();
        }

        async function smSave(){

                const r = await fetch('/api/site_structure.php?action=save', {
                    method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
                    body: JSON.stringify({ nodes: smNodes, edges: smEdges })
                });
                const d = await r.json();
                if (!d.ok) { alert(d.error || 'Не удалось сохранить'); return; }

                document.getElementById('smUpdatedNote').textContent = 'Обновлено: ' + new Date().toLocaleString('ru-RU');

        // ── Activity + IP journal (объединённый журнал, задача #31) ──────────
        const JOURNAL_ACTION_LABELS = { session: '🔐 Вход', contact_share_warning: '⚠️ Попытка уйти с платформы', consent_given: '✅ Согласие', consent_revoked: '⛔ Отзыв согласия', chat_erased_on_revoke: '🗑 Переписка стёрта (отзыв согласия)' };

        let journalCache = [];

        async function renderActivity(){
            document.getElementById('content').innerHTML =
                `<div class="note">🧾 Единый журнал: бизнес-события системы (регистрации, записи, оплаты, звонки) вместе с журналом входов по IP — в одной ленте, отсортированной по времени. Вход по IP пишется не чаще раза в 30 мин на юзера. Строки с ⚠️ — сообщения в чате, похожие на попытку обменяться контактами в обход платформы; отправитель получил предупреждение, но всё равно отправил.</div>

        async function loadMessageEditLog(){

        async function loadAuditLog(){
            const from = document.getElementById('auditFrom').value;
            const to = document.getElementById('auditTo').value;
            const qs = new URLSearchParams(); if (from) qs.set('from', from); if (to) qs.set('to', to);

            const [actRes, auditRes] = await Promise.all([
                apiGet('activity').catch(() => ({ok:false})),
                fetch('/api/consent.php?action=audit-list&' + qs.toString(), { credentials:'include' }).then(r => r.json()).catch(() => ({ok:false}))
            ]);

            const events = (actRes && actRes.ok ? actRes.data : []) || [];
            const audits = (auditRes && auditRes.ok ? auditRes.data : []) || [];

            let merged = [];
            events.forEach(e => merged.push({
                ts: e.ts, kind: 'event', typeLabel: JOURNAL_TYPE_LABELS[e.type] || e.type,
                who: e.actor || '—', role: e.actor_role || '', ip: '', ua: '', risk: false, snippet: ''
            }));
            audits.forEach(r => {
                const name = `${r.first_name||''} ${r.last_name||''}`.trim() || (r.email || r.user_id || '—');
                let meta = {}; try { meta = r.meta ? JSON.parse(r.meta) : {}; } catch(e){}
                const isRisk = r.action === 'contact_share_warning';
                merged.push({
                    ts: r.created_at, kind: 'audit', typeLabel: JOURNAL_ACTION_LABELS[r.action] || r.action || '—',
                    who: name, role: r.role || '', ip: r.ip || '', ua: r.user_agent || '', risk: isRisk,
                    snippet: isRisk && meta.snippet ? meta.snippet : ''
                });
            });

            // Клиентский фильтр по датам для бизнес-событий (у activity нет серверного фильтра по датам)
            if (from) merged = merged.filter(r => !r.ts || r.ts >= (from + ' 00:00:00'));
            if (to) merged = merged.filter(r => !r.ts || r.ts <= (to + ' 23:59:59'));

            merged.sort((a, b) => String(b.ts||'').localeCompare(String(a.ts||'')));
            merged = merged.slice(0, 1000);
            journalCache = merged;

            const box = document.getElementById('auditLogBox');
            if (!box) return;
            if (!merged.length){ box.innerHTML = '<div class="empty">Записей не найдено</div>'; return; }
            box.innerHTML = `<table id="auditTable"><thead><tr><th>Дата/время</th><th>Событие</th><th>Пользователь</th><th>Роль</th><th>IP</th><th>Устройство</th></tr></thead><tbody>` +
                merged.map(r => {

        function exportAuditLogCsv(){

        // ── Tariffs ─────────────────────────────────────────────────────────
        const TARIFFS = [

                      <input id="promo_${k}_title" type="text" value="${esc(sGet('promo_'+k+'_title',''))}" placeholder="Сессия-знакомство" style="width:100%;margin-top:0.25rem;padding:0.45rem 0.6rem;border:1.5px solid var(--a-input-border);border-radius:0.5rem;font-family:inherit;background:var(--a-input-bg);color:var(--a-text);"></label>

                      </span>
                    </label>

                        Из чьей доли берётся комиссия сервиса

                          style="width:100%;margin-top:0.25rem;padding:0.45rem 0.6rem;border:1.5px solid var(--a-input-border);border-radius:0.5rem;font-family:inherit;background:var(--a-input-bg);color:var(--a-text);">
                          <option value="platform" ${splitPayer !== 'shared' ? 'selected' : ''}>Полностью из комиссии платформы</option>

              <div class="panel" style="margin-top:1.25rem;">
