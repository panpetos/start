        function payModelNow() {
            const r = document.querySelector('input[name="payModel"]:checked');
            return r ? r.value : 'agent';
        }

        /**
         * Разложить одну оплату по модели. Возвращает, кто сколько получит.
         *
         * Агентская: клиент платит эквайрингу, психологу уходит цена минус комиссия,
         * платформе остаётся комиссия минус эквайринг и налог.
         *
         * Сплит: сервис сам делит платёж. Его процент берётся либо целиком из доли
         * платформы (обычная договорённость), либо пропорционально с обеих долей —
         * тогда психолог тоже получает меньше, и это надо видеть заранее.
         */
        function splitOne(price, opts) {
            const P = price, c = opts.commission, t = opts.tax;
            const comm = P * c / 100;              // доля платформы до расходов
            let psy = P - comm;                    // доля психолога
            const service = opts.model === 'split'
                ? P * opts.splitFee / 100          // сколько забирает сервис — всегда полная сумма
                : P * opts.acquiring / 100;
            // Сколько из этой суммы ложится на платформу. В пропорциональном режиме
            // часть удерживается с психолога, и её нельзя вычитать ещё и из дохода
            // платформы: иначе доли не сходятся с ценой (проверка это и поймала).
            let onPlatform = service;
            if (opts.model === 'split' && opts.payer === 'shared') {
                const psyPart = service * (psy / P);
                psy -= psyPart;
                onPlatform = service - psyPart;
            }
            const tax = comm * t / 100;
            const net = comm - onPlatform - tax;
            return { price: P, psy, comm, service, onPlatform, tax, net };
        }

        function currentPayOpts() {
            return {
                model: payModelNow(),
                commission: num('commission_platform'),
                acquiring: num('fee_acquiring'),
                splitFee: num('fee_split'),
                tax: num('tax_rate'),
                payer: (document.getElementById('split_payer') || {}).value || 'platform',
            };
        }

        function recalcIncome(){
            const opts = currentPayOpts();
            const isSplit = opts.model === 'split';
            // Поля неиспользуемой модели притушаем, чтобы не гадать, что сейчас считается
            const ag = document.getElementById('agentFields'), sp = document.getElementById('splitFields');
            if (ag) ag.style.opacity = isSplit ? '0.45' : '1';
            if (sp) sp.style.opacity = isSplit ? '1' : '0.45';

            const f = n => Math.round(n).toLocaleString('ru-RU');
            const rows = TARIFFS.map(tr => {
                const r = splitOne(num('price_'+tr.key), opts);
                return `<tr>
                  <td><b>${esc(tr.label)}</b></td>
                  <td>${f(r.price)} ₽</td>
                  <td>${f(r.psy)} ₽</td>
                  <td>${f(r.comm)} ₽</td>
                  <td class="muted">−${f(r.service)} ₽</td>
                  <td class="muted">−${f(r.tax)} ₽</td>
                  <td style="color:${r.net < 0 ? '#DC2626' : '#16A34A'};font-weight:700;">${f(r.net)} ₽</td>
                </tr>`;
            }).join('');
            const el = document.getElementById('incomeTable');
            if (el) el.innerHTML = `
              <div style="overflow-x:auto;">
              <table style="font-size:0.78rem;min-width:520px;"><thead><tr>
                <th>Тариф</th><th>Клиент платит</th><th>Психолог</th><th>Комиссия</th>
                <th>${isSplit ? 'Сервис сплита' : 'Эквайринг'}</th><th>Налог</th><th>Чистыми</th>
              </tr></thead><tbody>${rows}</tbody></table></div>
              <p style="font-size:0.74rem;color:var(--a-text-muted);margin-top:0.6rem;line-height:1.5;">
                «Психолог» — сколько получит специалист. «Чистыми» — что остаётся платформе после
                ${isSplit ? 'комиссии сервиса' : 'эквайринга'} и налога. Клиент видит только итоговую цену.</p>`;
            renderModelCompare();
        }

        /** Сравнение двух моделей на текущих ценах — чтобы решать числами, а не на глаз. */
        function renderModelCompare() {
            const box = document.getElementById('modelCompare');
            if (!box) return;
            const base = currentPayOpts();
            const f = n => Math.round(n).toLocaleString('ru-RU');
            const shared = base.payer === 'shared';
            let psyLoss = 0;
            const rows = TARIFFS.map(tr => {
                const P = num('price_'+tr.key);
                const a = splitOne(P, Object.assign({}, base, { model: 'agent' }));
                const sp = splitOne(P, Object.assign({}, base, { model: 'split' }));
                const diff = sp.net - a.net;
                psyLoss += a.psy - sp.psy;
                return `<tr>
                    <td><b>${esc(tr.label)}</b></td>
                    <td>${f(P)} ₽</td>
                    <td>${f(a.net)} ₽</td>
                    <td>${f(sp.net)} ₽</td>
                    <td style="font-weight:700;color:${diff >= 0 ? '#16A34A' : '#DC2626'};">
                      ${diff >= 0 ? '+' : '−'}${f(Math.abs(diff))} ₽</td>
                    <td>${f(a.psy)} ₽</td>
                    <td style="${shared ? 'color:#DC2626;font-weight:700;' : ''}">${f(sp.psy)} ₽</td>
                  </tr>`;
            }).join('');
            const per100 = (base.splitFee - base.acquiring);
            box.innerHTML = `
              <div style="overflow-x:auto;">
              <table style="font-size:0.78rem;min-width:640px;"><thead><tr>
                <th rowspan="2">Тариф</th><th rowspan="2">Цена</th>
                <th colspan="3">Платформе чистыми</th><th colspan="2">Психолог получит</th>
              </tr><tr>
                <th>агентская</th><th>сплит</th><th>разница</th><th>агентская</th><th>сплит</th>
              </tr></thead><tbody>${rows}</tbody></table></div>
              <p style="font-size:0.78rem;line-height:1.6;margin-top:0.8rem;">
                Разница целиком в проценте посредника: сплит дороже эквайринга на
                <b>${(per100).toFixed(1)}%</b> от каждой оплаты. За эту разницу сервис берёт на себя
                выплаты психологам и чеки самозанятых — то, что в агентской модели платформа делает сама.
                Считайте так: если ручные выплаты и чеки стоят вам дороже этой разницы (временем, ошибками,
                риском по 54-ФЗ) — сплит выгоднее, даже что процент выше.</p>
              ${shared ? `<p style="font-size:0.78rem;line-height:1.6;color:#B45309;background:#FFF8EC;
                   border:1px solid #F0D9A8;border-radius:0.6rem;padding:0.6rem 0.8rem;">
                   ⚠️ Сейчас выбрано «пропорционально»: часть комиссии сервиса удерживается с психолога —
                   по всем тарифам он получит на <b>${f(psyLoss)} ₽</b> меньше, чем в агентской модели.
                   Доход платформы от этого выглядит выше, но это не экономия, а переложенный расход.
                   Так можно делать, только если это прописано в договоре со специалистом.</p>` : ''}`;
        }

        async function saveTariffs(btn){
            const payload = {};
            TARIFFS.forEach(t => { payload['price_'+t.key] = num('price_'+t.key); });
            payload.platform_commission = num('commission_platform');
            payload.acquiring_fee = num('fee_acquiring');
            payload.tax_rate = num('tax_rate');
            payload.payment_model = payModelNow();
            payload.split_fee = num('fee_split');
            payload.split_fee_payer = (document.getElementById('split_payer') || {}).value || 'platform';
            TARIFFS.forEach(t => {
                const k = t.key;
                payload['promo_'+k+'_enabled']  = document.getElementById('promo_'+k+'_enabled').checked ? '1' : '0';
                payload['promo_'+k+'_price']    = document.getElementById('promo_'+k+'_price').value.trim();
                payload['promo_'+k+'_title']    = document.getElementById('promo_'+k+'_title').value.trim();
                payload['promo_'+k+'_duration'] = document.getElementById('promo_'+k+'_duration').value.trim();
                payload['promo_'+k+'_deadline'] = document.getElementById('promo_'+k+'_deadline').value.trim();
            });
            const msg = document.getElementById('saveMsg');
            btn.disabled = true; if(msg){ msg.textContent='Сохраняем...'; msg.style.color='var(--a-text-sec)'; }
            const res = await apiPost('save-settings', { settings: payload });
            btn.disabled = false;
            if (res && res.ok) {
                if(msg){ msg.textContent = '✅ Сохранено (обновлено полей: '+(res.saved||0)+')'; msg.style.color='#16A34A'; }
            } else {
                if(msg){ msg.textContent = '⚠️ ' + ((res&&res.error)||'Не удалось сохранить'); msg.style.color='#DC2626'; }
            }
        }

        // ── Support ─────────────────────────────────────────────────────────
        let supportThreadId = null;
        let supPollTimer = null;
        let supMsgPollTimer = null;
        let supLastTotalUnread = 0;
        let supPendingFile = null;
        let supAllThreadRows = [];

        function filterSupportThreads() {
            const q = (document.getElementById('supSearchInput')?.value || '').trim().toLowerCase();
            const tbody = document.getElementById('supThreadsBody');
            if (!tbody || !supAllThreadRows.length) return;
            const roleBadge = (t) => {
                const reg = t.registered ? '<span class="badge b-green">в системе</span>' : '<span class="badge b-amber">не зарегистрирован</span>';
                const role = t.role ? `<span class="badge b-purple">${esc(t.role)}</span>` : '';
                return role + ' ' + reg;
            };
            const filtered = q ? supAllThreadRows.filter(t => {
                const name = (t.name || '').toLowerCase();
                const email = (t.email || '').toLowerCase();
                return name.includes(q) || email.includes(q);
            }) : supAllThreadRows;
            tbody.innerHTML = filtered.length ? filtered.map(t => {
                const contact = [t.email].filter(Boolean).map(esc).join(' · ') || '<span class="muted">email не указан</span>';
                const unread = t.unread > 0 ? `<span class="badge b-red">${t.unread} новых</span>` : '';
                return `<tr style="cursor:pointer;" onclick="openSupportInChat('${esc(t.id)}')">
                    <td><b>${esc(t.name || 'Гость')}</b><br><span class="muted" style="font-size:0.78rem;">${contact}</span></td>
                    <td>${roleBadge(t)}</td>
                    <td style="max-width:280px;white-space:normal;">${esc((t.last_sender==='admin'?'Вы: ':'') + (t.last_message||''))}</td>
                    <td class="muted">${fmtDateTime(t.last_at)} ${unread}</td>
                </tr>`;
            }).join('') : '<tr><td colspan="4" class="muted" style="padding:1.5rem;text-align:center;">Ничего не найдено</td></tr>';
        }

        // Задача #37: обращения теперь открываются и отвечаются в той же форме, что и
        // обычные сообщения от психологов/клиентов — в chat.html (там же Избранное,
        // пересылка и т.д.), а не в отдельной панели админки.
        function openSupportInChat(id) {
            window.open('/chat.html?support=' + encodeURIComponent(id), '_blank', 'noopener');
        }

        function supPlaySound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(660, ctx.currentTime);
                osc.frequency.setValueAtTime(880, ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.5);
            } catch(e) {}
        }

        function supShowNotif(text) {
            let notif = document.getElementById('supAdminNotif');
            if (!notif) {
                notif = document.createElement('div');
                notif.id = 'supAdminNotif';
                notif.style.cssText = 'position:fixed;top:92px;right:1rem;z-index:2000;background:var(--a-panel);border:1px solid var(--a-panel-border);border-left:3px solid #7C3AED;border-radius:0.6rem;padding:0.6rem 1rem;box-shadow:0 8px 24px rgba(0,0,0,0.15);max-width:320px;font-size:0.85rem;cursor:pointer;animation:supNotifIn 0.3s ease;';
                document.body.appendChild(notif);
                const style = document.createElement('style');
                style.textContent = '@keyframes supNotifIn{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:translateX(0);}}';
                document.head.appendChild(style);
            }
            notif.innerHTML = '<div style="font-weight:600;font-size:0.78rem;color:#7C3AED;margin-bottom:0.15rem;">💬 Новое сообщение</div>' + esc(text.length > 100 ? text.slice(0,100) + '...' : text);
            notif.style.display = 'block';
            notif.onclick = function() { notif.style.display = 'none'; };
            setTimeout(() => { notif.style.display = 'none'; }, 6000);
        }

        function supRenderAttachment(m) {
            if (!m.attachment_url) return '';
            const isImg = (m.attachment_type || '').includes('image');
            // просмотр во весь экран берёт на себя lightbox.js — window.open здесь открывал второе окно
            if (isImg) return `<div style="margin-top:0.3rem;"><img src="${esc(m.attachment_url)}" style="max-width:200px;max-height:150px;border-radius:0.5rem;cursor:pointer;" data-zoom></div>`;
            return `<div style="margin-top:0.3rem;"><a href="${esc(m.attachment_url)}" target="_blank" style="color:inherit;text-decoration:underline;font-size:0.8rem;">📎 ${esc(m.attachment_name || 'файл')}</a></div>`;
        }

        let supLastInboxUnread = 0;
        function supStartPolling() {
            if (supPollTimer) clearInterval(supPollTimer);
            supPollTimer = setInterval(async () => {
                try {
                    const res = await (await fetch('/api/support.php?action=threads', { credentials:'include' })).json();
                    const rows = (res && res.ok) ? (res.data || []) : [];
                    const widgetUnread = rows.reduce((s,t) => s + (t.unread || 0), 0);
                    if (widgetUnread > supLastTotalUnread) {
                        supPlaySound();
                        const newest = rows.find(t => t.unread > 0);
                        if (newest) supShowNotif((newest.name || 'Гость') + ': ' + (newest.last_message || ''));
                    }
                    supLastTotalUnread = widgetUnread;

                    // Внутренний чат (сообщения клиентов/психологов) — опрашивается всегда,
                    // на любой вкладке админки, а не только на «Поддержка», иначе звук/тост не срабатывали.
                    const inbox = await supRefreshInbox();
                    if (inbox.unread > supLastInboxUnread) {
                        supPlaySound();
                        if (inbox.preview) supShowNotif(inbox.preview);
                    }
                    supLastInboxUnread = inbox.unread;

                    updateSupportBadge(widgetUnread + inbox.unread);
                    if (currentTab === 'support' && !supportThreadId) updateThreadList(rows);
                } catch(e) {}
            }, 5000);
        }

        function updateSupportBadge(count) {
            const btn = document.querySelector('[data-tab="support"]');
            if (!btn) return;
            let badge = btn.querySelector('.sup-badge');
            if (count > 0) {
                if (!badge) { badge = document.createElement('span'); badge.className = 'sup-badge'; badge.style.cssText = 'background:#DC2626;color:#fff;font-size:0.65rem;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;margin-left:auto;'; btn.appendChild(badge); }
                badge.textContent = count;
            } else if (badge) { badge.remove(); }
        }

        function updateThreadList(rows) {
            const tbody = document.querySelector('#content table tbody');
            if (!tbody || supportThreadId) return;
            const roleBadge = (t) => {
                const reg = t.registered ? '<span class="badge b-green">в системе</span>' : '<span class="badge b-amber">не зарегистрирован</span>';
                const role = t.role ? `<span class="badge b-purple">${esc(t.role)}</span>` : '';
                return role + ' ' + reg;
            };
            tbody.innerHTML = rows.length ? rows.map(t => {
                const contact = [t.email].filter(Boolean).map(esc).join(' · ') || '<span class="muted">email не указан</span>';
                const unread = t.unread > 0 ? `<span class="badge b-red">${t.unread} новых</span>` : '';
                return `<tr style="cursor:pointer;" onclick="openSupportInChat('${esc(t.id)}')">
                    <td><b>${esc(t.name || 'Гость')}</b><br><span class="muted" style="font-size:0.78rem;">${contact}</span></td>
                    <td>${roleBadge(t)}</td>
                    <td style="max-width:280px;white-space:normal;">${esc((t.last_sender==='admin'?'Вы: ':'') + (t.last_message||''))}</td>
                    <td class="muted">${fmtDateTime(t.last_at)} ${unread}</td>
                </tr>`;
            }).join('') : '<tr><td colspan="4" class="muted" style="padding:1.5rem;text-align:center;">Обращений пока нет</td></tr>';
        }

        function supRenderInboxList(convs) {
            const box = document.getElementById('supInboxList');
            if (!box) return;
            if (!convs.length) { box.innerHTML = '<div class="empty" style="padding:1.25rem;">Сообщений во внутреннем чате нет</div>'; return; }
            box.innerHTML = convs.map(c => {
                const name = `${c.first_name || ''} ${c.last_name || ''}`.trim() || 'Пользователь';
                const preview = (c.is_mine ? 'Вы: ' : '') + ((c.last_message || '').replace(/^\[ORDER#\d+\]\s*/, ''));
                const unread = c.unread_count > 0 ? `<span class="badge b-red">${c.unread_count} новых</span>` : '';
                return `<div style="display:flex;justify-content:space-between;align-items:center;gap:0.75rem;padding:0.7rem 1rem;border-bottom:1px solid var(--a-td-border);">
                    <div style="min-width:0;">
                        <b>${esc(name)}</b>
                        ${c.email ? `<span class="muted" style="font-size:0.78rem;"> · ${esc(c.email)}</span>` : ''}
                        <div class="muted" style="font-size:0.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px;">${esc(preview)}</div>
                    </div>
                    <div style="display:flex;align-items:center;gap:0.5rem;flex-shrink:0;">
                        ${unread}
                        <span class="muted" style="font-size:0.75rem;">${c.last_message_time ? fmtDateTime(c.last_message_time) : ''}</span>
                        <a class="btn-sm btn-purple" href="/chat.html?admin=1&user=${encodeURIComponent(c.user_id)}" target="_blank" rel="noopener">Открыть чат</a>
                    </div>
                </div>`;
            }).join('');
        }
        async function supRefreshInbox() {
            try {
                const convs = await (await fetch('/api/messages.php?action=conversations', { credentials:'include' })).json();
                if (Array.isArray(convs)) {
                    if (currentTab === 'support') {
                        supRenderInboxList(convs);
                        const t = document.getElementById('supInboxTitle');
                        if (t) t.textContent = `Сообщения от клиентов и психологов (${convs.length})`;
                    }
                    const unread = convs.reduce((s,c) => s + (c.unread_count || 0), 0);
                    const newest = convs.filter(c => c.unread_count > 0)
                        .sort((a,b) => String(b.last_message_time||'').localeCompare(String(a.last_message_time||'')))[0];
                    const preview = newest ? `${(newest.first_name||'')} ${(newest.last_name||'')}`.trim() + ': ' + (newest.last_message||'') : '';
                    return { unread, preview };
                }
            } catch(e) {}
            return { unread: 0, preview: '' };
        }
        async function renderSupport(){
            if (supMsgPollTimer) { clearInterval(supMsgPollTimer); supMsgPollTimer = null; }
            let res;
            try { res = await (await fetch('/api/support.php?action=threads', { credentials:'include' })).json(); }
            catch(e){ return fail(); }
            if (!res || !res.ok) return fail();
            const rows = res.data || [];
            supLastTotalUnread = rows.reduce((s,t) => s + (t.unread || 0), 0);
            updateSupportBadge(supLastTotalUnread);
            const roleBadge = (t) => {
                const reg = t.registered ? '<span class="badge b-green">в системе</span>' : '<span class="badge b-amber">не зарегистрирован</span>';
                const role = t.role ? `<span class="badge b-purple">${esc(t.role)}</span>` : '';
                return role + ' ' + reg;
            };
            const list = rows.length ? rows.map(t => {
                const contact = [t.email].filter(Boolean).map(esc).join(' · ') || '<span class="muted">email не указан</span>';
                const unread = t.unread > 0 ? `<span class="badge b-red">${t.unread} новых</span>` : '';
                return `<tr style="cursor:pointer;" onclick="openSupportInChat('${esc(t.id)}')">
                    <td><b>${esc(t.name || 'Гость')}</b><br><span class="muted" style="font-size:0.78rem;">${contact}</span></td>
                    <td>${roleBadge(t)}</td>
                    <td style="max-width:280px;white-space:normal;">${esc((t.last_sender==='admin'?'Вы: ':'') + (t.last_message||''))}</td>
                    <td class="muted">${fmtDateTime(t.last_at)} ${unread}</td>
                </tr>`;
            }).join('') : '<tr><td colspan="4" class="muted" style="padding:1.5rem;text-align:center;">Обращений пока нет</td></tr>';
            document.getElementById('content').innerHTML =
                '<div class="note">💬 Обращения обновляются автоматически. Нажмите на обращение, чтобы ответить в обычном чате (chat.html) — открывается в новой вкладке, там же Избранное и пересылка.</div>' +
                `<div class="panel" style="margin-bottom:1.25rem;"><div class="panel-head"><h2>Обращения (${rows.length})</h2><div style="display:flex;gap:0.5rem;align-items:center;"><input id="supSearchInput" placeholder="🔍 Поиск по имени / email..." style="padding:0.4rem 0.7rem;border:1.5px solid var(--a-input-border,#ddd);border-radius:0.5rem;font-family:inherit;font-size:0.8rem;background:var(--a-input-bg,#fff);color:var(--a-text,#1a1a1a);width:200px;" oninput="filterSupportThreads()"><button class="btn-sm btn-outline" onclick="supportThreadId=null;renderSupport()">↻ Обновить</button></div></div>
                  <div class="tbl-wrap"><table><thead><tr><th>Контакт</th><th>Роль / статус</th><th>Последнее сообщение</th><th>Когда</th></tr></thead><tbody id="supThreadsBody">${list}</tbody></table></div></div>` +
                `<div class="panel"><div class="panel-head"><h2 id="supInboxTitle">Сообщения от клиентов и психологов</h2><button class="btn-sm btn-outline" onclick="supRefreshInbox()">↻ Обновить</button></div>
                  <div class="note" style="margin:0.75rem 1rem 0;">Это переписка через встроенный чат сайта (не виджет поддержки на публичных страницах) — когда клиент или психолог пишут «Техподдержке» из своего личного кабинета.</div>
                  <div id="supInboxList" style="margin-top:0.5rem;"><div class="loading">Загрузка...</div></div></div>`;
            supAllThreadRows = rows;
            if (supportThreadId) openSupportThread(supportThreadId);
            supRefreshInbox();
        }

        let supOpenMsgCount = 0;
        let supLastMsgId = 0;

        function supRenderBubble(m) {
            const admin = m.sender === 'admin';
            return `<div data-msg-id="${m.id||''}" style="align-self:${admin?'flex-end':'flex-start'};max-width:75%;background:${admin?'linear-gradient(135deg,#7C3AED,#9F67FA)':'var(--a-panel)'};color:${admin?'#fff':'var(--a-text)'};border:${admin?'none':'1px solid var(--a-panel-border)'};border-radius:0.9rem;padding:0.5rem 0.8rem;font-size:0.875rem;line-height:1.45;">${esc(m.body)}${supRenderAttachment(m)}<div style="font-size:0.68rem;opacity:0.7;margin-top:0.2rem;">${fmtDateTime(m.created_at)}</div></div>`;
        }

        async function openSupportThread(id){
            supportThreadId = id;
            const isUpdate = document.getElementById('supMsgsBox') && document.getElementById('supMsgsBox').dataset.threadId === id;
            if (!isUpdate) {
                supLastMsgId = 0;
                supOpenMsgCount = 0;
                document.getElementById('content').innerHTML = `<div style="display:flex;flex-direction:column;height:calc(100vh - 84px);background:var(--a-bg);">
                    <div id="supChatHead" style="display:flex;align-items:center;gap:0.5rem;padding:0.75rem 1rem;background:var(--a-panel);border-bottom:1px solid var(--a-panel-border);flex-shrink:0;">
                        <button class="btn-sm btn-outline" style="font-size:0.8rem;flex-shrink:0;" onclick="supportThreadId=null;supOpenMsgCount=0;supLastMsgId=0;renderSupport()">← Назад</button>
                        <h2 style="font-size:0.95rem;flex:1;margin:0;"></h2>
                    </div>
                    <div id="supMsgsBox" data-thread-id="${esc(id)}" style="display:flex;flex-direction:column;gap:0.5rem;padding:1rem;flex:1;overflow-y:auto;"></div>
                    <div id="supAttachPreview" style="display:none;padding:0.3rem 0.75rem;font-size:0.78rem;color:#7C3AED;border-top:1px solid var(--a-panel-head-border);background:var(--a-panel);flex-shrink:0;"></div>
                    <div style="display:flex;gap:0.5rem;padding:0.75rem;border-top:1px solid var(--a-panel-head-border);align-items:center;background:var(--a-panel);flex-shrink:0;">
                        <button onclick="document.getElementById('supFileInput').click()" style="border:1px solid var(--a-input-border);background:none;cursor:pointer;padding:0.4rem;border-radius:0.4rem;font-size:1rem;color:var(--a-text-sec);" title="Прикрепить файл">📎</button>
                        <input type="file" id="supFileInput" accept="image/*,.pdf,.txt,.doc,.docx" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px;" onchange="supHandleFile(this)">
                        <input id="supReplyInput" placeholder="Ответ клиенту..." style="flex:1;padding:0.6rem 0.85rem;border:1.5px solid var(--a-input-border);border-radius:0.6rem;font-family:inherit;outline:none;background:var(--a-input-bg);color:var(--a-text);" onkeypress="if(event.key==='Enter')sendSupportReply()">
                        <button class="btn-sm btn-purple" style="padding:0.6rem 1.2rem;" onclick="sendSupportReply()">Ответить</button>
                    </div>
                </div>`;
                const inp = document.getElementById('supReplyInput');
                if (inp) inp.addEventListener('paste', function(e) {
                    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                    for (let i = 0; i < items.length; i++) {
                        if (items[i].type.indexOf('image') === 0) {
                            e.preventDefault();
                            supUploadFile(items[i].getAsFile());
                            break;
                        }
                    }
                });
            }

            let res;
            try { res = await (await fetch('/api/support.php?action=messages&thread_id=' + encodeURIComponent(id), { credentials:'include' })).json(); }
            catch(e){ return; }
            const t = res.thread || {};
            const msgs = res.data || [];

            const headEl = document.querySelector('#supChatHead h2');
            if (headEl) headEl.innerHTML = `${esc(t.name||'Гость')} · ${t.role?esc(t.role):'—'} · ${t.registered||t.user_id?'<span class="badge b-green">в системе</span>':'<span class="badge b-amber">гость</span>'}${t.email?(' · '+esc(t.email)):''}`;

            const userMsgCount = msgs.filter(m => m.sender === 'user').length;
            if (userMsgCount > supOpenMsgCount && supOpenMsgCount > 0) supPlaySound();
            supOpenMsgCount = userMsgCount;

            const box = document.getElementById('supMsgsBox');
            if (!box) return;

            if (isUpdate && msgs.length) {
                const existingIds = new Set(Array.from(box.querySelectorAll('[data-msg-id]')).map(el => el.dataset.msgId));
                const newMsgs = msgs.filter(m => !existingIds.has(String(m.id||'')));
                if (newMsgs.length) {
                    const wasAtBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
                    newMsgs.forEach(m => box.insertAdjacentHTML('beforeend', supRenderBubble(m)));
                    if (wasAtBottom) box.scrollTop = box.scrollHeight;
                }
            } else {
                box.innerHTML = msgs.length ? msgs.map(m => supRenderBubble(m)).join('') : '<div class="muted" style="text-align:center;padding:1rem;">Нет сообщений</div>';
                box.scrollTop = box.scrollHeight;
            }

            if (supMsgPollTimer) clearInterval(supMsgPollTimer);
            supMsgPollTimer = setInterval(() => {
                if (currentTab !== 'support' || !supportThreadId) { clearInterval(supMsgPollTimer); supMsgPollTimer = null; return; }
                openSupportThread(supportThreadId);
            }, 3000);
        }

        // Через общий загрузчик (js/app.js): крупное уходит частями, иначе файл
        // больше 256 МБ обрывал бы сам сервер, ещё до нашей проверки.
        async function supUploadFile(file) {
            const el = document.getElementById('supAttachPreview');
            const show = (html) => { if (el) { el.innerHTML = html; el.style.display = 'block'; } };
            try {
                show('📎 ' + esc(file.name) + ' — загрузка…');
                const d = await psyUpload(file, (p) => show('📎 ' + esc(file.name) + ' — ' + Math.round(p * 100) + '%'));
                supPendingFile = { url: d.url, type: file.type, name: file.name };
                show('📎 ' + esc(file.name) + ' <span style="cursor:pointer;margin-left:0.3rem;" onclick="supPendingFile=null;this.parentNode.style.display=\'none\'">✕</span>');
            } catch (e) {
                show('');
                if (el) el.style.display = 'none';
                alert(e.message || 'Ошибка загрузки');
            }
        }
        function supHandleFile(input) {
            const file = input.files[0]; if (!file) return;
            supUploadFile(file);
            input.value = '';
        }

        async function sendSupportReply(){
            const inp = document.getElementById('supReplyInput');
            const msg = (inp.value||'').trim();
            const att = supPendingFile;
            supPendingFile = null;
            const preview = document.getElementById('supAttachPreview');
            if (preview) preview.style.display = 'none';
            if ((!msg && !att) || !supportThreadId) return;
            inp.value = '';
            const payload = { thread_id: supportThreadId, message: msg };
            if (att) { payload.attachment_url = att.url; payload.attachment_type = att.type; payload.attachment_name = att.name; }
            try {
                await fetch('/api/support.php?action=reply', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify(payload) });
                await openSupportThread(supportThreadId);
            } catch(e){ alert('Не удалось отправить ответ'); inp.value = msg; }
        }

        // ── Dev tasks ───────────────────────────────────────────────────────
        const DEV_API = '/api/dev_tasks.php';
        let devPollTimer = null;
        let devNewFiles = [];
        let devReworkFiles = [];
        let devTasksCache = [];
        const DEV_STMAP = { new:['b-amber','новая'], in_progress:['b-purple','в работе у Клода'], paused:['b-blue','на паузе'], done:['b-green','готово — проверьте'], rework:['b-red','на доработку'], closed:['b-gray','закрыто ✓'] };
        const DEV_TABS = [
            {key:'open', label:'В работе', match:t => t.status !== 'closed'},
            {key:'new', label:'Новые', match:t => t.status === 'new'},
            {key:'in_progress', label:'У Клода', match:t => t.status === 'in_progress'},
            {key:'paused', label:'На паузе', match:t => t.status === 'paused'},
            {key:'rework', label:'На доработку', match:t => t.status === 'rework'},
            {key:'done', label:'Готово', match:t => t.status === 'done'},
            {key:'closed', label:'Архив', match:t => t.status === 'closed'},
            {key:'all', label:'Все', match:() => true},
        ];
        let devActiveTab = 'open';
        let devSearchQuery = '';
        let devSelectedIds = new Set();

        function devImgs(json, label){
            let arr = []; try { arr = json ? JSON.parse(json) : []; } catch(e){}
            if (!arr || !arr.length) return '';
            const items = arr.map(u => {
                if (/\.(jpg|jpeg|png|gif|webp)$/i.test(u))
                    return `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="скрин" style="height:70px;border-radius:0.4rem;border:1px solid var(--a-input-border);object-fit:cover;"></a>`;
                const ext = (u.split('.').pop() || 'файл').toUpperCase();
                return `<a href="${esc(u)}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:0.35rem;height:44px;padding:0 0.8rem;border:1px solid var(--a-input-border);border-radius:0.4rem;background:var(--a-input-bg);font-size:0.82rem;color:var(--a-text-sec);text-decoration:none;">📄 ${esc(ext)}-файл</a>`;
            }).join('');
            return `<div style="margin-top:0.5rem;">${label ? `<div class="muted" style="font-size:0.75rem;margin-bottom:0.25rem;">${label}</div>` : ''}<div style="display:flex;gap:0.4rem;flex-wrap:wrap;align-items:center;">${items}</div></div>`;
        }
        function devTaskRow(t){
            const s = DEV_STMAP[t.status] || ['b-gray', t.status];
            const cc = t.claude_comment ? `<div style="margin-top:0.4rem;background:var(--a-sidebar-active-bg);border-radius:0.5rem;padding:0.5rem 0.7rem;font-size:0.82rem;"><b>🤖 Клод:</b> ${esc(t.claude_comment)}</div>` : '';
            const ac = t.admin_comment ? `<div style="margin-top:0.3rem;color:var(--a-text-sec);font-size:0.8rem;">✍️ Ваш комментарий: ${esc(t.admin_comment)}</div>` : '';
            const closed = t.status === 'closed';
            const btns = closed
                ? `<button class="btn-sm btn-outline" onclick="devSet(${t.id},'new')">↩ Вернуть в работу</button>`
                : `<button class="btn-sm btn-outline" onclick="devSet(${t.id},'closed')">✓ Закрыть</button>
                   <button class="btn-sm btn-red" onclick="devOpenRework(${t.id})">↩ На доработку</button>`;

        async function devRefresh(){

                const lr = st.last_run;
                const stateLbl = lr ? ({running:'🟢 Клод сейчас работает', idle:'⚪ Ждёт следующего запуска', requested:'🟡 Запрошен прогон', limited:'🟠 Достигнут лимит — повторит позже', error:'🔴 Ошибка в прошлом запуске'}[lr.state] || lr.state) : 'запусков ещё не было';

            }
            devRenderTabs(list);
            devRenderList(list);
        }

        function devRenderTabs(list){

            tabsEl.innerHTML = DEV_TABS.map(tb => {
                const count = list.filter(tb.match).length;
                return `<button class="dev-tab ${devActiveTab===tb.key?'active':''}" onclick="devSetTab('${tb.key}')">${tb.label} (${count})</button>`;
            }).join('');
        }

        function devSetTab(key){

            devRenderTabs(devTasksCache);
            devRenderList(devTasksCache);
        }

        function setDevSearch(val){
            devSearchQuery = val;
            if (currentTab === 'devtasks') syncUrlState({ q: val || null });
            devRenderList(devTasksCache);

        function devFilteredTasks(list){
            const tab = DEV_TABS.find(t => t.key === devActiveTab) || DEV_TABS[0];
            let out = list.filter(tab.match);
            const q = devSearchQuery.trim().toLowerCase();
            if (q) out = out.filter(t => (t.title||'').toLowerCase().includes(q) || (t.body||'').toLowerCase().includes(q));

        async function devBulkApplyStatus(){

                        <div class="muted" style="font-size:0.76rem;margin-top:0.2rem;">Изображения, PDF, DOC/DOCX, TXT — до 20 МБ. Можно вставить из буфера обмена (Ctrl+V).</div>

                (tokenConfigured ? '' :
                    `<div class="panel" style="margin-bottom:1rem;border-color:#FCD34D;"><div class="panel-head"><h2>⚙️ Токен автоматизации (один раз)</h2></div><div style="padding:1.1rem;">
                        <p class="muted" style="font-size:0.85rem;margin-bottom:0.6rem;">Чтобы Клод мог забирать задачи по расписанию, задайте секретный токен. Сгенерируйте случайный и сохраните — он понадобится при настройке расписания.</p>
                        <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">

                          <button class="btn-sm btn-outline" onclick="document.getElementById('devToken').value=[...crypto.getRandomValues(new Uint8Array(24))].map(b=>b.toString(16).padStart(2,'0')).join('')">🎲 Сгенерировать</button>
                          <button class="btn-sm btn-purple" onclick="devSaveToken(this)">Сохранить токен</button>

                        <span id="devTokMsg" style="font-size:0.85rem;"></span>
                    </div></div>`) +
                `<h3 style="margin:0.5rem 0;font-size:1rem;">Задачи</h3>
                 <div id="devTabs" style="display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.6rem;"></div>
                 <input id="devSearch" placeholder="🔍 Поиск по заголовку и тексту задачи..." value="${esc(devSearchQuery)}" oninput="setDevSearch(this.value)" style="width:100%;max-width:420px;padding:0.5rem 0.75rem;border:1.5px solid var(--a-input-border);border-radius:0.5rem;font-family:inherit;font-size:0.85rem;margin-bottom:0.75rem;background:var(--a-input-bg);color:var(--a-text);">` +
                '<div id="devTaskList"><div class="loading">Загрузка...</div></div>';
            devSetupDropzone(document.getElementById('devDrop'), document.getElementById('devFiles'), 'new');
            await devRefresh();
            devPollTimer = setInterval(() => {
                if (document.getElementById('devTaskList')) devRefresh();
                else { clearInterval(devPollTimer); devPollTimer = null; }
            }, 15000);
        }
        function devSetupDropzone(zone, input, kind){
            if (!zone || !input) return;
            zone.onclick = () => input.click();
            input.onchange = () => { devAddFiles([...input.files], kind); input.value = ''; };
            ['dragenter','dragover'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.style.background = 'var(--a-sidebar-active-bg)'; zone.style.borderColor = '#7C3AED'; }));
            ['dragleave','drop'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.style.background = 'var(--a-drop-bg)'; zone.style.borderColor = 'var(--a-drop-border)'; }));
            zone.addEventListener('drop', e => { devAddFiles([...((e.dataTransfer && e.dataTransfer.files) || [])], kind); });
            const container = zone.closest('.panel') || zone.closest('[style*="background:var(--a-panel)"]') || zone.parentElement;
            if (container) {
                container.addEventListener('paste', e => {
                    const items = e.clipboardData && e.clipboardData.items;
                    if (!items) return;
                    const files = [];
                    for (let i = 0; i < items.length; i++) {
                        if (items[i].kind === 'file') { const f = items[i].getAsFile(); if (f) files.push(f); }
                    }
                    if (files.length) { e.preventDefault(); devAddFiles(files, kind); }
                });
            }
        }
        function devFileAllowed(f){
            if (!f) return false;
            if (f.type && f.type.indexOf('image/') === 0) return true;
            return /\.(pdf|docx?|txt|rtf)$/i.test(f.name || '');
        }
        function devAddFiles(files, kind){
            const arr = kind === 'new' ? devNewFiles : devReworkFiles;

            devRenderPrev(kind);
        }
        function devRemoveFile(i, kind){
            (kind === 'new' ? devNewFiles : devReworkFiles).splice(i, 1);
            devRenderPrev(kind);
        }
        function devRenderPrev(kind){
            const arr = kind === 'new' ? devNewFiles : devReworkFiles;
            const box = document.getElementById(kind === 'new' ? 'devFilePrev' : 'devRwPrev');
            if (!box) return;
            box.innerHTML = arr.map((f, i) => {

                return `<div style="position:relative;">${inner}

                </div>`;
            }).join('');
        }
        async function devUpload(files, msgEl){
            const urls = [];
            for (let i = 0; i < files.length; i++){
                if (msgEl){ msgEl.textContent = ' загружаю фото ' + (i+1) + '/' + files.length + '...'; msgEl.style.color = 'var(--a-text-sec)'; }
                const fd = new FormData(); fd.append('file', files[i]);
                let r;
                try { r = await (await fetch(DEV_API + '?action=upload', { method:'POST', credentials:'include', body: fd })).json(); }
                catch(e){ if (msgEl){ msgEl.textContent = ' ошибка сети при загрузке фото'; msgEl.style.color = '#DC2626'; } return null; }
                if (r.ok && r.url) urls.push(r.url);
                else { if (msgEl){ msgEl.textContent = ' фото ' + (i+1) + ': ' + (r.error || 'ошибка загрузки'); msgEl.style.color = '#DC2626'; } return null; }
            }
            return urls;
        }
        async function devAdd(btn){

            if (attachments === null){ btn.disabled = false; return; }
            const r = await apiPostTo(DEV_API, 'add', { title, body, attachments });
            btn.disabled = false;
            if (r.ok){ devNewFiles = []; renderDevTasks(); }
            else { msg.textContent = r.error || 'Ошибка'; msg.style.color = '#DC2626'; }
        }

        function devCloseModal(){ const m = document.getElementById('devModal'); if (m) m.remove(); devReworkFiles = []; }
        async function devReworkSubmit(id, btn){

        // ── ИИ-ассистент: ключи живут на сервере, в репозиторий не попадают ──
        const AI_API = '/api/ai_chat.php';

        async function aiLoadConfig() {
            const st = document.getElementById('aiState');
            if (!st) return;
            try {
                const r = await fetch(AI_API + '?action=config', { credentials: 'include' });
                const d = await r.json();
                if (d.error) { st.textContent = d.error; return; }
                aiCfg = d;
                document.getElementById('aiProvider').value = d.provider || 'yandex';
                document.getElementById('aiFolder').value = d.folder_id || '';
                document.getElementById('aiSearch').checked = !!d.search_enabled;

                    : 'вставьте ключ';
                st.innerHTML = d.missing
                    ? '<span style="color:#DC2626;">Не работает: ' + esc(d.missing) + '</span>'
                    : '<span style="color:#16A34A;">Настроено — ассистент отвечает всем пользователям, у каждого своя переписка.</span>';
                aiRenderModels();
                aiSyncProvider();
            } catch (e) { st.textContent = 'Не удалось загрузить настройку: ' + e.message; }
        }

        function aiSyncProvider() {
            const p = document.getElementById('aiProvider').value;
            document.getElementById('aiFolderWrap').style.display = p === 'yandex' ? '' : 'none';
            // Поиск в интернете есть только у Яндекса — у OpenRouter такой услуги нет.
            document.getElementById('aiSearchWrap').style.display = p === 'yandex' ? '' : 'none';
        }

        function aiRenderModels() {
            const box = document.getElementById('aiModels');
            const p = document.getElementById('aiProvider').value;
            // Показываем и то, что уже включено, и то, что предлагаем по умолчанию
            const defaults = (aiCfg.defaults || {})[p] || {};
            const chosen = aiCfg.models || {};
            const all = Object.assign({}, defaults, chosen);
            box.innerHTML = Object.keys(all).map(id => {
                const on = Object.prototype.hasOwnProperty.call(chosen, id) || !Object.keys(chosen).length;
                return '<label style="display:flex;gap:0.5rem;align-items:center;font-size:0.85rem;">'
                     + '<input type="checkbox" class="ai-model" value="' + esc(id) + '" ' + (on ? 'checked' : '') + '>'
                     + '<code style="font-size:0.8rem;">' + esc(id) + '</code>'
                     + '<span class="muted">' + esc(all[id] || '') + '</span></label>';
            }).join('') || '<div class="muted" style="font-size:0.83rem;">Моделей пока нет — добавьте ниже.</div>';
        }

        function aiAddModel() {
            const inp = document.getElementById('aiNewModel');
            const id = inp.value.trim();
            if (!id) return;
            aiCfg.models = aiCfg.models || {};
            aiCfg.models[id] = id;
            inp.value = '';
            aiRenderModels();
        }

        async function aiSaveConfig() {
            const msg = document.getElementById('aiMsg');
            const models = {};
            document.querySelectorAll('.ai-model:checked').forEach(c => {
                const p = document.getElementById('aiProvider').value;
                const known = Object.assign({}, (aiCfg.defaults || {})[p] || {}, aiCfg.models || {});
                models[c.value] = known[c.value] || c.value;
            });
            if (!Object.keys(models).length) { msg.innerHTML = '<span style="color:#DC2626;">Отметьте хотя бы одну модель</span>'; return; }
            msg.textContent = 'Сохраняем…';
            try {
                const r = await fetch(AI_API + '?action=save-config', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
                    body: JSON.stringify({
                        provider: document.getElementById('aiProvider').value,
                        api_key: document.getElementById('aiKey').value.trim(),
                        folder_id: document.getElementById('aiFolder').value.trim(),
                        search_enabled: document.getElementById('aiSearch').checked,
                        models,
                    })
                });
                const d = await r.json();
                if (d.error) { msg.innerHTML = '<span style="color:#DC2626;">' + esc(d.error) + '</span>'; return; }
                document.getElementById('aiKey').value = '';
                msg.innerHTML = d.missing
                    ? '<span style="color:#DC2626;">Сохранено, но: ' + esc(d.missing) + '</span>'
                    : '<span style="color:#16A34A;">Сохранено. Нажмите «Проверить связь».</span>';
                aiLoadConfig();
            } catch (e) { msg.innerHTML = '<span style="color:#DC2626;">' + esc(e.message) + '</span>'; }
        }

        async function aiTestConfig() {
            const msg = document.getElementById('aiMsg');
            const first = document.querySelector('.ai-model:checked');
            msg.textContent = 'Спрашиваем модель…';
            try {
                const r = await fetch(AI_API + '?action=test', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
                    body: JSON.stringify({ model: first ? first.value : '' })
                });
                const d = await r.json();
                if (d.ok) {
                    msg.innerHTML = '<span style="color:#16A34A;">Связь есть. ' + esc(d.model) + ' ответила: «' + esc(d.answer) + '»</span>';
                    return;

                msg.innerHTML = '<span style="color:#DC2626;">' + esc(d.error || 'не получилось') + '</span>';
                // Яндекс в отказе называет каталог, которому принадлежит ключ — подставляем его сами

        // ── Рассылка уведомлений ──
        const ND_API = '/api/notify_dispatch.php';
        async function notifDispatchState(){
            const el = document.getElementById('ndState');
            if (!el) return;
            try {
                const d = await (await fetch(ND_API + '?action=status', { credentials:'include' })).json();
                if (!d.ok) { el.textContent = 'Состояние недоступно: ' + (d.error || ''); return; }
                const r = d.last_result || {};
                el.innerHTML = 'Последний проход: <b>' + esc(d.last_run || 'ещё не было') + '</b>'
                    + (r.sent !== undefined ? ` · отправлено ${r.sent}, пропущено ${r.skipped || 0}, ошибок ${r.failed || 0}` : '')
                    + (r.gave_up ? ` · <span style="color:#DC2626;">не доставлено после ${r.gave_up} попыток: ${r.gave_up}</span>` : '')
                    + ' · токен для cron: ' + (d.token_configured ? 'задан' : '<span style="color:#DC2626;">не задан</span>');
            } catch(e){ el.textContent = 'Не удалось получить состояние'; }
        }
        async function notifDispatchRun(dry){
            const msg = document.getElementById('ndMsg');
            msg.textContent = dry ? 'Считаем, кому бы ушло…' : 'Отправляем…';
            try {
                const d = await (await fetch(ND_API + '?action=run' + (dry ? '&dry=1' : ''), { credentials:'include' })).json();
                if (!d.ok) { msg.innerHTML = '<span style="color:#DC2626;">' + esc(d.error || 'ошибка') + '</span>'; return; }
                const r = d.result || {};
                msg.innerHTML = (dry ? 'Ушло бы: ' : 'Отправлено: ') + (r.sent || 0)
                    + ' из ' + (r.candidates || 0) + ' · пропущено ' + (r.skipped || 0)
                    + ' · ошибок ' + (r.failed || 0)
                    + (r.gave_up ? ' · сдались после ' + r.gave_up : '')
                    + (r.details && r.details.length
                        ? '<div class="muted" style="font-size:0.8rem;margin-top:0.35rem;">'
                          + r.details.slice(0, 10).map(x => esc(x.user) + ': ' + x.count + ' сообщ. → ' + x.channels.join(', ')).join('<br>')
                          + '</div>'
                        : '');
                notifDispatchState();
            } catch(e){ msg.innerHTML = '<span style="color:#DC2626;">Не удалось выполнить прогон</span>'; }
        }
        async function notifDispatchSaveToken(){

            try {
                const r = await fetch(ND_API + '?action=save-token', {
                    method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
                    body: JSON.stringify({ token })

                '<div style="padding:1.25rem;">' + status +
                    fld('ykShopId','Shop ID (идентификатор магазина)','text','000000') +
                    fld('ykSecretKey','Secret Key (секретный ключ)','password','оставьте пустым — не менять') +
                    `<label style="display:block;margin-bottom:0.7rem;"><span style="display:block;font-size:0.82rem;color:var(--a-text-sec);margin-bottom:0.25rem;font-weight:600;">Режим</span>
                     <select id="ykIsTest" style="padding:0.55rem 0.7rem;border:1.5px solid var(--a-input-border);border-radius:0.6rem;font-family:inherit;background:var(--a-input-bg);color:var(--a-text);"><option value="1"${diag.is_test!==false?' selected':''}>ТЕСТ</option><option value="0"${diag.is_test===false?' selected':''}>БОЕВОЙ</option></select></label>` +
                    fld('ykReturnUrl','Return URL (после оплаты)','text',diag.return_url||'https://psytalk.pro/payment-success.html') +

        async function saveYookassa(btn){
            const payload = {
                shop_id: document.getElementById('ykShopId').value.trim(),
                secret_key: document.getElementById('ykSecretKey').value,
                is_test: document.getElementById('ykIsTest').value === '1',
                return_url: document.getElementById('ykReturnUrl').value.trim()
            };
            const msg = document.getElementById('ykMsg');
            btn.disabled = true; msg.textContent = 'Сохраняем...'; msg.style.color = 'var(--a-text-sec)';
            try {
                const r = await fetch('/api/yookassa.php?action=save-config', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify(payload) });
                const d = await r.json();
                btn.disabled = false;
                if (d.ok) { msg.textContent = '✅ Сохранено. Обновляю статус...'; msg.style.color = '#16A34A'; setTimeout(renderYookassa, 800); }

        // ── Replacements ────────────────────────────────────────────────────

        // ── Admin notes ─────────────────────────────────────────────────────
        let notesCache = [];
        async function renderNotes(){
            let res;
            try { res = await (await fetch('/api/admin_notes.php?action=list', { credentials:'include' })).json(); }
            catch(e){ return fail(); }
            const notes = (res && res.ok) ? (res.data || []) : [];
            notesCache = notes;
            const active = notes.filter(n => !parseInt(n.is_done));
            const done = notes.filter(n => parseInt(n.is_done));

            document.getElementById('content').innerHTML =
                '<div class="note">📝 Личная записная книжка. Записки видите только вы. Удобно для TODO, заметок к себе, идей по улучшению платформы.' +
                (overdueCount ? ` <b style="color:#DC2626;">⏰ Просрочено: ${overdueCount}</b>` : '') + '</div>' +
                `<div class="panel" style="margin-bottom:1.25rem;">
                    <div class="panel-head"><h2>Новая записка</h2></div>
                    <div style="padding:1rem;">
                        <input id="noteTitle" placeholder="Заголовок" style="width:100%;padding:0.55rem 0.8rem;border:1.5px solid var(--a-input-border);border-radius:0.6rem;font-family:inherit;margin-bottom:0.5rem;background:var(--a-input-bg);color:var(--a-text);">
                        <textarea id="noteBody" rows="3" placeholder="Текст записки..." style="width:100%;padding:0.6rem 0.8rem;border:1.5px solid var(--a-input-border);border-radius:0.6rem;font-family:inherit;font-size:0.9rem;resize:vertical;background:var(--a-input-bg);color:var(--a-text);"></textarea>
                        <div style="display:flex;gap:0.5rem;align-items:center;margin-top:0.5rem;flex-wrap:wrap;">
                            <label style="font-size:0.82rem;color:var(--a-text-sec);display:flex;align-items:center;gap:0.35rem;">Срок:
                                <input id="noteDueDate" type="date" style="padding:0.35rem 0.5rem;border:1.5px solid var(--a-input-border);border-radius:0.5rem;font-family:inherit;background:var(--a-input-bg);color:var(--a-text);">
                            </label>
                            <label style="font-size:0.82rem;color:var(--a-text-sec);display:flex;align-items:center;gap:0.35rem;">Время:
                                <input id="noteDueTime" type="time" style="padding:0.35rem 0.5rem;border:1.5px solid var(--a-input-border);border-radius:0.5rem;font-family:inherit;background:var(--a-input-bg);color:var(--a-text);">

                    </div>

                '<div id="notesList"></div>';

        }

        function noteDueBadge(n){
            if (!n.due_date) return '';
            const over = n.is_overdue == 1 || n.is_overdue === true;
            const when = esc(n.due_date) + (n.due_time ? ', ' + esc(String(n.due_time).slice(0,5)) : '');
            return `<span class="note-card-due ${over ? 'due-over' : 'due-ok'}">${over ? '⏰ просрочено · ' : '📅 срок: '}${when}</span>`;
        }

        function noteCardHtml(n){
            const isDone = parseInt(n.is_done);
            const over = !isDone && (n.is_overdue == 1 || n.is_overdue === true);
            return `<div class="note-card ${isDone ? 'is-done' : ''} ${over ? 'is-overdue' : ''}" id="noteCard-${n.id}">
                <div class="note-card-check">
                    <input type="checkbox" ${isDone ? 'checked' : ''} onchange="toggleNoteDone(${n.id}, this.checked)">
