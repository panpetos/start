<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сообщения - psytalk.pro</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://meet.jit.si/external_api.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f7fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #7C3AED 0%, #9F67FA 100%);
            padding: 1rem 2rem;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header a {
            color: white;
            text-decoration: none;
            opacity: 0.9;
        }

        .header a:hover {
            opacity: 1;
        }

        .chat-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .conversations-list {
            width: 320px;
            background: white;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
        }

        .conversation-item {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
        }

        .conversation-item:hover {
            background: #f8f9fa;
        }

        .conversation-item.active {
            background: #F3E8FF;
        }

        .conversation-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            flex-shrink: 0;
            overflow: hidden;
        }

        .conversation-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .conversation-info {
            flex: 1;
            min-width: 0;
        }

        .conversation-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 0.25rem;
        }

        .conversation-preview {
            font-size: 0.9rem;
            color: #999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-meta {
            text-align: right;
        }

        .conversation-time {
            font-size: 0.8rem;
            color: #999;
        }

        .unread-badge {
            background: #7C3AED;
            color: white;
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 10px;
            margin-top: 0.25rem;
            display: inline-block;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f5f7fa;
        }

        .chat-header {
            background: white;
            padding: 1rem;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .chat-header .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            overflow: hidden;
        }

        .chat-header .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-header .name {
            font-weight: 600;
            color: #333;
        }

        .chat-header .role {
            font-size: 0.9rem;
            color: #666;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .message {
            max-width: 70%;
            padding: 0.75rem 1rem;
            border-radius: 16px;
            word-wrap: break-word;
        }

        .message.mine {
            background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.theirs {
            background: white;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .message-time {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-top: 0.25rem;
        }

        .chat-input {
            background: white;
            padding: 1rem;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 1rem;
        }

        .chat-input input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            font-size: 1rem;
            outline: none;
        }

        .chat-input input:focus {
            border-color: #7C3AED;
        }

        .chat-input button {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .chat-input button:hover {
            transform: scale(1.05);
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #f0f0f0;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: #e0e0e0;
            transform: scale(1.1);
        }

        .emoji-picker {
            position: absolute;
            bottom: 70px;
            left: 10px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.3);
            padding: 16px;
            z-index: 100;
            width: 340px;
            overflow: hidden;
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 36px);
            gap: 2px;
            justify-content: center;
        }

        .emoji-grid span {
            font-size: 1.5rem;
            padding: 5px;
            cursor: pointer;
            border-radius: 6px;
            text-align: center;
            transition: background 0.2s;
        }

        .emoji-grid span:hover {
            background: #f0f0f0;
        }

        .file-preview {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .file-preview img {
            max-width: 100px;
            max-height: 60px;
            border-radius: 4px;
        }

        .message-attachment {
            margin-top: 8px;
        }

        .message-attachment img {
            max-width: 250px;
            max-height: 200px;
            border-radius: 8px;
            cursor: pointer;
        }

        .message-attachment a {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #7C3AED;
            text-decoration: none;
        }

        /* Voice Recording UI */
        .voice-recording {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #f0f0f0;
            border-radius: 24px;
            margin: 8px 0;
        }

        .recording-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .recording-dot {
            width: 12px;
            height: 12px;
            background: #e94560;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .btn-cancel {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: #ccc;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-send-voice {
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%);
            color: white;
            cursor: pointer;
            font-weight: 500;
        }

        /* Voice Message Player */
        .voice-message {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(124, 58, 237, 0.1);
            border-radius: 16px;
            min-width: 200px;
        }

        .voice-play-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .voice-waveform {
            flex: 1;
            height: 30px;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .voice-waveform span {
            width: 3px;
            background: #7C3AED;
            border-radius: 2px;
            opacity: 0.6;
        }

        .voice-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            font-size: 12px;
            color: #888;
        }

        .voice-duration {
            font-weight: 500;
            color: #333;
        }

        /* Dashboard Button */
        .dashboard-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.3);
            color: white;
            text-decoration: none;
        }

        .dashboard-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
        }

        /* Video Call Button */
        .video-call-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00c853 0%, #00e676 100%);
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0, 200, 83, 0.3);
        }

        .video-call-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(0, 200, 83, 0.4);
        }

        /* Video Call Modal */
        .video-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .video-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: #1a1a2e;
            color: white;
        }

        .video-modal-header h3 {
            margin: 0;
            font-size: 1.2rem;
        }

        .video-modal-close {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e94560;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-modal-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-modal-body iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            text-align: center;
        }

        .no-conversations {
            padding: 2rem;
            text-align: center;
            color: #999;
        }

        .chat-back-btn {
            display: none;
            width: 40px; height: 40px; border-radius: 50%;
            background: #f0f0f0; border: none; cursor: pointer;
            align-items: center; justify-content: center; font-size: 1.25rem; color: #333;
            flex-shrink: 0; margin-right: 0.25rem;
        }

        @media (max-width: 768px) {
            .conversations-list {
                width: 100%;
            }
            .chat-area {
                display: none;
            }
            /* Когда открыт диалог — показываем чат на весь экран, список прячем */
            .chat-container.mobile-chat-open .conversations-list { display: none; }
            .chat-container.mobile-chat-open .chat-area { display: flex; }
            .chat-back-btn { display: flex; }
        }
    </style>
</head>

<body>
    <div class="chat-container" style="height:100vh;">
        <div class="conversations-list" id="conversationsList">
            <div class="no-conversations">Загрузка...</div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="empty-state" id="emptyState">
                <div>
                    <i data-lucide="message-square" style="width: 64px; height: 64px; opacity: 0.3;"></i>
                    <p style="margin-top: 1rem;">Выберите диалог для начала общения</p>
                </div>
            </div>

            <div id="chatContent" style="display: none; flex-direction: column; height: 100%;">
                <div class="chat-header" id="chatHeader"></div>
                <div class="messages-container" id="messagesContainer"></div>
                <div class="chat-input">
                    <button type="button" onclick="toggleEmojiPicker()" class="icon-btn" title="Эмодзи">😊</button>
                    <label class="icon-btn" title="Прикрепить файл">
                        📎
                        <input type="file" id="fileInput" style="display:none;" onchange="handleFileSelect(event)"
                            accept="image/*,.pdf,.doc,.docx,.txt">
                    </label>
                    <button type="button" id="voiceBtn" onclick="toggleVoiceRecording()" class="icon-btn"
                        title="Голосовое сообщение">🎤</button>
                    <input type="text" id="messageInput" placeholder="Введите сообщение..."
                        onkeypress="if(event.key==='Enter') sendMessage()">
                    <button onclick="sendMessage()">
                        <i data-lucide="send" style="width: 20px; height: 20px;"></i>
                    </button>
                </div>
                <!-- Запись голоса -->
                <div id="voiceRecording" class="voice-recording" style="display:none;">
                    <div class="recording-indicator">
                        <span class="recording-dot"></span>
                        <span id="recordingTime">00:00</span>
                    </div>
                    <button onclick="cancelVoiceRecording()" class="btn-cancel">✕</button>
                    <button onclick="sendVoiceMessage()" class="btn-send-voice">Отправить</button>
                </div>
                <!-- Emoji Picker -->
                <div id="emojiPicker" class="emoji-picker" style="display:none;">
                    <div class="emoji-grid">
                        <span onclick="insertEmoji('😊')">😊</span>
                        <span onclick="insertEmoji('😂')">😂</span>
                        <span onclick="insertEmoji('🥰')">🥰</span>
                        <span onclick="insertEmoji('😍')">😍</span>
                        <span onclick="insertEmoji('🤗')">🤗</span>
                        <span onclick="insertEmoji('😎')">😎</span>
                        <span onclick="insertEmoji('🙏')">🙏</span>
                        <span onclick="insertEmoji('👍')">👍</span>
                        <span onclick="insertEmoji('👋')">👋</span>
                        <span onclick="insertEmoji('❤️')">❤️</span>
                        <span onclick="insertEmoji('💜')">💜</span>
                        <span onclick="insertEmoji('💙')">💙</span>
                        <span onclick="insertEmoji('🔥')">🔥</span>
                        <span onclick="insertEmoji('✨')">✨</span>
                        <span onclick="insertEmoji('🎉')">🎉</span>
                        <span onclick="insertEmoji('💪')">💪</span>
                        <span onclick="insertEmoji('🤔')">🤔</span>
                        <span onclick="insertEmoji('😢')">😢</span>
                        <span onclick="insertEmoji('😅')">😅</span>
                        <span onclick="insertEmoji('🥺')">🥺</span>
                        <span onclick="insertEmoji('😇')">😇</span>
                        <span onclick="insertEmoji('🤩')">🤩</span>
                        <span onclick="insertEmoji('😌')">😌</span>
                        <span onclick="insertEmoji('💯')">💯</span>
                        <span onclick="insertEmoji('🙌')">🙌</span>
                        <span onclick="insertEmoji('👏')">👏</span>
                        <span onclick="insertEmoji('🤝')">🤝</span>
                        <span onclick="insertEmoji('💕')">💕</span>
                        <span onclick="insertEmoji('🌟')">🌟</span>
                        <span onclick="insertEmoji('☀️')">☀️</span>
                        <span onclick="insertEmoji('🌈')">🌈</span>
                        <span onclick="insertEmoji('🍀')">🍀</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Video Call Modal -->
    <div id="videoModal" class="video-modal" style="display:none;">
        <div class="video-modal-header">
            <h3 id="videoCallTitle">📹 Видеозвонок</h3>
            <div style="display:flex;align-items:center;gap:0.75rem;">
                <a id="videoFallbackLink" href="#" target="_blank" rel="noopener"
                   style="color:#fff;opacity:0.85;font-size:0.85rem;text-decoration:underline;white-space:nowrap;"
                   title="Если видео не загрузилось — открыть в новой вкладке">Открыть в новой вкладке ↗</a>
                <button onclick="endVideoCall()" class="video-modal-close">✕</button>
            </div>
        </div>
        <div class="video-modal-body" id="jitsiContainer">
            <!-- Jitsi iframe будет здесь -->
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/header.js"></script>
    <script>
        let currentUser = null;
        let selectedUserId = null;
        let pollInterval = null;
        let isAdminMode = false;  // Режим отправки от имени техподдержки

        function getDashboardUrl() {
            if (!currentUser) return '/login.html';
            if (currentUser.role === 'psychologist') return '/psychologist-dashboard.html';
            if (currentUser.role === 'admin') return '/admin.html';
            return '/client-dashboard.html';
        }

        async function init() {
            if (!window.Auth || !window.Auth.getCurrentUser) {
                window.location.href = '/login.html';
                return;
            }

            currentUser = await window.Auth.getCurrentUser();
            if (!currentUser) {
                window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
                return;
            }

            // Проверяем параметры URL
            const urlParams = new URLSearchParams(window.location.search);
            const userIdFromUrl = urlParams.get('user');
            isAdminMode = urlParams.get('admin') === '1' && currentUser.role === 'admin';

            await loadConversations();

            // Автоматически открыть чат если есть user в URL
            if (userIdFromUrl) {
                await startNewChat(userIdFromUrl);
            }

            if (typeof lucide !== 'undefined') {
                try { lucide.createIcons(); } catch(e) {}
            }
        }

        // Начать новый чат с пользователем (даже если нет истории)
        async function startNewChat(userId) {
            selectedUserId = userId;

            // Получить информацию о пользователе
            try {
                const response = await fetch(`/api/users.php?action=get&id=${userId}`, {
                    credentials: 'include'
                });
                const result = await response.json();
                const userData = result.data || result; // Поддержка обоих форматов

                if (userData && !result.error) {
                    const name = `${userData.first_name || ''} ${userData.last_name || ''}`.trim() || 'Пользователь';
                    const roleText = userData.role === 'psychologist' ? 'Психолог' : 'Клиент';

                    document.getElementById('chatHeader').innerHTML = `
                        <button class="chat-back-btn" onclick="goBackToList()" title="Назад к диалогам">←</button>
                        <div class="avatar">
                            ${userData.avatar ? `<img src="${userData.avatar}" alt="${name}">` : name.charAt(0)}
                        </div>
                        <div style="flex:1;">
                            <div class="name">${name}</div>
                            <div class="role">${roleText}</div>
                        </div>
                        <a href="${getDashboardUrl()}" class="dashboard-btn" title="Личный кабинет">
                            <i data-lucide="layout-grid" style="width: 20px; height: 20px;"></i>
                        </a>
                    `;
                }
            } catch (error) {
                console.error('Error loading user data:', error);
            }

            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('chatContent').style.display = 'flex';
            document.querySelector('.chat-container').classList.add('mobile-chat-open');

            await loadMessages();

            // Запустить polling
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(loadMessages, 5000);
        }

        async function loadConversations() {
            try {
                const response = await fetch('/api/messages.php?action=conversations', {
                    credentials: 'include'
                });
                const conversations = await response.json();

                const container = document.getElementById('conversationsList');

                if (!conversations || conversations.length === 0) {
                    container.innerHTML = `
                        <div class="no-conversations">
                            <p>У вас пока нет диалогов</p>
                            <p style="font-size: 0.9rem; margin-top: 0.5rem;">Диалоги появятся после записи на консультацию</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = conversations.map(c => {
                    const name = `${c.first_name || ''} ${c.last_name || ''}`.trim() || 'Пользователь';
                    const initial = name.charAt(0).toUpperCase();
                    const preview = c.is_mine ? `Вы: ${c.last_message}` : c.last_message;
                    const time = formatTime(c.last_message_time);

                    return `
                        <div class="conversation-item ${c.user_id === selectedUserId ? 'active' : ''}" 
                             onclick="openChat('${c.user_id}')">
                            <div class="conversation-avatar">
                                ${c.avatar ? `<img src="${c.avatar}" alt="${name}">` : initial}
                            </div>
                            <div class="conversation-info">
                                <div class="conversation-name">${name}</div>
                                <div class="conversation-preview">${preview.substring(0, 40)}${preview.length > 40 ? '...' : ''}</div>
                            </div>
                            <div class="conversation-meta">
                                <div class="conversation-time">${time}</div>
                                ${c.unread_count > 0 ? `<span class="unread-badge">${c.unread_count}</span>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Load conversations error:', error);
            }
        }

        function goBackToList() {
            document.querySelector('.chat-container').classList.remove('mobile-chat-open');
        }

        async function openChat(userId) {
            selectedUserId = userId;

            // Обновить активный элемент
            document.querySelectorAll('.conversation-item').forEach(el => {
                el.classList.toggle('active', el.onclick.toString().includes(userId));
            });

            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('chatContent').style.display = 'flex';
            document.querySelector('.chat-container').classList.add('mobile-chat-open');

            await loadMessages();

            // Запустить polling
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(loadMessages, 5000);
        }

        async function loadMessages() {
            if (!selectedUserId) return;

            try {
                // Загрузить данные пользователя
                const convResponse = await fetch('/api/messages.php?action=conversations', {
                    credentials: 'include'
                });
                const conversations = await convResponse.json();
                const otherUser = conversations.find(c => c.user_id === selectedUserId);

                if (otherUser) {
                    const name = `${otherUser.first_name || ''} ${otherUser.last_name || ''}`.trim() || 'Пользователь';
                    const roleText = otherUser.role === 'psychologist' ? 'Психолог' : 'Клиент';

                    document.getElementById('chatHeader').innerHTML = `
                        <button class="chat-back-btn" onclick="goBackToList()" title="Назад к диалогам">←</button>
                        <div class="avatar">
                            ${otherUser.avatar ? `<img src="${otherUser.avatar}" alt="${name}">` : name.charAt(0)}
                        </div>
                        <div style="flex:1;">
                            <div class="name">${name}</div>
                            <div class="role">${roleText}</div>
                        </div>
                        <a href="${getDashboardUrl()}" class="dashboard-btn" title="Личный кабинет">
                            <i data-lucide="layout-grid" style="width: 20px; height: 20px;"></i>
                        </a>
                        <button onclick="startVideoCall()" class="video-call-btn" title="Видеозвонок">
                            📹
                        </button>
                    `;
                }

                // Загрузить сообщения
                const response = await fetch(`/api/messages.php?action=list&with_user=${selectedUserId}`, {
                    credentials: 'include'
                });
                const messages = await response.json();

                const container = document.getElementById('messagesContainer');
                const wasScrolledToBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 50;

                container.innerHTML = messages.map(m => {
                    // Для админа: сообщения от support тоже считаются "своими"
                    const isMine = m.sender_id === currentUser.id ||
                        (isAdminMode && (m.sender_id === 'support' || m.sender_first_name === 'Техподдержка'));
                    const time = formatTime(m.created_at);

                    // Рендер вложения
                    let attachmentHtml = '';
                    if (m.attachment_url) {
                        if (m.attachment_type === 'voice') {
                            // Голосовое сообщение с плеером
                            const msgId = m.id || Math.random().toString(36);
                            attachmentHtml = `
                                <div class="voice-message" data-audio="${m.attachment_url}" data-id="${msgId}">
                                    <button class="voice-play-btn" onclick="toggleVoicePlay('${msgId}', '${m.attachment_url}')">▶</button>
                                    <div class="voice-waveform" id="waveform-${msgId}">${generateWaveform()}</div>
                                    <div class="voice-info">
                                        <span class="voice-duration">${m.attachment_name || '00:00'}</span>
                                    </div>
                                    <audio id="audio-${msgId}" src="${m.attachment_url}" style="display:none;"></audio>
                                </div>
                            `;
                        } else if (m.attachment_type === 'image') {
                            attachmentHtml = `
                                <div class="message-attachment">
                                    <a href="${m.attachment_url}" target="_blank">
                                        <img src="${m.attachment_url}" alt="${m.attachment_name || 'Изображение'}">
                                    </a>
                                </div>
                            `;
                        } else {
                            attachmentHtml = `
                                <div class="message-attachment">
                                    <a href="${m.attachment_url}" target="_blank" download="${m.attachment_name || 'file'}">
                                        📄 ${m.attachment_name || 'Скачать файл'}
                                    </a>
                                </div>
                            `;
                        }
                    }

                    // Не показывать "[Файл: ...]" или "[Голосовое сообщение: ...]" если есть вложение
                    const content = m.attachment_url && (m.content.startsWith('[Файл:') || m.content.startsWith('[Голосовое')) ? '' : escapeHtml(m.content);

                    return `
                        <div class="message ${isMine ? 'mine' : 'theirs'}">
                            ${content ? `<div>${content}</div>` : ''}
                            ${attachmentHtml}
                            <div class="message-time">${time}</div>
                        </div>
                    `;
                }).join('');

                if (wasScrolledToBottom) {
                    container.scrollTop = container.scrollHeight;
                }

                // Обновить список диалогов
                await loadConversations();

            } catch (error) {
                console.error('Load messages error:', error);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();

            if (!content || !selectedUserId) return;

            input.value = '';

            try {
                const messageData = {
                    receiver_id: selectedUserId,
                    content: content
                };

                // Если админ в режиме поддержки - отправляем от имени support
                if (isAdminMode) {
                    messageData.as_support = true;
                }

                await fetch('/api/messages.php?action=send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(messageData)
                });

                await loadMessages();

                const container = document.getElementById('messagesContainer');
                container.scrollTop = container.scrollHeight;

            } catch (error) {
                console.error('Send message error:', error);
            }
        }

        function formatTime(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            const now = new Date();
            const diffDays = Math.floor((now - date) / (1000 * 60 * 60 * 24));

            if (diffDays === 0) {
                return date.toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
            } else if (diffDays === 1) {
                return 'Вчера';
            } else {
                return date.toLocaleDateString('ru', { day: 'numeric', month: 'short' });
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Emoji функции
        function toggleEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            picker.style.display = picker.style.display === 'none' ? 'block' : 'none';
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('messageInput');
            input.value += emoji;
            input.focus();
            toggleEmojiPicker();
        }

        // Закрыть emoji picker при клике вне его
        document.addEventListener('click', (e) => {
            const picker = document.getElementById('emojiPicker');
            const emojiBtn = e.target.closest('.icon-btn');
            if (picker && picker.style.display !== 'none' && !picker.contains(e.target) && !emojiBtn) {
                picker.style.display = 'none';
            }
        });

        // === ГОЛОСОВЫЕ СООБЩЕНИЯ ===
        let mediaRecorder = null;
        let audioChunks = [];
        let recordingStartTime = null;
        let recordingTimer = null;

        async function toggleVoiceRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                // Уже идёт запись - остановить
                mediaRecorder.stop();
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    audioChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    stream.getTracks().forEach(track => track.stop());
                    clearInterval(recordingTimer);
                };

                mediaRecorder.start();
                recordingStartTime = Date.now();

                // Показать UI записи
                document.getElementById('voiceRecording').style.display = 'flex';
                document.querySelector('.chat-input').style.display = 'none';
                document.getElementById('voiceBtn').style.background = '#e94560';

                // Таймер
                recordingTimer = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
                    const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
                    const secs = (elapsed % 60).toString().padStart(2, '0');
                    document.getElementById('recordingTime').textContent = `${mins}:${secs}`;
                }, 1000);

            } catch (error) {
                console.error('Microphone access error:', error);
                alert('Не удалось получить доступ к микрофону');
            }
        }

        function cancelVoiceRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
            audioChunks = [];
            hideVoiceRecording();
        }

        function hideVoiceRecording() {
            document.getElementById('voiceRecording').style.display = 'none';
            document.querySelector('.chat-input').style.display = 'flex';
            document.getElementById('voiceBtn').style.background = '';
            document.getElementById('recordingTime').textContent = '00:00';
            clearInterval(recordingTimer);
        }

        async function sendVoiceMessage() {
            if (!mediaRecorder) {
                hideVoiceRecording();
                return;
            }

            // Ждём корректного завершения записи через Promise
            if (mediaRecorder.state === 'recording') {
                await new Promise(resolve => {
                    mediaRecorder.onstop = () => {
                        resolve();
                    };
                    mediaRecorder.stop();
                });
            }

            // Дополнительная пауза для буферизации
            await new Promise(resolve => setTimeout(resolve, 200));

            if (audioChunks.length === 0) {
                hideVoiceRecording();
                return;
            }

            const audioBlob = new Blob(audioChunks, { type: 'audio/webm;codecs=opus' });
            const duration = Math.floor((Date.now() - recordingStartTime) / 1000);

            hideVoiceRecording();

            // Загрузить аудио файл
            const formData = new FormData();
            formData.append('file', audioBlob, `voice_${Date.now()}.webm`);

            try {
                const uploadResponse = await fetch('/api/upload.php', {
                    method: 'POST',
                    credentials: 'include',
                    body: formData
                });

                const uploadResult = await uploadResponse.json();

                if (uploadResult.error) {
                    alert(uploadResult.error);
                    return;
                }

                // Отправить сообщение с голосовым
                const messageData = {
                    receiver_id: selectedUserId,
                    content: `[Голосовое сообщение: ${formatDuration(duration)}]`,
                    attachment_url: uploadResult.url,
                    attachment_type: 'voice',
                    attachment_name: `${formatDuration(duration)}`
                };

                if (isAdminMode) {
                    messageData.as_support = true;
                }

                await fetch('/api/messages.php?action=send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(messageData)
                });

                await loadMessages();
                const container = document.getElementById('messagesContainer');
                container.scrollTop = container.scrollHeight;

            } catch (error) {
                console.error('Voice message error:', error);
                alert('Ошибка отправки голосового сообщения');
            }
        }

        function formatDuration(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        // Генерация волны для плеера
        function generateWaveform() {
            let bars = '';
            for (let i = 0; i < 30; i++) {
                const height = 5 + Math.random() * 20;
                bars += `<span style="height:${height}px;"></span>`;
            }
            return bars;
        }

        // Воспроизведение голосового сообщения
        let currentPlayingAudio = null;

        function toggleVoicePlay(msgId, audioUrl) {
            const audio = document.getElementById(`audio-${msgId}`);
            const btn = document.querySelector(`[onclick="toggleVoicePlay('${msgId}', '${audioUrl}')"]`);

            if (!audio) return;

            if (currentPlayingAudio && currentPlayingAudio !== audio) {
                currentPlayingAudio.pause();
                currentPlayingAudio.currentTime = 0;
                // Reset previous button
                document.querySelectorAll('.voice-play-btn').forEach(b => b.textContent = '▶');
            }

            if (audio.paused) {
                audio.play();
                btn.textContent = '⏸';
                currentPlayingAudio = audio;

                audio.onended = () => {
                    btn.textContent = '▶';
                    currentPlayingAudio = null;
                };
            } else {
                audio.pause();
                btn.textContent = '▶';
                currentPlayingAudio = null;
            }
        }

        // === ЗАГРУЗКА ФАЙЛОВ ===
        let pendingFile = null;

        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Проверка размера (5MB max)
            if (file.size > 5 * 1024 * 1024) {
                alert('Файл слишком большой. Максимальный размер: 5MB');
                return;
            }

            // Загрузить файл
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/upload.php', {
                    method: 'POST',
                    credentials: 'include',
                    body: formData
                });

                const result = await response.json();

                if (result.error) {
                    alert(result.error);
                    return;
                }

                // Отправить сообщение с прикреплённым файлом
                const messageData = {
                    receiver_id: selectedUserId,
                    content: `[Файл: ${file.name}]`,
                    attachment_url: result.url,
                    attachment_type: file.type.startsWith('image/') ? 'image' : 'file',
                    attachment_name: file.name
                };

                if (isAdminMode) {
                    messageData.as_support = true;
                }

                await fetch('/api/messages.php?action=send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(messageData)
                });

                await loadMessages();

                const container = document.getElementById('messagesContainer');
                container.scrollTop = container.scrollHeight;

            } catch (error) {
                console.error('File upload error:', error);
                alert('Ошибка загрузки файла');
            }

            // Очистить input
            event.target.value = '';
        }

        // === ВИДЕОЗВОНКИ JITSI MEET (External API) ===
        let jitsiApi = null;
        let currentCallId = null;
        let callStartTime = null;
        let currentRoomName = null;

        // Детерминированное имя комнаты: оба участника попадают в одну и ту же.
        function buildRoomName() {
            const pair = [String(currentUser.id), String(selectedUserId)].sort().join('-');
            const day = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            return ('psytalk-' + pair + '-' + day).replace(/[^a-zA-Z0-9-]/g, '');
        }

        async function startVideoCall() {
            if (!selectedUserId) {
                alert('Выберите собеседника для звонка');
                return;
            }

            const roomName = buildRoomName();
            currentRoomName = roomName;
            const roomUrl = 'https://meet.jit.si/' + roomName;

            // Записать начало звонка в базу (не критично, если упадёт)
            try {
                const startResponse = await fetch('/api/calls.php?action=start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ participant_id: selectedUserId, room_name: roomName })
                });
                const startResult = await startResponse.json();
                if (startResult.call_id) {
                    currentCallId = startResult.call_id;
                    callStartTime = Date.now();
                }
            } catch (e) { console.error('Call start tracking error:', e); }
            if (!callStartTime) callStartTime = Date.now();

            // Показать модальное окно и ссылку-фолбэк
            document.getElementById('videoModal').style.display = 'flex';
            const fallback = document.getElementById('videoFallbackLink');
            if (fallback) fallback.href = roomUrl;

            const container = document.getElementById('jitsiContainer');
            container.innerHTML = '';

            // Предпочтительно — External API (надёжнее, без жёсткого лимита времени)
            if (typeof JitsiMeetExternalAPI !== 'undefined') {
                try {
                    jitsiApi = new JitsiMeetExternalAPI('meet.jit.si', {
                        roomName: roomName,
                        parentNode: container,
                        width: '100%',
                        height: '100%',
                        userInfo: { displayName: (currentUser.first_name || 'Пользователь') + ' ' + (currentUser.last_name || '') },
                        configOverwrite: {
                            prejoinPageEnabled: false,
                            disableDeepLinking: true,
                            startWithAudioMuted: false,
                            startWithVideoMuted: false,
                            enableClosePage: false
                        },
                        interfaceConfigOverwrite: {
                            SHOW_JITSI_WATERMARK: false,
                            SHOW_WATERMARK_FOR_GUESTS: false,
                            SHOW_BRAND_WATERMARK: false,
                            DISABLE_DEEP_LINKING: true,
                            MOBILE_APP_PROMO: false
                        }
                    });
                    jitsiApi.addEventListener('readyToClose', function () { endVideoCall(); });
                } catch (e) {
                    console.error('Jitsi External API error, falling back to iframe:', e);
                    container.innerHTML =
                        '<iframe src="' + roomUrl + '#config.prejoinPageEnabled=false&config.disableDeepLinking=true" ' +
                        'allow="camera; microphone; fullscreen; display-capture; autoplay" ' +
                        'style="width:100%;height:100%;border:0;"></iframe>';
                }
            } else {
                // SDK не загрузился — обычный iframe
                container.innerHTML =
                    '<iframe src="' + roomUrl + '#config.prejoinPageEnabled=false&config.disableDeepLinking=true" ' +
                    'allow="camera; microphone; fullscreen; display-capture; autoplay" ' +
                    'style="width:100%;height:100%;border:0;"></iframe>';
            }

            // Отправить приглашение со ссылкой (собеседник присоединится в ту же комнату)
            const inviteMessage = {
                receiver_id: selectedUserId,
                content: '📹 Я начал(а) видеозвонок. Присоединяйтесь: ' + roomUrl
            };
            if (isAdminMode) inviteMessage.as_support = true;

            try {
                await fetch('/api/messages.php?action=send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(inviteMessage)
                });
                await loadMessages();
            } catch (e) { console.error('Invite send error:', e); }
        }

        async function endVideoCall() {
            // Записать завершение звонка
            if (currentCallId) {
                try {
                    const duration = callStartTime ? Math.floor((Date.now() - callStartTime) / 1000) : 0;

                    await fetch('/api/calls.php?action=end', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ call_id: currentCallId })
                    });

                    // Отправить сообщение о завершении
                    if (selectedUserId && duration > 5) {
                        const mins = Math.floor(duration / 60);
                        const secs = duration % 60;
                        const durationStr = `${mins}:${secs.toString().padStart(2, '0')}`;

                        await fetch('/api/messages.php?action=send', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify({
                                receiver_id: selectedUserId,
                                content: `📞 Видеозвонок завершён. Длительность: ${durationStr}`,
                                as_support: isAdminMode
                            })
                        });
                        await loadMessages();
                    }
                } catch (e) {
                    console.error('Call end tracking error:', e);
                }
            }

            if (jitsiApi) { try { jitsiApi.dispose(); } catch (e) {} jitsiApi = null; }
            document.getElementById('videoModal').style.display = 'none';
            document.getElementById('jitsiContainer').innerHTML = '';
            currentCallId = null;
            callStartTime = null;
            currentRoomName = null;
        }

        init();
    </script>
</body>
