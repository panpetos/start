<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - psytalk.pro</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/layout.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #F4F0FF;
            min-height: 100vh;
            padding: 0;
            padding-top: 84px;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }

        .header {
            background: white; border-radius: 1.25rem; padding: 1.75rem 2rem;
            margin-bottom: 1.75rem;
            box-shadow: 0 4px 20px rgba(124,58,237,0.1);
            border: 1px solid #EDE9FF;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header-left h1 { color: #1A1A1A; font-size: 1.75rem; margin-bottom: 0.25rem; letter-spacing: -0.02em; }
        .header-left p { color: #6B7280; font-size: 0.9375rem; }

        .user-info { display: flex; align-items: center; gap: 0.875rem; }
        .user-avatar {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(135deg, #7C3AED 0%, #9F67FA 100%);
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 700; font-size: 1.125rem; overflow: hidden;
            box-shadow: 0 4px 12px rgba(124,58,237,0.3);
        }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }

        .card {
            background: white; border-radius: 1.25rem; padding: 1.75rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: 1px solid #F0ECF8;
            transition: box-shadow 0.2s, transform 0.2s;
        }
        .card:hover { box-shadow: 0 8px 30px rgba(124,58,237,0.12); transform: translateY(-2px); }
        .card h2 {
            color: #7C3AED; margin-bottom: 1rem; font-size: 1.125rem;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .card p { color: #6B7280; line-height: 1.6; }

        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.625rem 1.375rem;
            background: linear-gradient(135deg, #7C3AED 0%, #9F67FA 100%);
            color: white; text-decoration: none; border-radius: 0.625rem;
            font-weight: 600; font-size: 0.9375rem; transition: all 0.2s;
            border: none; cursor: pointer; font-family: inherit;
            box-shadow: 0 3px 10px rgba(124,58,237,0.3);
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(124,58,237,0.4); color: white; }

        .appointments-list { margin-top: 1rem; }
        .appointment-item {
            background: #FAFAFA; padding: 1rem; border-radius: 0.875rem;
            margin-bottom: 0.625rem; display: flex; flex-wrap: wrap;
            justify-content: space-between; align-items: center; gap: 0.75rem;
            border: 1px solid #F0F0F0; transition: border-color 0.2s;
        }
        .appointment-item:hover { border-color: #EDE9FF; }
        .appointment-info { flex: 1; min-width: 120px; word-break: break-word; }
        .appointment-psychologist { font-weight: 600; color: #1A1A1A; margin-bottom: 0.2rem; font-size: 0.9375rem; }
        .appointment-datetime { font-size: 0.8125rem; color: #6B7280; }
        .appointment-status { padding: 0.2rem 0.75rem; border-radius: 2rem; font-size: 0.75rem; font-weight: 600; }
        .status-scheduled { background: #F3E8FF; color: #7C3AED; }
        .status-completed { background: #F0FDF4; color: #16A34A; }
        .status-cancelled { background: #FFF1F2; color: #BE123C; }
        .appointment-actions { display: flex; gap: 0.5rem; }
        .btn-small { padding: 0.4rem 0.875rem; font-size: 0.8125rem; }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: none; }
        .btn-outline {
            background: white; border: 1.5px solid #E2E8F0; color: #374151;
            box-shadow: none;
        }
        .btn-outline:hover { border-color: #7C3AED; color: #7C3AED; background: #FAF5FF; }
        .empty-state { text-align: center; padding: 2rem; color: #9CA3AF; }
        .loading { text-align: center; color: #9CA3AF; padding: 1rem; }
    </style>
</head>

<body>
    <script>psyWriteHeader();</script>
    <div class="container">
        <!-- Dashboard Content -->
        <div class="header">
            <div class="header-left">
                <h1>Личный кабинет</h1>
                <p>Управление записями и профилем</p>
            </div>
            <div class="user-info">
                <a href="/edit-profile.html" class="btn btn-outline btn-small" title="Настройки профиля">⚙ Профиль</a>
                <button class="btn btn-outline btn-small" onclick="psyLogout()" title="Выйти из аккаунта">Выйти →</button>
                <span id="userName" style="font-weight: 600;">Загрузка...</span>
                <div class="user-avatar" id="userAvatar">
                    <img src="" alt="" style="display: none;">
                    <span id="userInitial">?</span>
                </div>
            </div>
        </div>

        <div class="cards">
            <div class="card" id="packagesCard" style="grid-column: 1 / -1; display: none;">
                <h2>
                    <i data-lucide="ticket" style="width: 24px; height: 24px;"></i>
                    Мои абонементы
                </h2>
                <div id="packagesList" class="appointments-list"></div>
            </div>

            <div class="card" style="grid-column: 1 / -1;">
                <h2>
                    <i data-lucide="calendar" style="width: 24px; height: 24px;"></i>
                    Мои записи
                </h2>
                <div id="appointments" class="appointments-list">
                    <div class="loading">Загрузка записей...</div>
                </div>
                <a href="/search.html" class="btn" style="margin-top: 1rem;">
                    <i data-lucide="search" style="width: 18px; height: 18px;"></i>
                    Найти психолога
                </a>
            </div>
        </div>

        <!-- Replacement request modal -->
        <div id="replaceModal" style="display:none;position:fixed;inset:0;background:rgba(26,26,46,0.55);z-index:2000;align-items:center;justify-content:center;padding:1rem;">
            <div style="background:#fff;border-radius:1.25rem;max-width:440px;width:100%;padding:2rem;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
                <div style="text-align:center;margin-bottom:1.1rem;">
                    <div style="width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#9F67FA);display:flex;align-items:center;justify-content:center;margin:0 auto 0.7rem;font-size:1.8rem;">🔄</div>
                    <h3 style="font-size:1.2rem;color:#1A1A1A;margin-bottom:0.25rem;">Заменить психолога</h3>
                    <p style="font-size:0.875rem;color:#6B7280;line-height:1.5;">Если специалист не подошёл — поможем подобрать другого бесплатно. Расскажите, что было не так (по желанию) — учтём при подборе.</p>
                </div>
                <div id="replacePsychName" style="background:#F4F0FF;border:1px solid #E9D5FF;border-radius:0.6rem;padding:0.55rem 0.8rem;font-size:0.85rem;color:#5B21B6;margin-bottom:0.7rem;"></div>
                <label style="display:block;font-size:0.8125rem;font-weight:600;color:#374151;margin-bottom:0.3rem;">Что не подошло? (необязательно)</label>
                <textarea id="replaceReason" placeholder="Напр.: не сошлись по подходу, неудобное время, хочу другого специалиста..." style="width:100%;height:80px;padding:0.7rem 0.9rem;border:2px solid #E5E7EB;border-radius:0.7rem;font-size:0.9rem;outline:none;font-family:inherit;resize:vertical;margin-bottom:0.7rem;"></textarea>
                <div id="replaceMsg" style="display:none;font-size:0.85rem;margin-bottom:0.6rem;"></div>
                <button onclick="submitReplace()" id="replaceSubmit" style="width:100%;padding:0.85rem;background:linear-gradient(135deg,#7C3AED,#9F67FA);color:#fff;border:none;border-radius:0.75rem;font-weight:700;font-size:0.9375rem;cursor:pointer;font-family:inherit;margin-bottom:0.5rem;">Отправить заявку и подобрать</button>
                <button onclick="closeReplace()" style="width:100%;padding:0.6rem;background:#F3F4F6;border:none;border-radius:0.75rem;color:#374151;font-weight:600;font-size:0.875rem;cursor:pointer;font-family:inherit;">Отмена</button>
            </div>
        </div>

        <script src="/js/api.js"></script>
        <script src="/js/auth.js"></script>
        <script src="/js/header.js"></script>
        <script>
            // Update User Info in Dashboard Header (Legacy/Custom support)
            window.addEventListener('load', async () => {
                if (window.Auth) {
                    const user = await window.Auth.getCurrentUser();
                    if (user) {
                        document.getElementById('userName').textContent = `${user.first_name} ${user.last_name}`.trim();
                        const initial = (user.first_name || 'U').charAt(0).toUpperCase();

                        const avatarImg = document.querySelector('#userAvatar img');
                        const avatarSpan = document.getElementById('userInitial');

                        if (user.avatar) {
                            avatarImg.src = user.avatar;
                            avatarImg.style.display = 'block';
                            avatarSpan.style.display = 'none';
                        } else {
                            avatarImg.style.display = 'none';
                            avatarSpan.style.display = 'block';
                            avatarSpan.textContent = initial;
                        }
                    }
                }
            });

            const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
                'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

            async function psyLogout() {
                try { sessionStorage.removeItem('psy_user'); } catch(e) {}
                try {
                    if (window.Auth && window.Auth.logout) { await window.Auth.logout(); return; }
                    await fetch('/api/auth.php?action=logout', { method: 'POST', credentials: 'include' });
                } catch (e) {}
                window.location.href = '/';
            }
            window.psyLogout = psyLogout;

            async function init() {
                try {
                    if (!window.Auth || !window.Auth.getCurrentUser) {
                        window.location.href = '/login.html';
                        return;
                    }

                    const user = await window.Auth.getCurrentUser();
                    if (!user) {
                        window.location.href = '/login.html?redirect=' + encodeURIComponent('/client-dashboard.html');
                        return;
                    }

                    // Психолог тоже может быть клиентом: показываем его клиентские записи здесь,
                    // с быстрым переходом в кабинет специалиста.
                    if (user.role === 'psychologist') {
                        const switchBanner = document.createElement('div');
                        switchBanner.style.cssText = 'background:#F3E8FF;border:1.5px solid #C4B5FD;border-radius:1rem;padding:0.875rem 1.25rem;margin-bottom:1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;';
                        switchBanner.innerHTML = `
                            <span style="display:flex;align-items:center;gap:0.5rem;color:#5B21B6;font-weight:600;font-size:0.9375rem;">
                                👤 Вы просматриваете записи как клиент
                            </span>
                            <a href="/psychologist-dashboard.html" style="display:inline-flex;align-items:center;gap:0.375rem;padding:0.5rem 1rem;background:linear-gradient(135deg,#7C3AED,#9F67FA);color:white;text-decoration:none;border-radius:0.625rem;font-size:0.875rem;font-weight:600;">
                                Перейти в кабинет психолога →
                            </a>`;
                        document.querySelector('.cards').parentNode.insertBefore(switchBanner, document.querySelector('.cards'));
                    }

                    document.getElementById('userName').textContent =
                        `${user.first_name || ''} ${user.last_name || ''}`.trim() || 'Профиль';
                    document.getElementById('userInitial').textContent =
                        (user.first_name || 'U').charAt(0).toUpperCase();

                    // Проверка на заморозку аккаунта
                    if (user.is_frozen) {
                        const frozenBanner = document.createElement('div');
                        frozenBanner.innerHTML = `
                        <div style="background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%); color: white; padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; text-align: center;">
                            <h3 style="margin-bottom: 0.5rem;">⚠️ Ваш аккаунт заморожен</h3>
                            <p style="opacity: 0.9;">Функционал ограничен. Для разблокировки свяжитесь с поддержкой: support@psytalk.pro</p>
                        </div>
                    `;
                        document.querySelector('.container').insertBefore(frozenBanner, document.querySelector('.cards'));
                    }

                    await loadPackages();
                    await loadAppointments();

                    if (typeof lucide !== 'undefined') { try { lucide.createIcons(); } catch(e) {} }
                } catch (error) {
                    console.error('Init error:', error);
                    window.location.href = '/login.html';
                }
            }

            async function loadPackages() {
                const card = document.getElementById('packagesCard');
                const list = document.getElementById('packagesList');
                try {
                    const r = await fetch('/api/packages.php?action=list', { credentials: 'include' });
                    const d = await r.json();
                    const rows = (d && d.data) || [];
                    if (!rows.length) { card.style.display = 'none'; return; }
                    card.style.display = 'block';
                    list.innerHTML = rows.map(p => {
                        const remaining = p.remaining != null ? p.remaining : Math.max(0, p.total_sessions - p.used_sessions);
                        const total = p.total_sessions;
                        const isActive = p.state === 'active' && remaining > 0;
                        const stLabel = p.state === 'used' ? '<span class="appointment-status status-completed">Использован</span>'
                            : p.state === 'expired' ? '<span class="appointment-status status-cancelled">Истёк</span>'
                            : '<span class="appointment-status status-scheduled">Активен</span>';
                        const expires = p.expires_at ? ('до ' + new Date(String(p.expires_at).replace(' ','T')).toLocaleDateString('ru-RU')) : '';
                        return `
                        <div class="appointment-item">
                            <div class="appointment-info">
                                <div class="appointment-psychologist">🎟 Абонемент · ${psychEsc(p.psychologist_name || 'Психолог')}</div>
                                <div class="appointment-datetime">Осталось <b style="color:#7C3AED;">${remaining}</b> из ${total} сессий ${expires ? '· ' + expires : ''}</div>
                            </div>
                            ${stLabel}
                            <div class="appointment-actions">
                                ${isActive ? `<a href="/book.html?id=${p.psychologist_id}&pkg=${p.id}" class="btn btn-small" title="Записаться по абонементу">📅 Записаться по абонементу</a>` : ''}
                            </div>
                        </div>`;
                    }).join('');
                } catch (e) { card.style.display = 'none'; }
            }
            function psychEsc(s){ const d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }

            async function loadAppointments() {
                const container = document.getElementById('appointments');

                try {
                    const response = await fetch('/api/appointments.php?action=my', {
                        credentials: 'include'
                    });
                    const appointments = await response.json();

                    if (appointments && appointments.error) {
                        container.innerHTML = `<div class="empty-state">${appointments.error}</div>`;
                        return;
                    }

                    const list = Array.isArray(appointments) ? appointments : [];

                    if (list.length === 0) {
                        container.innerHTML = `
                        <div class="empty-state">
                            <p>У вас пока нет записей</p>
                            <p style="font-size: 0.9rem; margin-top: 0.5rem;">Найдите психолога и запишитесь на консультацию</p>
                        </div>
                    `;
                        return;
                    }

                    const fmtLabels = {video:'📹 Видео', chat:'💬 Чат', phone:'📞 Звонок', audio:'📞 Аудио'};

                    container.innerHTML = list.map(a => {
                        const date = new Date(a.date_time);
                        const dateStr = `${date.getDate()} ${MONTHS[date.getMonth()]}, ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
                        const psychName = `${a.psychologist_first_name || ''} ${a.psychologist_last_name || ''}`.trim() || 'Психолог';
                        const fmt = a.format ? (fmtLabels[a.format] || a.format) : '';

                        let statusClass = 'status-scheduled';
                        let statusText = 'Запланировано';
                        if (a.status === 'completed') {
                            statusClass = 'status-completed';
                            statusText = 'Завершено';
                        } else if (a.status === 'cancelled') {
                            statusClass = 'status-cancelled';
                            statusText = 'Отменено';
                        }

                        const canCancel = a.status === 'scheduled' && new Date(a.date_time) > new Date();
                        const hoursUntil = (new Date(a.date_time) - new Date()) / 36e5;
                        const lateCancel = hoursUntil < 24;
                        const canReview = a.status === 'completed';
                        const canChat   = a.status !== 'cancelled';

                        return `
                        <div class="appointment-item">
                            <div class="appointment-info">
                                <div class="appointment-psychologist">${psychName}</div>
                                <div class="appointment-datetime">${dateStr}${fmt ? ' · ' + fmt : ''}</div>
                            </div>
                            <span class="appointment-status ${statusClass}">${statusText}</span>
                            <div class="appointment-actions">
                                ${a.psychologist_id ? `<a href="/book.html?id=${a.psychologist_id}" class="btn btn-small" title="Записаться к этому психологу ещё раз">📅 Записаться ещё</a>` : ''}
                                ${canChat ? `<a href="/chat.html?user=${a.psychologist_user_id || a.psychologist_id}${a.psychologist_id ? '&pid=' + a.psychologist_id : ''}" class="btn btn-small btn-outline" title="Написать психологу">💬</a>` : ''}
                                ${canCancel ? `<button class="btn btn-small btn-danger" onclick="cancelAppointment('${a.id}', ${lateCancel ? 'true' : 'false'}, ${Math.round(parseFloat(a.price)||0)})" title="${lateCancel ? 'Менее 24 часов — удерживается 50%' : 'Бесплатная отмена'}">Отменить${lateCancel ? ' (−50%)' : ''}</button>` : ''}
                                ${canReview ? `<button class="btn btn-small btn-outline" onclick="openReview('${a.psychologist_id}')">Отзыв</button>` : ''}
                                ${canChat ? `<button class="btn btn-small btn-outline" onclick="openReplace('${a.psychologist_id}', '${psychName.replace(/'/g, "\\'")}')" title="Не подошёл — подберём другого бесплатно">🔄 Заменить</button>` : ''}
                            </div>
                        </div>
                    `;
                    }).join('');

                } catch (error) {
                    console.error('Load appointments error:', error);
                    container.innerHTML = '<div class="empty-state">Ошибка загрузки записей</div>';
                }
            }

            async function cancelAppointment(appointmentId, lateCancel, price) {
                let msg = 'Вы уверены, что хотите отменить запись?';
                if (lateCancel) {
                    const fee = Math.round((price || 0) * 0.5);
                    msg = '⚠️ До сессии меньше 24 часов.\n\nПри отмене удерживается 50%'
                        + (price ? ' (' + fee.toLocaleString('ru-RU') + ' ₽), возврат — ' + (price - fee).toLocaleString('ru-RU') + ' ₽' : '')
                        + '.\nЕсли запись по абонементу — сессия сгорает.\n\nВсё равно отменить?';
                }
                if (!confirm(msg)) return;

                try {
                    const response = await fetch('/api/appointments.php?action=update', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({
                            id: appointmentId,
                            status: 'cancelled',
                            late_cancel: !!lateCancel,
                            penalty_pct: lateCancel ? 50 : 0
                        })
                    });

                    const data = await response.json();
                    if (data.error) {
                        alert(data.error);
                    } else {
                        await loadAppointments();
                    }
                } catch (error) {
                    console.error('Cancel error:', error);
                    alert('Ошибка отмены записи');
                }
            }

            function openReview(psychologistId) {
                // Отзыв оставляется на странице психолога
                window.location.href = `/psychologist-profile.html?id=${psychologistId}`;
            }

            // ── Замена психолога ──────────────────────────────────────────────
            let replaceForPsychId = null;
            function openReplace(psychId, psychName) {
                replaceForPsychId = psychId || null;
                document.getElementById('replacePsychName').textContent = 'Текущий психолог: ' + (psychName || '—');
                document.getElementById('replaceReason').value = '';
                const msg = document.getElementById('replaceMsg'); msg.style.display = 'none';
                const btn = document.getElementById('replaceSubmit'); btn.disabled = false; btn.textContent = 'Отправить заявку и подобрать';
                document.getElementById('replaceModal').style.display = 'flex';
            }
            function closeReplace() { document.getElementById('replaceModal').style.display = 'none'; }
            window.openReplace = openReplace; window.closeReplace = closeReplace;

            async function submitReplace() {
                const reason = document.getElementById('replaceReason').value.trim();
                const msg = document.getElementById('replaceMsg');
                const btn = document.getElementById('replaceSubmit');
                btn.disabled = true; btn.textContent = 'Отправляем...';
                try {
                    const r = await fetch('/api/replace.php?action=create', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
                        body: JSON.stringify({ current_psychologist_id: replaceForPsychId, reason })
                    });
                    const d = await r.json();
                    if (!d.ok) throw new Error(d.error || 'Ошибка');
                    msg.style.display = 'block'; msg.style.color = '#16A34A';
                    msg.innerHTML = '✅ Заявка принята! Подберите нового психолога сейчас или подождите — мы поможем.';
                    btn.textContent = 'Перейти к подбору →';
                    btn.disabled = false;
                    btn.onclick = function () { window.location.href = '/search.html'; };
                } catch (e) {
                    msg.style.display = 'block'; msg.style.color = '#DC2626';
                    msg.textContent = '⚠️ ' + (e.message || 'Не удалось отправить заявку');
                    btn.disabled = false; btn.textContent = 'Попробовать ещё раз';
                }
            }
            window.submitReplace = submitReplace;

            init();
        </script>
</body>

</html>
