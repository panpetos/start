<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - psytalk.pro</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #F4F0FF;
            min-height: 100vh;
            padding: 0;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }

        .header {
            background: white; border-radius: 1.25rem; padding: 1.75rem 2rem;
            margin-bottom: 1.75rem;
            box-shadow: 0 4px 20px rgba(124,58,237,0.1);
            border: 1px solid #EDE9FF;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header-left h1 { color: #1A1A1A; font-size: 1.75rem; margin-bottom: 0.25rem; letter-spacing: -0.02em; }
        .header-left p { color: #6B7280; font-size: 0.9375rem; }

        .user-info { display: flex; align-items: center; gap: 0.875rem; }
        .user-avatar {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(135deg, #7C3AED 0%, #9F67FA 100%);
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 700; font-size: 1.125rem; overflow: hidden;
            box-shadow: 0 4px 12px rgba(124,58,237,0.3);
        }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }

        .card {
            background: white; border-radius: 1.25rem; padding: 1.75rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: 1px solid #F0ECF8;
            transition: box-shadow 0.2s, transform 0.2s;
        }
        .card:hover { box-shadow: 0 8px 30px rgba(124,58,237,0.12); transform: translateY(-2px); }
        .card h2 {
            color: #7C3AED; margin-bottom: 1rem; font-size: 1.125rem;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .card p { color: #6B7280; line-height: 1.6; }

        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.625rem 1.375rem;
            background: linear-gradient(135deg, #7C3AED 0%, #9F67FA 100%);
            color: white; text-decoration: none; border-radius: 0.625rem;
            font-weight: 600; font-size: 0.9375rem; transition: all 0.2s;
            border: none; cursor: pointer; font-family: inherit;
            box-shadow: 0 3px 10px rgba(124,58,237,0.3);
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(124,58,237,0.4); color: white; }

        .appointments-list { margin-top: 1rem; }
        .appointment-item {
            background: #FAFAFA; padding: 1rem; border-radius: 0.875rem;
            margin-bottom: 0.625rem; display: flex; flex-wrap: wrap;
            justify-content: space-between; align-items: center; gap: 0.75rem;
            border: 1px solid #F0F0F0; transition: border-color 0.2s;
        }
        .appointment-item:hover { border-color: #EDE9FF; }
        .appointment-info { flex: 1; min-width: 120px; word-break: break-word; }
        .appointment-psychologist { font-weight: 600; color: #1A1A1A; margin-bottom: 0.2rem; font-size: 0.9375rem; }
        .appointment-datetime { font-size: 0.8125rem; color: #6B7280; }
        .appointment-status { padding: 0.2rem 0.75rem; border-radius: 2rem; font-size: 0.75rem; font-weight: 600; }
        .status-scheduled { background: #F3E8FF; color: #7C3AED; }
        .status-completed { background: #F0FDF4; color: #16A34A; }
        .status-cancelled { background: #FFF1F2; color: #BE123C; }
        .appointment-actions { display: flex; gap: 0.5rem; }
        .btn-small { padding: 0.4rem 0.875rem; font-size: 0.8125rem; }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: none; }
        .btn-outline {
            background: white; border: 1.5px solid #E2E8F0; color: #374151;
            box-shadow: none;
        }
        .btn-outline:hover { border-color: #7C3AED; color: #7C3AED; background: #FAF5FF; }
        .empty-state { text-align: center; padding: 2rem; color: #9CA3AF; }
        .loading { text-align: center; color: #9CA3AF; padding: 1rem; }
    </style>
</head>

<body>
    <div class="container">
        <!-- Dashboard Content -->
        <div class="header">
            <div class="header-left">
                <h1>Личный кабинет</h1>
                <p>Управление записями и профилем</p>
            </div>
            <div class="user-info">
                <span id="userName" style="font-weight: 600;">Загрузка...</span>
                <div class="user-avatar" id="userAvatar">
                    <img src="" alt="" style="display: none;">
                    <span id="userInitial">?</span>
                </div>
            </div>
        </div>

        <div class="cards">
            <div class="card" style="grid-column: 1 / -1;">
                <h2>
                    <i data-lucide="calendar" style="width: 24px; height: 24px;"></i>
                    Мои записи
                </h2>
                <div id="appointments" class="appointments-list">
                    <div class="loading">Загрузка записей...</div>
                </div>
                <a href="/search.html" class="btn" style="margin-top: 1rem;">
                    <i data-lucide="search" style="width: 18px; height: 18px;"></i>
                    Найти психолога
                </a>
            </div>
        </div>

        <script src="/js/api.js"></script>
        <script src="/js/auth.js"></script>
        <script src="/js/header.js"></script>
        <script>
            // Update User Info in Dashboard Header (Legacy/Custom support)
            window.addEventListener('load', async () => {
                if (window.Auth) {
                    const user = await window.Auth.getCurrentUser();
                    if (user) {
                        document.getElementById('userName').textContent = `${user.first_name} ${user.last_name}`.trim();
                        const initial = (user.first_name || 'U').charAt(0).toUpperCase();

                        const avatarImg = document.querySelector('#userAvatar img');
                        const avatarSpan = document.getElementById('userInitial');

                        if (user.avatar) {
                            avatarImg.src = user.avatar;
                            avatarImg.style.display = 'block';
                            avatarSpan.style.display = 'none';
                        } else {
                            avatarImg.style.display = 'none';
                            avatarSpan.style.display = 'block';
                            avatarSpan.textContent = initial;
                        }
                    }
                }
            });

            const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
                'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

            /* ── Mock appointments (localStorage) ── */
            function getMockAppointments() {
                try { return JSON.parse(localStorage.getItem('psyMockAppointments') || '[]'); }
                catch(_) { return []; }
            }

            function saveMockAppointments(list) {
                try { localStorage.setItem('psyMockAppointments', JSON.stringify(list)); } catch(_) {}
            }

            function cancelMockAppointment(id) {
                if (!confirm('Отменить запись?')) return;
                const list = getMockAppointments().map(a => a.id === id ? {...a, status: 'cancelled'} : a);
                saveMockAppointments(list);
                renderMockAppointments(list);
                if (typeof lucide !== 'undefined') { try { lucide.createIcons(); } catch(e) {} }
            }
            window.cancelMockAppointment = cancelMockAppointment;

            function renderMockAppointments(appts) {
                const container = document.getElementById('appointments');
                if (!appts || appts.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>У вас пока нет записей</p><p style="font-size:0.9rem;margin-top:0.5rem;">Найдите психолога и запишитесь на консультацию</p></div>';
                    return;
                }
                container.innerHTML = appts.map(a => {
                    const date = new Date(a.date_time);
                    const dateStr = date.getDate() + ' ' + MONTHS[date.getMonth()] + ', ' + date.getHours().toString().padStart(2,'0') + ':' + date.getMinutes().toString().padStart(2,'0');
                    const statusClass = a.status === 'cancelled' ? 'status-cancelled' : 'status-scheduled';
                    const statusText  = a.status === 'cancelled' ? 'Отменено' : 'Запланировано';
                    const canCancel   = a.status === 'scheduled' && new Date(a.date_time) > new Date();
                    const fmtLabels   = {video:'📹 Видео', chat:'💬 Чат', phone:'📞 Звонок', audio:'📞 Аудио'};
                    const mockBadge   = '<span style="background:#FFF8E7;color:#92400E;border:1px solid #F59E0B;border-radius:2rem;padding:0.15rem 0.5rem;font-size:0.7rem;font-weight:600;margin-left:0.375rem;">тестовая</span>';
                    return `<div class="appointment-item">
                        <div class="appointment-info">
                            <div class="appointment-psychologist">${a.psychologist_name}${mockBadge}</div>
                            <div class="appointment-datetime">${dateStr} · ${fmtLabels[a.format]||a.format} · ${(a.price||0).toLocaleString('ru-RU')} ₽</div>
                        </div>
                        <span class="appointment-status ${statusClass}">${statusText}</span>
                        <div class="appointment-actions">
                            ${canCancel ? `<button class="btn btn-small btn-danger" onclick="cancelMockAppointment('${a.id}')">Отменить</button>` : ''}
                        </div>
                    </div>`;
                }).join('');
                if (typeof lucide !== 'undefined') { try { lucide.createIcons(); } catch(e) {} }
            }

            function showDemoBanner(isLoggedIn) {
                const banner = document.createElement('div');
                banner.style.cssText = 'background:#FFF8E7;border:1.5px solid #F59E0B;border-radius:1rem;padding:1rem 1.5rem;margin-bottom:1.5rem;display:flex;align-items:flex-start;gap:0.875rem;';
                const body = isLoggedIn
                    ? 'Записи помечены <b>тестовая</b> — они созданы через пробную оплату и хранятся только в этом браузере, а не в базе данных. Как только платёжная система подключена, записи будут сохраняться в реальном времени.'
                    : 'Записи выше созданы через тестовую оплату и хранятся только в вашем браузере. Чтобы всё работало по-настоящему — <a href="/login.html" style="color:#7C3AED;font-weight:600;">войдите или зарегистрируйтесь</a>.';
                banner.innerHTML = `<span style="font-size:1.375rem;flex-shrink:0;">🧪</span>
                    <div>
                        <div style="font-weight:700;color:#92400E;margin-bottom:0.25rem;">Тестовые записи — данные не сохраняются в базе</div>
                        <div style="font-size:0.875rem;color:#B45309;line-height:1.5;">${body}</div>
                    </div>`;
                const cards = document.querySelector('.cards');
                cards.parentNode.insertBefore(banner, cards);
            }

            async function init() {
                try {
                    const mockAppts = getMockAppointments();

                    if (!window.Auth || !window.Auth.getCurrentUser) {
                        if (mockAppts.length > 0) {
                            document.getElementById('userName').textContent = 'Гостевой просмотр';
                            document.getElementById('userInitial').textContent = '👤';
                            showDemoBanner();
                            renderMockAppointments(mockAppts);
                            if (typeof lucide !== 'undefined') { try { lucide.createIcons(); } catch(e) {} }
                            return;
                        }
                        window.location.href = '/login.html';
                        return;
                    }

                    const user = await window.Auth.getCurrentUser();
                    if (!user) {
                        if (mockAppts.length > 0) {
                            document.getElementById('userName').textContent = 'Гостевой просмотр';
                            document.getElementById('userInitial').textContent = '👤';
                            showDemoBanner();
                            renderMockAppointments(mockAppts);
                            if (typeof lucide !== 'undefined') { try { lucide.createIcons(); } catch(e) {} }
                            return;
                        }
                        window.location.href = '/login.html';
                        return;
                    }

                    // Psychologists who have client bookings stay here to see them;
                    // otherwise redirect to their provider dashboard.
                    if (user.role === 'psychologist') {
                        const mockAppts = getMockAppointments();
                        if (mockAppts.length === 0) {
                            // No client bookings — go to provider view
                            window.location.href = '/psychologist-dashboard.html';
                            return;
                        }
                        // Has client bookings — show them with a switch link
                        document.getElementById('userName').textContent =
                            `${user.first_name || ''} ${user.last_name || ''}`.trim() || 'Психолог';
                        document.getElementById('userInitial').textContent =
                            (user.first_name || 'П').charAt(0).toUpperCase();

                        const switchBanner = document.createElement('div');
                        switchBanner.style.cssText = 'background:#F3E8FF;border:1.5px solid #C4B5FD;border-radius:1rem;padding:0.875rem 1.25rem;margin-bottom:1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;';
                        switchBanner.innerHTML = `
                            <span style="display:flex;align-items:center;gap:0.5rem;color:#5B21B6;font-weight:600;font-size:0.9375rem;">
                                👤 Вы просматриваете записи как клиент
                            </span>
                            <a href="/psychologist-dashboard.html" style="display:inline-flex;align-items:center;gap:0.375rem;padding:0.5rem 1rem;background:linear-gradient(135deg,#7C3AED,#9F67FA);color:white;text-decoration:none;border-radius:0.625rem;font-size:0.875rem;font-weight:600;">
                                Перейти в кабинет психолога →
                            </a>`;
                        document.querySelector('.cards').parentNode.insertBefore(switchBanner, document.querySelector('.cards'));

                        showDemoBanner(true);
                        renderMockAppointments(mockAppts);
                        if (typeof lucide !== 'undefined') { try { lucide.createIcons(); } catch(e) {} }
                        return;
                    }

                    // Проверка на заморозку аккаунта
                    if (user.is_frozen) {
                        const frozenBanner = document.createElement('div');
                        frozenBanner.innerHTML = `
                        <div style="background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%); color: white; padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; text-align: center;">
                            <h3 style="margin-bottom: 0.5rem;">⚠️ Ваш аккаунт заморожен</h3>
                            <p style="opacity: 0.9;">Функционал ограничен. Для разблокировки свяжитесь с поддержкой: support@psytalk.pro</p>
                        </div>
                    `;
                        document.querySelector('.container').insertBefore(frozenBanner, document.querySelector('.cards'));
                    }

                    // Load appointments
                    await loadAppointments();

                    if (typeof lucide !== 'undefined') {
                        lucide.createIcons();
                    }
                } catch (error) {
                    console.error('Init error:', error);
                    window.location.href = '/login.html';
                }
            }

            async function loadAppointments() {
                const container = document.getElementById('appointments');
                const mockAppts = getMockAppointments();

                try {
                    const response = await fetch('/api/appointments.php?action=my', {
                        credentials: 'include'
                    });
                    const appointments = await response.json();

                    if (appointments.error) {
                        // API failed — fall back to mock appointments only
                        if (mockAppts.length > 0) { showDemoBanner(true); renderMockAppointments(mockAppts); }
                        else container.innerHTML = `<div class="empty-state">${appointments.error}</div>`;
                        return;
                    }

                    // Prepend any mock (test) appointments not already in the API list
                    const apiIds = new Set((appointments || []).map(a => a.id));
                    const extraMock = mockAppts.filter(a => !apiIds.has(a.id));
                    if (extraMock.length > 0) showDemoBanner(true);

                    const allAppts = [...extraMock, ...(appointments || [])];

                    if (allAppts.length === 0) {
                        container.innerHTML = `
                        <div class="empty-state">
                            <p>У вас пока нет записей</p>
                            <p style="font-size: 0.9rem; margin-top: 0.5rem;">Найдите психолога и запишитесь на консультацию</p>
                        </div>
                    `;
                        return;
                    }

                    container.innerHTML = allAppts.map(a => {
                        if (a.is_mock) {
                            // Mock entry — rendered by reusing same markup with mock badge
                            const date = new Date(a.date_time);
                            const dateStr = `${date.getDate()} ${MONTHS[date.getMonth()]}, ${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
                            const statusClass = a.status === 'cancelled' ? 'status-cancelled' : 'status-scheduled';
                            const statusText  = a.status === 'cancelled' ? 'Отменено' : 'Запланировано';
                            const fmtLabels   = {video:'📹 Видео', chat:'💬 Чат', phone:'📞 Звонок', audio:'📞 Аудио'};
                            const canCancel   = a.status === 'scheduled' && new Date(a.date_time) > new Date();
                            return `<div class="appointment-item">
                                <div class="appointment-info">
                                    <div class="appointment-psychologist">${a.psychologist_name}<span style="background:#FFF8E7;color:#92400E;border:1px solid #F59E0B;border-radius:2rem;padding:0.15rem 0.5rem;font-size:0.7rem;font-weight:600;margin-left:0.375rem;">тестовая</span></div>
                                    <div class="appointment-datetime">${dateStr} · ${fmtLabels[a.format]||a.format} · ${(a.price||0).toLocaleString('ru-RU')} ₽</div>
                                </div>
                                <span class="appointment-status ${statusClass}">${statusText}</span>
                                <div class="appointment-actions">
                                    ${canCancel ? `<button class="btn btn-small btn-danger" onclick="cancelMockAppointment('${a.id}')">Отменить</button>` : ''}
                                </div>
                            </div>`;
                        }
                        const date = new Date(a.date_time);
                        const dateStr = `${date.getDate()} ${MONTHS[date.getMonth()]}, ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
                        const psychName = `${a.psychologist_first_name || ''} ${a.psychologist_last_name || ''}`.trim() || 'Психолог';

                        let statusClass = 'status-scheduled';
                        let statusText = 'Запланировано';
                        if (a.status === 'completed') {
                            statusClass = 'status-completed';
                            statusText = 'Завершено';
                        } else if (a.status === 'cancelled') {
                            statusClass = 'status-cancelled';
                            statusText = 'Отменено';
                        }

                        const canCancel = a.status === 'scheduled' && new Date(a.date_time) > new Date();
                        const canReview = a.status === 'completed';

                        return `
                        <div class="appointment-item">
                            <div class="appointment-info">
                                <div class="appointment-psychologist">${psychName}</div>
                                <div class="appointment-datetime">${dateStr}</div>
                            </div>
                            <span class="appointment-status ${statusClass}">${statusText}</span>
                            <div class="appointment-actions">
                                <a href="/chat.html?user=${a.psychologist_id}" class="btn btn-small btn-outline" title="Написать психологу">💬</a>
                                ${canCancel ? `<button class="btn btn-small btn-danger" onclick="cancelAppointment('${a.id}')">Отменить</button>` : ''}
                                ${canReview ? `<button class="btn btn-small btn-outline" onclick="openReview('${a.id}')">Отзыв</button>` : ''}
                            </div>
                        </div>
                    `;
                    }).join('');

                } catch (error) {
                    console.error('Load appointments error:', error);
                    container.innerHTML = '<div class="empty-state">Ошибка загрузки записей</div>';
                }
            }

            async function cancelAppointment(appointmentId) {
                if (!confirm('Вы уверены, что хотите отменить запись?')) return;

                try {
                    const response = await fetch('/api/appointments.php?action=update', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({
                            id: appointmentId,
                            status: 'cancelled'
                        })
                    });

                    const data = await response.json();
                    if (data.error) {
                        alert(data.error);
                    } else {
                        await loadAppointments();
                    }
                } catch (error) {
                    console.error('Cancel error:', error);
                    alert('Ошибка отмены записи');
                }
            }

            function openReview(appointmentId) {
                window.location.href = `/review.html?appointment_id=${appointmentId}`;
            }

            init();
        </script>
</body>

</html>
